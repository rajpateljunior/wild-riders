/* ---- build all world sprites for one biome (async) ---- */
const worldCache = {};
async function buildWorldSprites(biome) {
  if (worldCache[biome.id]) return worldCache[biome.id];
  const set = BIOME_SCENERY[biome.id];
  const ids = new Set(["ramp", "crate", "repair", "arch", "startgate", "crowd", "banner", "log", "vent"]);
  set.near.forEach(([id]) => ids.add(id));
  set.far.forEach((id) => ids.add(id));
  set.obstacles.forEach((id) => ids.add(id));
  set.special.forEach((id) => ids.add(id));
  ["lantern", "crystal", "reeds"].forEach((id) => ids.add(id));
  if (set.zones) Object.values(set.zones).forEach((z) => z.near.forEach(([id]) => ids.add(id)));
  const kit = biomeKit(biome);
  const out = { sprites: {}, items: {} };
  await Promise.all([...ids].map((id) => [id, W[id]]).concat(Object.entries(kit)).map(async ([id, d]) => {
    const scale = d.ww > 9000 ? 0.6 : 1;            // giant tunnel mouths don't need full resolution
    const c = await svgToCanvas(SV.wrap(d.w, d.h, d.svg()), d.w * scale, d.h * scale);
    out.sprites[id] = { c, ww: d.ww, wh: d.ww * d.h / d.w, solid: d.solid, obstacle: d.obstacle, glow: d.glow, id };
  }));
  await Promise.all(Object.keys(ITEMS).map(async (id) => { out.items[id] = await svgToCanvas(itemSVG(id), 64, 64); }));
  out.far = await svgToCanvas(bgSVG(biome, "far"), 2048, 420);
  out.near = await svgToCanvas(bgSVG(biome, "near"), 2048, 300);
  worldCache[biome.id] = out;
  return out;
}

// ===== audio.js =====
/* Synthesized audio: engine/wind, SFX and a procedural soundtrack per biome. No audio files. */

const SFX = (() => {
  let ac = null, master, musicBus, sfxBus, noiseBuf;
  let musicOn = true, sfxOn = true, musicVol = 0.45, sfxVol = 0.8;
  let unlocked = false;
  const engines = [];
  let seq = null;

  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    const comp = ac.createDynamicsCompressor(); comp.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = musicOn ? musicVol : 0; musicBus.connect(comp);
    sfxBus = ac.createGain(); sfxBus.gain.value = sfxOn ? sfxVol : 0; sfxBus.connect(comp);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function unlock() {
    init();
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    if (!unlocked) {
      // iOS: play a silent buffer inside the gesture
      const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
      s.buffer = b; s.connect(ac.destination); s.start(0);
      unlocked = true;
    }
  }
  const T = () => ac.currentTime;

  function tone(freq, dur, type = "square", vol = 0.2, bus = sfxBus, when = 0, slide = 0, attack = 0.005) {
    if (!ac) return;
    const t = T() + when;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol = 0.3, f = 1200, q = 1, type = "bandpass", when = 0, bus = sfxBus, fSlide = 0) {
    if (!ac) return;
    const t = T() + when;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (fSlide) fl.frequency.exponentialRampToValueAtTime(Math.max(40, f * fSlide), t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(bus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }

  const sounds = {
    click: () => { tone(880, 0.06, "square", 0.08); tone(1320, 0.05, "square", 0.05, sfxBus, 0.04); },
    back: () => tone(520, 0.08, "triangle", 0.1, sfxBus, 0, 0.6),
    beep: () => tone(660, 0.18, "square", 0.16),
    go: () => { tone(1320, 0.5, "square", 0.18); tone(990, 0.5, "square", 0.08); },
    punch: () => { noise(0.08, 0.5, 900, 0.8); tone(140, 0.12, "sine", 0.5, sfxBus, 0, 0.5); },
    kick: () => { noise(0.14, 0.6, 600, 0.7); tone(100, 0.2, "sine", 0.7, sfxBus, 0, 0.4); tone(300, 0.06, "square", 0.08); },
    swing: () => noise(0.12, 0.18, 2200, 2, "bandpass", 0, sfxBus, 0.4),
    throw: () => noise(0.22, 0.25, 600, 3, "bandpass", 0, sfxBus, 4),
    hit: () => { noise(0.18, 0.5, 400, 0.6); tone(220, 0.1, "square", 0.12, sfxBus, 0, 0.5); },
    pickup: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.09, "square", 0.08, sfxBus, i * 0.05)); },
    repair: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.14, "triangle", 0.12, sfxBus, i * 0.06)); },
    tier: () => { tone(900, 0.07, "triangle", 0.12); tone(1350, 0.09, "triangle", 0.1, sfxBus, 0.05); },
    pad: () => { tone(300, 0.35, "sawtooth", 0.12, sfxBus, 0, 4); noise(0.35, 0.2, 800, 2, "bandpass", 0, sfxBus, 5); },
    boost: () => noise(0.5, 0.25, 500, 2, "bandpass", 0, sfxBus, 6),
    jump: () => tone(220, 0.25, "triangle", 0.12, sfxBus, 0, 2.2),
    land: () => { noise(0.12, 0.4, 300, 0.7, "lowpass"); tone(80, 0.15, "sine", 0.4, sfxBus, 0, 0.5); },
    crash: () => { noise(0.5, 0.6, 700, 0.4, "lowpass", 0, sfxBus, 0.2); tone(90, 0.3, "sawtooth", 0.2, sfxBus, 0, 0.4); },
    bump: () => noise(0.08, 0.25, 500, 1),
    trick: () => { tone(1047, 0.12, "square", 0.1); tone(1568, 0.2, "square", 0.08, sfxBus, 0.08); },
    whoosh: () => noise(0.3, 0.2, 1500, 2, "bandpass", 0, sfxBus, 0.3),
    wipe: () => { noise(0.8, 0.6, 1200, 0.5, "lowpass", 0, sfxBus, 0.1); tone(400, 0.6, "sawtooth", 0.15, sfxBus, 0, 0.25); },
    finish: () => { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i === 6 ? 0.6 : 0.14, "square", 0.12, sfxBus, i * 0.11)); },
    storm: () => noise(1.6, 0.3, 300, 0.5, "lowpass", 0, sfxBus, 3),
    unlock: () => { [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.2, "triangle", 0.14, sfxBus, i * 0.09)); },
  };
  function play(name) { if (!ac || !sfxOn) return; const f = sounds[name]; if (f) f(); }

  /* Engine voice per local human: motor (dirt/atv) or wind + freewheel (bikes) */
  function engineStart(i, vehId) {
    if (!ac) return;
    engineStop(i);
    const g = ac.createGain(); g.gain.value = 0; g.connect(sfxBus);
    const e = { g, vehId, osc: [], wind: null, lp: null };
    const wind = ac.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true;
    const wf = ac.createBiquadFilter(); wf.type = "bandpass"; wf.frequency.value = 600; wf.Q.value = 0.6;
    const wg = ac.createGain(); wg.gain.value = 0;
    wind.connect(wf); wf.connect(wg); wg.connect(g); wind.start();
    e.wind = { src: wind, f: wf, g: wg };
    if (vehId === "dirt" || vehId === "atv") {
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700; lp.Q.value = 4; lp.connect(g);
      const mg = ac.createGain(); mg.gain.value = 0.12; mg.connect(lp);
      for (const det of [0, 7]) { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = 50; o.detune.value = det * 10; o.connect(mg); o.start(); e.osc.push(o); }
      e.lp = lp; e.mg = mg;
    } else {
      const o = ac.createOscillator(); o.type = "square"; o.frequency.value = 8;
      const tg = ac.createGain(); tg.gain.value = 0;
      const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000;
      o.connect(hp); hp.connect(tg); tg.connect(g); o.start();
      e.osc.push(o); e.tick = tg;
    }
    engines[i] = e;
  }
  function engineUpdate(i, speedPct, boosting, air, vol = 1) {
    const e = engines[i];
    if (!e || !ac) return;
    const t = T();
    e.g.gain.setTargetAtTime(sfxOn ? 0.5 * vol : 0, t, 0.1);
    e.wind.g.gain.setTargetAtTime(0.05 + speedPct * speedPct * 0.32 + (boosting ? 0.08 : 0), t, 0.1);   // wind rises with speed
    e.wind.f.frequency.setTargetAtTime(400 + speedPct * 900 + (boosting ? 500 : 0), t, 0.1);
    if (e.lp) {
      const f = 45 + speedPct * 110 + (boosting ? 30 : 0) + (air ? 40 : 0);
      e.osc.forEach((o) => o.frequency.setTargetAtTime(f, t, 0.08));
      e.lp.frequency.setTargetAtTime(500 + speedPct * 1400, t, 0.1);
    } else {
      e.osc[0].frequency.setTargetAtTime(6 + speedPct * 22, t, 0.1);
      e.tick.gain.setTargetAtTime(air ? 0.04 : 0.015 + speedPct * 0.02, t, 0.1);
    }
  }
  function engineStop(i) {
    const e = engines[i];
    if (!e) return;
    try { e.osc.forEach((o) => o.stop()); e.wind.src.stop(); } catch (_) {}
    e.g.disconnect();
    engines[i] = null;
  }
  function enginesOff() { for (let i = 0; i < engines.length; i++) engineStop(i); }

  /* ---------- procedural music ---------- */
  const SONGS = [
    { bpm: 150, root: 45, scale: [0, 3, 5, 7, 10], prog: [0, 0, 5, 3], lead: "square", feel: "rock" },     // forest: A minor pentatonic
    { bpm: 138, root: 43, scale: [0, 1, 4, 5, 7, 8, 10], prog: [0, 1, 0, 6], lead: "sawtooth", feel: "desert" }, // G phrygian dominant
    { bpm: 164, root: 47, scale: [0, 2, 3, 5, 7, 8, 10], prog: [0, 5, 3, 6], lead: "square", feel: "dnb" }, // B minor
    { bpm: 142, root: 50, scale: [0, 2, 4, 7, 9], prog: [0, 3, 4, 3], lead: "triangle", feel: "dhol" },    // D major pentatonic, dhol groove
    { bpm: 156, root: 40, scale: [0, 1, 3, 5, 7, 8, 10], prog: [0, 1, 5, 6], lead: "sawtooth", feel: "metal" }, // E phrygian
    { bpm: 128, root: 42, scale: [0, 2, 3, 7, 8], prog: [0, 5, 3, 4], lead: "triangle", feel: "synth" },   // F# minor, dreamy
    { bpm: 120, root: 48, scale: [0, 2, 4, 7, 9], prog: [0, 5, 3, 4], lead: "square", feel: "menu" },
  ];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function kick(t, v = 0.9) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.3); }
  function snare(t, v = 0.35) { const s = ac.createBufferSource(); s.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1500; const g = ac.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16); s.connect(f); f.connect(g); g.connect(musicBus); s.start(t, Math.random()); s.stop(t + 0.2); const o = ac.createOscillator(), og = ac.createGain(); o.frequency.value = 190; og.gain.setValueAtTime(v * 0.5, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.08); o.connect(og); og.connect(musicBus); o.start(t); o.stop(t + 0.1); }
  function hat(t, v = 0.08, open) { const s = ac.createBufferSource(); s.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 7000; const g = ac.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.18 : 0.04)); s.connect(f); f.connect(g); g.connect(musicBus); s.start(t, Math.random()); s.stop(t + 0.2); }
  function tom(t, f0, v = 0.4) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.6, t + 0.2); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.3); }
  function note(t, m, dur, type, v, cutoff = 2400) {
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = type; o.frequency.value = mtof(m); f.type = "lowpass"; f.frequency.value = cutoff;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur + 0.02);
  }
  function music(idx) {
    init();
    if (!ac) return;
    stopMusic();
    const S = SONGS[idx];
    const step = 60 / S.bpm / 4;
    let n = 0, nextT = T() + 0.08;
    const R = rng(idx * 31 + 5);
    const motif = Array.from({ length: 16 }, () => (R() < 0.55 ? (R() * S.scale.length) | 0 : -1));
    const motif2 = Array.from({ length: 16 }, () => (R() < 0.45 ? (R() * S.scale.length) | 0 : -1));
    const sc = (deg, oct = 0) => S.root + S.scale[((deg % S.scale.length) + S.scale.length) % S.scale.length] + 12 * (oct + Math.floor(deg / S.scale.length));
    seq = setInterval(() => {
      if (!ac || ac.state !== "running") return;
      while (nextT < T() + 0.15) {
        const s16 = n % 16, bar = Math.floor(n / 16), chord = S.prog[bar % 4];
        const sect = Math.floor(bar / 8) % 2; // A/B sections
        const t = nextT;
        // drums
        if (S.feel === "menu") { if (s16 % 8 === 0) kick(t, 0.6); if (s16 % 8 === 4) snare(t, 0.2); if (s16 % 2 === 0) hat(t, 0.04); }
        else if (S.feel === "dnb") { if (s16 === 0 || s16 === 10) kick(t); if (s16 === 4 || s16 === 12) snare(t, 0.4); hat(t, s16 % 2 ? 0.05 : 0.08); }
        else if (S.feel === "dhol") { if ([0, 3, 6, 10].includes(s16)) tom(t, 90, 0.55); if ([2, 8, 11, 14].includes(s16)) tom(t, 260, 0.25); if (s16 === 4 || s16 === 12) snare(t, 0.22); if (s16 % 2 === 0) hat(t, 0.05); }
        else if (S.feel === "metal") { if (s16 % 2 === 0) kick(t, 0.7); if (s16 === 4 || s16 === 12) snare(t, 0.42); if (s16 % 4 === 2) hat(t, 0.08, true); }
        else { if (s16 === 0 || s16 === 8 || (s16 === 11 && sect)) kick(t); if (s16 === 4 || s16 === 12) snare(t); if (s16 % 2 === 0) hat(t, 0.07, s16 === 14); }
        // bass
        const bassPat = S.feel === "metal" ? s16 % 2 === 0 : S.feel === "synth" ? s16 % 4 === 0 : [0, 3, 6, 8, 10, 14].includes(s16);
        if (bassPat) note(t, sc(chord) - 12 + (s16 === 14 ? 12 : 0), step * 1.8, "sawtooth", 0.16, 500);
        // pad on bar start
        if (s16 === 0 && S.feel !== "metal") [0, 2, 4].forEach((d) => note(t, sc(chord + d, 1), step * 15, "triangle", 0.035, 1500));
        // lead motif
        const m = (sect ? motif2 : motif)[s16];
        if (m >= 0 && bar % 8 !== 7) note(t, sc(chord + m, 2), step * (S.feel === "synth" ? 3 : 1.6), S.lead, S.lead === "sawtooth" ? 0.05 : 0.06, 3200);
        if (S.feel === "desert" && s16 % 4 === 0) note(t, sc(chord + 4, 2), step * 0.8, "triangle", 0.04);
        nextT += step; n++;
      }
    }, 30);
  }
  function stopMusic() { if (seq) { clearInterval(seq); seq = null; } }

  function setMusic(on) { musicOn = on; if (musicBus) musicBus.gain.setTargetAtTime(on ? musicVol : 0, T(), 0.05); }

    // inside a tunnel the sky becomes rock ceiling
    const cg = ctx.createLinearGradient(0, 0, 0, hz + h * 0.1);
    const rc = biome.id === "tundra" ? "#0c1a2c" : shade(biome.rock[0], -0.55);
    cg.addColorStop(0, rgba(shade(rc, -0.3), tun)); cg.addColorStop(1, rgba(rc, tun));
    ctx.fillStyle = cg; ctx.fillRect(-w * 0.2, -h * 0.2, w * 1.4, hz + h * 0.4);
  }

  // ---- road ----
  const segs = track.segs;
  const dd = race.split ? Math.min(RENDER.drawDist, 110) : RENDER.drawDist;
  const fogC = race.stormFog > 0 ? mix(biome.fog, "#d9a868", race.stormFog) : biome.fog;
  const fogDensity = biome.dark ? 2.2 : 1.4 + race.stormFog * 5;
  let maxy = h;
  let x = 0, dx = -(base.curve * basePct);
  const drawn = [];
  for (let n = 0; n < dd; n++) {
    const i = base.i + n;
    if (i >= track.N) break;
    const s = segs[i];
    const z1 = i * SEG - camZ, z2 = (i + 1) * SEG - camZ;
    s.vis = false;
    if (z1 <= 1) { x += dx; dx += s.curve; continue; }
    const sc1 = CAM_D / z1, sc2 = CAM_D / z2;
    s.sc1 = sc1; s.sc2 = sc2;
    s.sx1 = w / 2 + sc1 * (x - camX) * K;  s.sy1 = hz - sc1 * (s.y1 - pitch * z1 - camY) * K;
    s.sx2 = w / 2 + sc2 * (x + dx - camX) * K; s.sy2 = hz - sc2 * (s.y2 - pitch * z2 - camY) * K;
    s.rw1 = sc1 * ROAD_W * K; s.rw2 = sc2 * ROAD_W * K;
    s.clip = maxy;
    s.fog = 1 - Math.exp(-((n / dd) ** 2) * fogDensity);
    x += dx; dx += s.curve;
    if (s.sy2 >= s.sy1 || s.sy2 >= maxy) { s.vis = true; drawn.push(s); continue; }
    s.vis = true; drawn.push(s);
    drawSegment(ctx, w, s, biome, tnow, maxy);
    if (s.fog > 0.02) { ctx.fillStyle = rgba(fogC, s.fog); ctx.fillRect(0, s.sy2 - 1, w, Math.min(maxy, s.sy1) - s.sy2 + 1); }   // 1px up: the next slice repaints the overlap, so no fog seam
    maxy = s.sy2;
  }

  // ---- sprites, riders, objects (far → near) ----
  const glows = [];
  const buckets = race.buckets;
  for (let k = drawn.length - 1; k >= 0; k--) {
    const s = drawn[k];
    const alpha = 1 - s.fog * 0.85;
    for (const sp of s.sprites) {
      const S = assets.sprites[sp.id];
      if (!S || sp.dead) continue;
      drawSprite(ctx, S, s.sx1 + s.sc1 * sp.x * ROAD_W * K, s.sy1, s.sc1 * K, s.clip, alpha, sp.flat);
      if (S.glow && (biome.dark || tun > 0.05)) glows.push([s.sx1 + s.sc1 * sp.x * ROAD_W * K, s.sy1 - S.wh * s.sc1 * K * 0.7, S.ww * s.sc1 * K * 1.2, S.glow]);
    }
    for (const o of s.objs) {
      let oa = alpha;
      if (o.taken > race.time) {
        // empty crate spot: riders in the back half still get an item here, so they see a faint outline
        if (o.kind !== "crate" || race.demo || !me.human || !inBackHalf(race, me) || (o.gotBy && o.gotBy.has(me))) continue;
        oa = alpha * 0.32;
      }
      const S = assets.sprites[o.kind];
      const bob = Math.sin(tnow * 4 + s.i) * 60;
      const sc = s.sc1 * K;
      drawSprite(ctx, S, s.sx1 + s.sc1 * o.x * ROAD_W * K, s.sy1 - (180 + bob) * sc, sc, s.clip, oa, false);
      if ((biome.dark || tun > 0.05) && oa === alpha) glows.push([s.sx1 + s.sc1 * o.x * ROAD_W * K, s.sy1 - 400 * sc, 700 * sc, S.glow]);
    }
    const list = buckets[s.i];
    if (list) {
      list.sort((a, b) => b.z - a.z);
      for (const e of list) drawEntity(ctx, e, s, K, me, race, glows, tnow);
    }
  }

  // ---- weather & lighting ----
  if (tun < 0.5) drawWeather(ctx, w, h, biome, race, me, tnow);
  if (biome.dark || tun > 0.05) drawDarkness(ctx, w, h, hz, glows, me, biome.dark ? 1 : tun * 0.85);
  if (tun > 0.05 && me.tunKind === "falls") drawFallsMist(ctx, w, h, tnow, tun);
  ctx.restore();

  // screen-space overlays (not tilted)
  ctx.save();
  ctx.beginPath(); ctx.rect(vp.x, vp.y, w, h); ctx.clip();
  ctx.translate(vp.x, vp.y);
  if (SAVAGE()) drawSavageGrade(ctx, w, h);
  if (!race.demo) { drawScreenFX(ctx, w, h, me, race, tnow); drawHUD(ctx, w, h, me, race, tnow); }
  ctx.restore();
}

/* Savage tone: darker, warmer, grittier picture (a multiply tint plus dark edges). The HUD is drawn after this, so it stays bright. */
function drawSavageGrade(ctx, w, h) {
  ctx.globalCompositeOperation = "multiply";
  ctx.fillStyle = "#b8a6a6"; ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = "source-over";
  const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.4, w / 2, h / 2, h * 1.05);
  g.addColorStop(0, "rgba(14,0,4,0)"); g.addColorStop(1, "rgba(14,0,4,.6)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}

/* Savage tone: blood splats on the screen EDGES after a hard hit (never in the middle, so the road stays visible). */
function drawBloodSplats(ctx, w, h, me) {
  const a = clamp(me.bloodT / 0.6, 0, 1);
  const R = rng(me.bloodSeed || 1);
  const n = 4 + (me.bloodPow || 1) * 3;
  for (let i = 0; i < n; i++) {
    const ang = R() * TAU, rr = 0.9 + R() * 0.25;
    const x = w / 2 + Math.cos(ang) * w * 0.5 * rr, y = h / 2 + Math.sin(ang) * h * 0.55 * rr;
    const s = h * (0.035 + R() * 0.06);
    ctx.globalAlpha = a * 0.88;
    ctx.fillStyle = R() < 0.5 ? "#8f0f1a" : "#b3121f";
    ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
    for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(x + (R() - 0.5) * s * 3.2, y + (R() - 0.5) * s * 3.2, s * (0.2 + R() * 0.3), 0, TAU); ctx.fill(); }
    ctx.fillRect(x - s * 0.18, y, s * 0.36, s * (1.4 + R() * 2.2) * (1 - a * 0.4));      // drip
  }
  ctx.globalAlpha = 1;
}

function drawSky(ctx, w, h, hz, biome, t, me) {
  const g = ctx.createLinearGradient(0, -h * 0.1, 0, hz + h * 0.1);
  g.addColorStop(0, biome.sky[0]); g.addColorStop(0.6, biome.sky[1]); g.addColorStop(1, biome.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(-w * 0.1, -h * 0.2, w * 1.2, h * 1.3);
  // sun / moon
  const sx = w * biome.sunX - me.bgX * 0.05 % w, sy = h * biome.sunY;
  const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, h * 0.35);
  rg.addColorStop(0, rgba(biome.sun, 0.9)); rg.addColorStop(0.12, rgba(biome.sun, 0.55)); rg.addColorStop(1, rgba(biome.sun, 0));
  ctx.fillStyle = rg; ctx.fillRect(sx - h * 0.4, sy - h * 0.4, h * 0.8, h * 0.8);
  ctx.fillStyle = biome.sun; ctx.beginPath(); ctx.arc(sx, sy, h * (biome.dark ? 0.04 : 0.055), 0, TAU); ctx.fill();
  if (biome.dark) {
    // stars
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 60; i++) {
      const px = ((i * 137.5 + (-me.bgX * 0.02)) % w + w) % w, py = ((i * 61.3) % (hz * 0.9));
      ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.3 + i));
      ctx.fillRect(px, py, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
    // aurora curtains
    ctx.globalCompositeOperation = "lighter";
    for (let b = 0; b < 3; b++) {
      const col = ["#3dffb0", "#38d0ff", "#b35cff"][b];
      ctx.beginPath();
      const y0 = hz * (0.18 + b * 0.12);
      ctx.moveTo(-10, y0);
      for (let px = 0; px <= w + 20; px += 20) ctx.lineTo(px, y0 + Math.sin(px * 0.006 + t * 0.6 + b * 2 - me.bgX * 0.0008) * hz * 0.12);
      for (let px = w + 20; px >= -10; px -= 20) ctx.lineTo(px, y0 + hz * 0.22 + Math.sin(px * 0.008 + t * 0.5 + b) * hz * 0.08);
      ctx.closePath();
      const ag = ctx.createLinearGradient(0, y0 - hz * 0.1, 0, y0 + hz * 0.3);
      ag.addColorStop(0, rgba(col, 0)); ag.addColorStop(0.5, rgba(col, 0.28)); ag.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = ag; ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }
  if (biome.id === "volcano") {
    ctx.fillStyle = "rgba(40,20,20,.25)";
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(((i * 300 - me.bgX * 0.1 - t * 8) % (w + 400) + w + 400) % (w + 400) - 200, hz * (0.25 + i * 0.12), w * 0.3, hz * 0.06, 0, 0, TAU); ctx.fill(); }
  }
}

function drawLayer(ctx, img, w, h, hz, off, frac, biome) {
  if (!img) return;
  const lh = h * frac;
  const lw = lh * (img.width / img.height);
  const y = hz - lh * 0.92;
  let x0 = -((off % lw) + lw) % lw - w * 0.1;
  for (let x = x0; x < w * 1.1; x += lw) ctx.drawImage(img, x, y, lw + 1, lh);
  // fill below the layer down to well under the horizon so hills never show sky gaps
  ctx.fillStyle = biome.ground[1];
}

function drawSegment(ctx, w, s, biome, t, maxy) {
  // Every slice is stretched 1px UP (towards the horizon). Slices are drawn near -> far, so the next slice paints over the
  // overlap; this removes the thin ground-coloured lines that used to show across the road between slices.
  const { sx1, sy1, sx2 } = s;
  const sy2 = s.sy2 - 1;
  const y1 = Math.min(sy1, maxy);
  // ground band: same height as the slice, shifted 1px up, so it never paints over the overlap of the slice in front
  // (that is where ground colour used to peek through as a line across the road)
  const gh = Math.max(0, y1 - sy2 - 1);
  const rw1 = s.rw1 * s.w, rw2 = s.rw2 * s.w;
  // ground band (each side can be river, lava, drop-off, rock or ice — see track features)
  if (s.gL || s.gR) {
    const mx = (sx1 + sx2) / 2;
    ctx.fillStyle = sideGround(s.gL, s, biome, t); ctx.fillRect(-w * 0.2, sy2, mx + w * 0.2, gh);
    ctx.fillStyle = sideGround(s.gR, s, biome, t); ctx.fillRect(mx, sy2, w * 1.2 - mx, gh);
  } else {
    ctx.fillStyle = biome.ground[s.dark];
    ctx.fillRect(-w * 0.2, sy2, w * 1.4, gh);
  }
  // rumble edges: two side strips only (nothing is painted under the road surface, so no curb colour can show as a line across it)
  const r1 = rw1 * 1.12, r2 = rw2 * 1.12, i1 = rw1 * 0.97, i2 = rw2 * 0.97, edgeCol = s.bridge ? "#3a2a20" : biome.edge[s.dark];
  quad(ctx, sx1 - r1, sy1, sx1 - i1, sy1, sx2 - i2, sy2, sx2 - r2, sy2, edgeCol);
  quad(ctx, sx1 + i1, sy1, sx1 + r1, sy1, sx2 + r2, sy2, sx2 + i2, sy2, edgeCol);
  // road (planks on bridges)
  quad(ctx, sx1 - rw1, sy1, sx1 + rw1, sy1, sx2 + rw2, sy2, sx2 - rw2, sy2, s.bridge ? biome.plank[0] : biome.road[0]);   // one flat colour: no stripes on the drivable surface
  // tire ruts
  if (s.rw1 > 6 && !s.bridge) {
    for (const rx of [-0.42, 0.42]) {
      const a1 = sx1 + rx * s.rw1, a2 = sx2 + rx * s.rw2;
      quad(ctx, a1 - s.rw1 * 0.06, sy1, a1 + s.rw1 * 0.06, sy1, a2 + s.rw2 * 0.06, sy2, a2 - s.rw2 * 0.06, sy2, biome.rut);
    }
  }
  // split median (fork)
  if (s.split > 0.01) {
    const m1 = s.rw1 * 0.22 * s.split, m2 = s.rw2 * 0.22 * s.split;
    quad(ctx, sx1 - m1 * 1.15, sy1, sx1 + m1 * 1.15, sy1, sx2 + m2 * 1.15, sy2, sx2 - m2 * 1.15, sy2, biome.edge[s.dark]);
    quad(ctx, sx1 - m1, sy1, sx1 + m1, sy1, sx2 + m2, sy2, sx2 - m2, sy2, biome.ground[s.dark]);
  }
  // surface patches
  const sf = s.surface;
  if (sf) {
    const col = { sand: "#f2cf91", ice: "#bfeaff", mud: "#5a2e14", water: "#3a8fd0", lava: "#ff5a1f" }[sf.type];
    const taper = Math.sin((sf.k + 0.5) / sf.len * Math.PI);
    const c = (sf.x0 + sf.x1) / 2, hw = (sf.x1 - sf.x0) / 2 * (sf.type === "water" ? 1.2 : 0.4 + 0.6 * taper);
    let col2 = col;
    if (sf.type === "water") col2 = (s.i + Math.floor(t * 8)) % 3 === 0 ? "#7cc6f2" : col;
    if (sf.type === "lava") col2 = (s.i + Math.floor(t * 6)) % 2 ? "#ff7a1f" : "#ffb347";
    if (sf.type === "ice") col2 = biome.dark ? "#7a9ac2" : "#b2e2fb";
    quad(ctx, sx1 + (c - hw) * s.rw1, sy1, sx1 + (c + hw) * s.rw1, sy1, sx2 + (c + hw) * s.rw2, sy2, sx2 + (c - hw) * s.rw2, sy2, col2);
    if (sf.type === "lava") { const hw2 = hw * 0.35; quad(ctx, sx1 + (c - hw2) * s.rw1, sy1, sx1 + (c + hw2) * s.rw1, sy1, sx2 + (c + hw2) * s.rw2, sy2, sx2 + (c - hw2) * s.rw2, sy2, "#ffe08a"); }
  }
  // boost pads (animated chevrons)
  const d = s.decal;
  if (d && d.type === "boost") {
    const on = ((d.k + Math.floor(t * 12)) % 4) < 2;
    const c = (d.x0 + d.x1) / 2, hw = (d.x1 - d.x0) / 2;
    quad(ctx, sx1 + (c - hw) * s.rw1, sy1, sx1 + (c + hw) * s.rw1, sy1, sx2 + (c + hw) * s.rw2, sy2, sx2 + (c - hw) * s.rw2, sy2, on ? "#2bd9c5" : "#fff35c");
    if (s.rw1 > 20) {
      ctx.fillStyle = on ? "#0d6e66" : "#c48a00";
      const cx1 = sx1 + c * s.rw1, cx2 = sx2 + c * s.rw2;
      ctx.beginPath(); ctx.moveTo(cx1 - hw * s.rw1 * 0.6, sy1); ctx.lineTo(cx2, sy2); ctx.lineTo(cx1 + hw * s.rw1 * 0.6, sy1); ctx.closePath(); ctx.fill();
    }
  }
}

function sideGround(type, s, biome, t) {
  if (!type) return biome.ground[s.dark];
  if (type === "water") return (s.i + Math.floor(t * 5)) % 4 === 0 ? biome.water[1] : biome.water[0];
  if (type === "lava") return (s.i + Math.floor(t * 6)) % 3 === 0 ? "#ff8a2f" : "#ff5a1f";
  if (type === "chasm") return biome.chasm[s.dark];
  if (type === "ice") return biome.dark ? (s.dark ? "#4f6d96" : "#58779f") : (s.dark ? "#bfe0fb" : "#cfe8ff");
  if (type === "rock") return shade(biome.rock[0], s.dark ? -0.5 : -0.42);
  return biome.ground[s.dark];
}

function drawFallsMist(ctx, w, h, t, a) {
  ctx.strokeStyle = `rgba(230,245,255,${0.35 * a})`; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 26; i++) { const x = ((i * 0.137 + t * 0.03) % 1) * w, y = ((t * 1.6 + i * 0.31) % 1) * h; ctx.moveTo(x, y); ctx.lineTo(x - 2, y + h * 0.12); }
  ctx.stroke();
  ctx.fillStyle = `rgba(120,190,220,${0.12 * a})`; ctx.fillRect(0, 0, w, h);
}

function quad(ctx, x1, y1, x2, y2, x3, y3, x4, y4, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.closePath(); ctx.fill();
}

function drawSprite(ctx, S, sx, sy, sc, clipY, alpha, flat) {
  const dw = S.ww * sc, dh = S.wh * sc;
  if (dw < 1.5 || dh < 1.5) return;
  const dx = sx - dw / 2, dy = sy - dh;
  if (dy >= clipY) return;
  const visH = Math.min(dh, clipY - dy);
  const srcH = S.c.height * (visH / dh);
  if (alpha < 0.98) ctx.globalAlpha = alpha;
  ctx.drawImage(S.c, 0, 0, S.c.width, srcH, dx, dy, dw, visH);
  if (alpha < 0.98) ctx.globalAlpha = 1;
}

/* Riders, projectiles, particles inside a segment */
function drawEntity(ctx, e, s, K, me, race, glows, t) {
  const pct = (e.z - s.i * SEG) / SEG;
  const sc = lerp(s.sc1, s.sc2, pct) * K;
  const cx = lerp(s.sx1, s.sx2, pct), cy = lerp(s.sy1, s.sy2, pct);
  const rw = lerp(s.rw1, s.rw2, pct);
  const px = cx + e.x * rw, py = cy;
  if (py - 10 > s.clip && !e.h) return;
  if (e.type === "rider") return drawRider(ctx, e, px, py, sc, s.clip, me, race, glows, t);
  if (e.type === "proj") {
    const img = race.assets.items[e.item];
    const size = 380 * sc * (e.big ? 1.6 : 1);
    const yy = py - e.h * sc;
    ctx.save(); ctx.translate(px, yy); ctx.rotate(t * 12);
    ctx.drawImage(img, -size / 2, -size / 2, size, size); ctx.restore();
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(px, py, size * 0.4, size * 0.12, 0, 0, TAU); ctx.fill();
    if (race.track.biome.dark) glows.push([px, yy, size * 1.4, ITEMS[e.item].col]);
    return;
  }
  if (e.type === "fx") {
    const r = Math.max(1, e.size * sc);
    ctx.globalAlpha = clamp(e.life / e.max, 0, 1);
    ctx.fillStyle = e.col;
    ctx.beginPath(); ctx.arc(px, py - e.h * sc, r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function riderPose(e, t) {
  if (e.wipeT > 0) return "hurt";
  if (e.trick) return e.trick.def.pose === "spin" ? "ride0" : e.trick.def.pose;
  if (e.atkT > 0) return (e.atkKick ? "kick" : "punch") + (e.atkSide < 0 ? "L" : "R");
  if (e.hurtT > 0) return "hurt";
  return Math.floor(e.pedal) % 2 ? "ride1" : "ride0";
}

function drawRider(ctx, e, px, py, sc, clipY, me, race, glows, t) {
  const spr = e.sprites[riderPose(e, t)];
  const vw = e.veh.sw || e.veh.w * 1.25, vh = vw * (SPRITE_H / SPRITE_W);
  const dw = vw * sc, dh = vh * sc;
  if (dw < 2) return;
  const lift = e.h * sc;
  // shadow
  const shs = clamp(1 - e.h / 3000, 0.3, 1);
  ctx.fillStyle = "rgba(0,0,0,.32)";
  ctx.beginPath(); ctx.ellipse(px, py, dw * 0.3 * shs * (e.veh.shove ? 1.4 : 1), dw * 0.07 * shs, 0, 0, TAU); ctx.fill();
  let rot = e.lean * 0.32 + (e.wobble > 0 ? Math.sin(t * 40) * 0.12 * e.wobble : 0);
  if (e.wipeT > 0) rot = e.wipeT * 9;
  if (e.trick && e.trick.def.pose === "spin") rot = (e.trick.t / e.trick.dur) * TAU;
  const y = py - lift;
  if (y - dh > clipY) return;
  ctx.save();
  ctx.translate(px, y - (e.wipeT > 0 ? dh * 0.3 : 0));
  ctx.rotate(rot);
  if (e.flash > 0 && Math.floor(t * 30) % 2) ctx.globalAlpha = 0.5;
  if (e.invuln > 0 && Math.floor(t * 16) % 2) ctx.globalAlpha = 0.55;
  ctx.drawImage(spr, -dw / 2, -dh * (e.wipeT > 0 ? 0.5 : 0.98), dw, dh);
  ctx.globalAlpha = 1;
  ctx.restore();
  // hit stars
  if (e.hurtT > 0 || e.wipeT > 0) {
    ctx.fillStyle = "#ffd23f";
    for (let i = 0; i < 3; i++) {
      const a = t * 6 + i * 2.1;
      star(ctx, px + Math.cos(a) * dw * 0.35, y - dh * 1.02 + Math.sin(a) * dh * 0.06, dw * 0.07);
    }
  }
  // burning flames (the grey low-health smoke circles above riders were removed: they read as a light blinking over the rider)
  if (e.burnT > 0) {
    ctx.fillStyle = "rgba(255,120,40,.55)";
    for (let i = 0; i < 3; i++) { const ph = (t * 1.5 + i / 3) % 1; ctx.beginPath(); ctx.arc(px + Math.sin(t * 3 + i) * dw * 0.1, y - dh * (0.5 + ph * 0.7), dw * (0.06 + ph * 0.1), 0, TAU); ctx.fill(); }
  }
  // boost flame
  if (e.boosting || e.padT > 0) {
    const fl = dw * (0.18 + Math.random() * 0.08);
    const g = ctx.createRadialGradient(px, y - dh * 0.12, 0, px, y - dh * 0.12, fl * 1.6);
    g.addColorStop(0, "rgba(255,255,220,.95)"); g.addColorStop(0.4, e.padT > 0 ? "rgba(43,217,197,.8)" : "rgba(255,140,30,.8)"); g.addColorStop(1, "rgba(255,60,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, y - dh * 0.12, fl * 1.6, 0, TAU); ctx.fill();
  }
  // markers above other humans / everyone in split mode
  if (e !== me && e.human) {
    ctx.fillStyle = e.pIndex === 0 ? "#2bd9c5" : "#ff3d7f";
    const my = y - dh * 1.1;
    ctx.beginPath(); ctx.moveTo(px - 10, my - 16); ctx.lineTo(px + 10, my - 16); ctx.lineTo(px, my - 2); ctx.closePath(); ctx.fill();
    ctx.font = "16px Bangers, sans-serif"; ctx.textAlign = "center"; ctx.fillText("P" + (e.pIndex + 1), px, my - 20);
  }
  if ((race.track.biome.dark || (me.tunT || 0) > 0.05) && e !== me) glows.push([px, y - dh * 0.85, Math.min(dw * 0.7, 90), "#fff2c0"]);
}

function star(ctx, x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}

/* Weather particles in screen space (per view) */
function drawWeather(ctx, w, h, biome, race, me, t) {
  const sp = me.speed / 11000;
  const P = me.weather || (me.weather = Array.from({ length: 70 }, () => [Math.random(), Math.random(), Math.random()]));
  const kind = biome.weather;
  if (kind === "rain") {
    ctx.strokeStyle = "rgba(200,225,255,.55)"; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const p of P) {
      p[1] += 0.035 + sp * 0.02; p[0] -= 0.004 + me.lean * 0.01;
      if (p[1] > 1) { p[1] -= 1; p[0] = Math.random(); }
      const x = ((p[0] % 1) + 1) % 1 * w, y = p[1] * h;
      ctx.moveTo(x, y); ctx.lineTo(x - 4 - sp * 6, y + 18 + sp * 14);
    }
    ctx.stroke();
    ctx.fillStyle = "rgba(60,80,90,.12)"; ctx.fillRect(0, 0, w, h);
  } else if (kind === "snow" || kind === "aurora") {
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (const p of P) {
      p[1] += 0.004 + p[2] * 0.004 + sp * 0.006; p[0] += Math.sin(t + p[2] * 9) * 0.0015 - me.lean * 0.004;
      if (p[1] > 1) { p[1] -= 1; p[0] = Math.random(); }
      const x = ((p[0] % 1) + 1) % 1 * w, y = p[1] * h;
      ctx.beginPath(); ctx.arc(x, y, 1.2 + p[2] * 2.4, 0, TAU); ctx.fill();
    }
  } else if (kind === "ash") {
    for (const p of P) {
      p[1] += 0.003 + p[2] * 0.003; p[0] += 0.001 - me.lean * 0.003;
      if (p[1] > 1) { p[1] -= 1; p[0] = Math.random(); }
      const x = ((p[0] % 1) + 1) % 1 * w, y = p[1] * h;
      ctx.fillStyle = p[2] > 0.75 ? `rgba(255,${120 + p[2] * 100 | 0},40,${0.6 + Math.sin(t * 8 + p[2] * 20) * 0.3})` : "rgba(70,60,60,.7)";
      ctx.fillRect(x, y, 2 + p[2] * 2, 2 + p[2] * 2);
    }
    const g = ctx.createLinearGradient(0, h, 0, h * 0.5);
    g.addColorStop(0, "rgba(255,80,20,.18)"); g.addColorStop(1, "rgba(255,80,20,0)");
    ctx.fillStyle = g; ctx.fillRect(0, h * 0.5, w, h * 0.5);
  } else if (kind === "sand") {
    const a = 0.25 + race.stormFog * 0.6;
    ctx.fillStyle = `rgba(240,200,140,${a})`;
    for (const p of P) {
      p[0] -= 0.006 + p[2] * 0.01 + race.stormFog * 0.02; p[1] += 0.002;
      if (p[0] < 0) { p[0] += 1; p[1] = Math.random(); }
      if (p[1] > 1) p[1] -= 1;
      ctx.fillRect(p[0] * w, p[1] * h, 6 + p[2] * 10, 1.5);
    }
    if (race.stormFog > 0) { ctx.fillStyle = `rgba(214,160,96,${race.stormFog * 0.45})`; ctx.fillRect(0, 0, w, h); }
  } else if (kind === "shafts") {
    // (the drifting light beams were removed: they looked like a flashing light shining down on the riders)
    ctx.fillStyle = "#d9772f";
    for (let i = 0; i < 14; i++) {
      const p = P[i];
      p[1] += 0.002 + p[2] * 0.002; p[0] += Math.sin(t * 2 + i) * 0.002;
      if (p[1] > 1) { p[1] = 0; p[0] = Math.random(); }
      ctx.save(); ctx.translate(((p[0] % 1) + 1) % 1 * w, p[1] * h); ctx.rotate(t * 2 + i);
      ctx.fillRect(-4, -2, 8, 4); ctx.restore();
    }
  }
}

function drawDarkness(ctx, w, h, hz, glows, me, k = 1) {
  // dark overlay with a headlamp cone, then additive glows (k = strength; tunnels use a partial version)
  const g = ctx.createRadialGradient(w / 2, h * 0.68, h * 0.06, w / 2, h * 0.55, h * 0.95);
  g.addColorStop(0, "rgba(5,10,30,0)"); g.addColorStop(0.45, `rgba(5,10,30,${0.35 * k})`); g.addColorStop(1, `rgba(3,6,20,${0.82 * k})`);
  ctx.fillStyle = g; ctx.fillRect(-w * 0.2, -h * 0.2, w * 1.4, h * 1.4);
  ctx.globalCompositeOperation = "lighter";
  const beam = ctx.createLinearGradient(0, h * 0.85, 0, hz);
  beam.addColorStop(0, `rgba(255,240,190,${0.2 * k})`); beam.addColorStop(1, "rgba(255,240,190,0)");
  ctx.fillStyle = beam;
  ctx.beginPath(); ctx.moveTo(w * 0.45, h * 0.85); ctx.lineTo(w * 0.55, h * 0.85); ctx.lineTo(w * 0.78, hz + h * 0.02); ctx.lineTo(w * 0.22, hz + h * 0.02); ctx.closePath(); ctx.fill();
  for (let [x, y, r, c] of glows) {
    if (r < 2) continue;
    r = Math.min(r, h * 0.35);
    const gg = ctx.createRadialGradient(x, y, 0, x, y, r);
    gg.addColorStop(0, rgba(c, 0.45 * Math.min(1, k + 0.2))); gg.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = gg; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.globalCompositeOperation = "source-over";
}

/* Speed streaks: thin white lines flowing outward along the far LEFT and RIGHT edges only (never over the road or the
   rider), when you're near top speed, and thicker on boost / boost pads / drift turbos. Each streak fades in and out
   smoothly, so nothing flashes. Strength eases in and out with me.streakK. */
function drawSpeedStreaks(ctx, w, h, me, t) {
  const pct = me.speed / (me.maxSpd || 1);
  const tgt = me.boosting || me.padT > 0 ? 1 : clamp((pct - 0.88) / 0.12, 0, 1) * 0.55;
  me.streakK = lerp(me.streakK || 0, me.wipeT > 0 || me.finished ? 0 : tgt, 0.08);
  const k = me.streakK;
  if (k < 0.03) return;
  const band = w * 0.15, thick = me.padT > 0 ? 3.2 : me.boosting ? 2.6 : 1.8;
  ctx.save();
  ctx.lineCap = "round"; ctx.strokeStyle = me.padT > 0 ? "#c8fff6" : "#ffffff"; ctx.lineWidth = thick;
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 12; i++) {
      const r1 = ((i * 97 + (side > 0 ? 31 : 0)) % 101) / 101, r2 = ((i * 53 + 17) % 89) / 89, r3 = ((i * 29 + 7) % 61) / 61;
      const ph = (t * (1.5 + r2 * 0.9) * (0.7 + 0.5 * k) + r1) % 1;
      const y = h * (0.3 + r3 * 0.62) + ph * h * 0.06;
      const len = band * (0.35 + 0.45 * ph);
      const xin = band * (1 - ph * 1.1);                       // inner end slides out toward the screen edge
      const x0 = side < 0 ? xin : w - xin, x1 = side < 0 ? xin - len : w - xin + len;
      ctx.globalAlpha = k * 0.42 * Math.sin(ph * Math.PI);
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y + len * 0.12); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawScreenFX(ctx, w, h, me, race, t) {
  drawSpeedStreaks(ctx, w, h, me, t);
  // damage flash
  // (red glow on the screen edges only: the middle stays clear so you can still see the road)
  if (me.flash > 0) {
    const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.5, w / 2, h / 2, h * 0.95);
    g.addColorStop(0, "rgba(255,40,40,0)"); g.addColorStop(1, `rgba(${SAVAGE() ? "170,10,20" : "255,30,30"},${me.flash * 0.62})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  if (SAVAGE() && me.bloodT > 0) drawBloodSplats(ctx, w, h, me);
  // paint / sand splat blind
  if (me.blindT > 0) {
    const a = clamp(me.blindT / 1.2, 0, 1);
    ctx.fillStyle = rgba(me.blindCol || "#38e05a", 0.75 * a);
    const R = rng(7);
    for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(w * (0.15 + R() * 0.7), h * (0.15 + R() * 0.6), h * (0.08 + R() * 0.14), 0, TAU); ctx.fill(); }
  }
  // low health vignette
  if (me.hp / me.maxHp < 0.3 && me.wipeT <= 0) {
    const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, h * 0.9);
    g.addColorStop(0, "rgba(255,0,0,0)"); g.addColorStop(1, `rgba(200,0,0,0.25)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  // avalanche behind you
  if (race.avalanche) {
    const d = me.z - race.avalanche.z;
    if (d < 5000) {
      const a = clamp(1 - d / 5000, 0, 1);
      const g = ctx.createLinearGradient(0, h, 0, h * (1 - 0.5 * a));
      g.addColorStop(0, `rgba(255,255,255,${0.95 * a})`); g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g; ctx.fillRect(0, h * 0.4, w, h * 0.6);
    }
  }
}

/* ---------------- HUD ---------------- */
function hudText(ctx, txt, x, y, size, col, align = "left", stroke = "#14101c") {
  ctx.font = `${size}px Bangers, Impact, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  ctx.lineWidth = Math.max(3, size * 0.16); ctx.strokeStyle = stroke; ctx.lineJoin = "round";
  ctx.strokeText(txt, x, y); ctx.fillStyle = col; ctx.fillText(txt, x, y);
}
function ordinal(n) { return n + (n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"); }

function drawHUD(ctx, w, h, me, race, t) {
  const u = Math.min(w, h * 1.6) / 100;      // HUD unit
  const pad = Math.max(10, u * 1.6) + (me.vpIndex === 0 ? race.safeL || 0 : 0);
  const padR = Math.max(10, u * 1.6) + (me.vpIndex === race.humans.length - 1 ? race.safeR || 0 : 0);
  const top = Math.max(8, u * 1.4) + (race.safeT || 0);
  // place
  hudText(ctx, String(me.place), pad, top + u * 7.4, u * 8.2, "#ffd23f");
  ctx.font = `${u * 3.4}px Bangers, Impact, sans-serif`;
  const pw = ctx.measureText(String(me.place)).width;
  hudText(ctx, ordinal(me.place).slice(-2) + " / " + race.riders.length, pad + pw + u * 4.5 + u * 0.6, top + u * 4.2, u * 3.2, "#fff");
  // health bar with portrait
  const bx = pad, by = top + u * 9.4, bw = u * 26, bh = u * 2.6;
  if (me.face) ctx.drawImage(me.face, bx, by - u * 0.6, u * 4.2, u * 4.2);
  const hx = bx + u * 4.8;
  ctx.fillStyle = "rgba(10,8,20,.6)"; roundRect(ctx, hx, by, bw, bh, bh / 2); ctx.fill();
  const hp = clamp(me.hpShow / me.maxHp, 0, 1);
  const hcol = hp > 0.55 ? "#2bd96a" : hp > 0.28 ? "#ffcf3a" : "#ff3b3b";
  ctx.fillStyle = hcol; roundRect(ctx, hx + 2, by + 2, (bw - 4) * hp, bh - 4, (bh - 4) / 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(hx + bh / 2, by + 3, Math.max(0, (bw - 4) * hp - bh), (bh - 6) * 0.35);
  hudText(ctx, "HP", hx + bw + u * 0.8, by + bh * 0.9, u * 2.2, "#fff");
  // damage taken, shown on the health bar instead of floating over the rider
  if (me.dmgT > 0 && me.dmgAmt >= 1) {
    ctx.globalAlpha = clamp(me.dmgT / 0.5, 0, 1);
    hudText(ctx, "-" + Math.round(me.dmgAmt), hx + bw + u * 5.4, by + bh * 0.95, u * 2.6, "#ff5a5a");
    ctx.globalAlpha = 1;
  }
  // boost meter
  const my = by + bh + u * 1.1;
  ctx.fillStyle = "rgba(10,8,20,.6)"; roundRect(ctx, hx, my, bw, bh * 0.75, bh * 0.37); ctx.fill();
  const bm = clamp(me.boost / 100, 0, 1);
  const bg = ctx.createLinearGradient(hx, 0, hx + bw, 0); bg.addColorStop(0, "#2b9cff"); bg.addColorStop(1, me.boost >= 99 ? (Math.floor(t * 8) % 2 ? "#ffffff" : "#2bd9c5") : "#2bd9c5");
  ctx.fillStyle = bg; roundRect(ctx, hx + 2, my + 2, (bw - 4) * bm, bh * 0.75 - 4, (bh * 0.75 - 4) / 2); ctx.fill();
  hudText(ctx, "BOOST", hx + bw + u * 0.8, my + bh * 0.66, u * 1.8, "#bff6ff");
  // items
  const iy = my + bh + u * 1.0;
  for (let i = 0; i < 3; i++) {
    const ix = hx + i * u * 5.4;
    ctx.fillStyle = i < me.items.length ? "rgba(255,210,63,.25)" : "rgba(10,8,20,.45)";
    roundRect(ctx, ix, iy, u * 4.8, u * 4.8, u * 1.2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5; ctx.stroke();
    if (me.items[i]) ctx.drawImage(race.assets.items[me.items[i]], ix + u * 0.4, iy + u * 0.4, u * 4, u * 4);
  }
  // Daily Spin perks that are active this race (small chips under the item slots)
  let cy2 = iy + u * 5.6;
  const chip = (txt, col) => { hudText(ctx, txt, hx, cy2, u * 2, col, "left"); cy2 += u * 2.3; };
  if (me.shield > 0) chip("SHIELD READY", "#2bd9c5");
  if (me.coinMul > 1) chip("DOUBLE COINS", "#ffd23f");
  if (me.itemMul > 1) chip("POWER THROWS", "#ff8a1c");
  // speed (bottom center-ish)
  const kmh = Math.round(me.speed / 11000 * 88);
  const sx = w / 2, sy = h - (race.touch ? u * 2.4 : u * 3);
  hudText(ctx, String(kmh), sx, sy, u * 6, me.boosting || me.padT > 0 ? "#2bd9c5" : "#fff", "center");
  hudText(ctx, "KM/H", sx + u * 6.2, sy, u * 2, "#ffd23f", "left");
  // progress bar (top center)
  const pbw = Math.min(w * 0.36, u * 46), pbx = w / 2 - pbw / 2, pby = top + u * 1.2;
  ctx.fillStyle = "rgba(10,8,20,.55)"; roundRect(ctx, pbx, pby, pbw, u * 1.4, u * 0.7); ctx.fill();
  const prog = (z) => clamp((z - race.track.startZ) / (race.track.finishZ - race.track.startZ), 0, 1);
  if (race.avalanche) { ctx.fillStyle = "#ffffff"; ctx.fillRect(pbx, pby, pbw * prog(race.avalanche.z), u * 1.4); }
  for (const r of race.riders) {
    if (r === me) continue;
    ctx.fillStyle = r.human ? (r.pIndex === 0 ? "#2bd9c5" : "#ff3d7f") : r.rider.main;
    ctx.beginPath(); ctx.arc(pbx + pbw * prog(r.z), pby + u * 0.7, u * 0.8, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#14101c"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(pbx + pbw * prog(me.z), pby + u * 0.7, u * 1.2, 0, TAU); ctx.fill(); ctx.stroke();
  hudText(ctx, "🏁", pbx + pbw + u * 1.2, pby + u * 1.5, u * 2.2, "#fff");
  // timer
  const tt = race.time;
  hudText(ctx, fmtTime(tt), w - padR - (race.touch && !race.split ? 46 : 0), top + u * 4.2, u * 3.4, "#fff", "right");
  if (race.avalanche) {
    const d = Math.max(0, Math.round((me.z - race.avalanche.z) / 40));
    hudText(ctx, "AVALANCHE " + d + "m", w / 2, pby + u * 5, u * 2.8, d < 60 ? (Math.floor(t * 6) % 2 ? "#ff3b3b" : "#fff") : "#d8ecff", "center");
  }
  if (race.stormWarn > 0) hudText(ctx, "SANDSTORM!", w / 2, pby + u * 5, u * 3.4, "#ffcf3a", "center");
  // incoming projectile warning (they come from behind the camera)
  for (const p of race.projs) {
    if (p.owner === me || p.dir < 0) continue;
    const dz = me.z - p.z;
    if (dz < 0 || dz > 3200 || Math.abs(p.x - me.x) > 0.7) continue;
    const ax = w / 2 + (p.x - me.camX) * w * 0.32, ay = h - u * 9 - (1 - dz / 3200) * u * 4;
    const a = 0.5 + 0.5 * Math.sin(t * 20);
    ctx.globalAlpha = 0.6 + a * 0.4;
    ctx.fillStyle = "#ff3b3b";
    ctx.beginPath(); ctx.moveTo(ax, ay - u * 3.4); ctx.lineTo(ax + u * 2.6, ay + u * 1.2); ctx.lineTo(ax - u * 2.6, ay + u * 1.2); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.stroke();
    hudText(ctx, "!", ax, ay + u * 0.6, u * 3, "#fff", "center", "#ff3b3b");
    ctx.globalAlpha = 1;
  }
  // event feed: tricks, hits, pickups. Small lines stacked in the top-right corner (under the timer) so nothing
  // ever covers the rider or the road in the middle of the screen. Newest line is on top and fades after ~1.2 s.
  let fy = top + u * 8.6;
  for (const p of me.popups) {
    const a = clamp(p.t / 0.18, 0, 1) * clamp(p.life / 0.4, 0, 1);
    const s = u * (p.big ? 3.1 : 2.3);
    ctx.globalAlpha = a;
    const fx = w - padR + (1 - clamp(p.t / 0.2, 0, 1)) * u * 4;
    hudText(ctx, p.txt, fx, fy, s, p.col || "#fff", "right");
    fy += s * 0.95;
    if (p.sub) { hudText(ctx, p.sub, fx, fy, s * 0.62, "#ffd23f", "right"); fy += s * 0.62; }
    ctx.globalAlpha = 1;
    fy += u * 0.5;
  }
  // countdown
  if (race.resumeT > 0) {
    const n = Math.ceil(race.resumeT), f = race.resumeT % 1;
    hudText(ctx, String(n), w / 2, h * 0.5, u * (12 + f * 6), ["#2bd96a", "#2bd96a", "#ffd23f", "#ff8a1c"][n] || "#fff", "center");
  } else if (race.countdown > 0) {
    const n = Math.ceil(race.countdown);
    const f = race.countdown % 1;
    hudText(ctx, String(n), w / 2, h * 0.5, u * (14 + f * 8), ["#2bd96a", "#ffd23f", "#ff8a1c", "#ff3b3b"][n] || "#fff", "center");
  } else if (race.time < 1) {
    hudText(ctx, "GO!", w / 2, h * 0.5, u * 16 * (1 + (1 - race.time) * 0.4), "#2bd96a", "center");
  }
  if (me.finished) {
    hudText(ctx, ordinal(me.place).toUpperCase() + " PLACE!", w / 2, h * 0.42, u * 9, me.place === 1 ? "#ffd23f" : "#fff", "center");
    hudText(ctx, fmtTime(me.finishTime), w / 2, h * 0.42 + u * 7, u * 4.2, "#bff6ff", "center");
  }
  // warning sits under the progress bar at the top, not over the road
  if (me.wrongWay) hudText(ctx, "STAY ON THE TRAIL!", w / 2, pby + u * (race.avalanche || race.stormWarn > 0 ? 9.2 : 5), u * 2.8, "#ff8a1c", "center");
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ":" + (s < 10 ? "0" : "") + s.toFixed(2);
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ===== game.js =====
/* Race simulation: riders, physics, combat, items, AI. Runs at a fixed 60 Hz step. */

const BASE_SPEED = 11000;
const GRAV = 5200;
const CENT = 0.42;
const STEP = 1 / 60;

function riderVariant(r, dup) {
  if (!dup) return r;
  return Object.assign({}, r, {
    id: r.id, vid: r.id + "-shadow", name: "Shadow " + r.name, full: "Shadow " + r.full,
    main: shade(r.main, -0.55), alt: r.main, paint: shade(r.paint, -0.5), paint2: r.paint, num: r.num + 10, shadow: 1,
  });
}

function makeRiderEntity(rdef, vdef, opts) {
  const upg = opts.upg || [0, 0, 0];
  const e = {
    type: "rider", rider: rdef, veh: vdef, human: !!opts.human, pIndex: opts.pIndex ?? -1, vpIndex: opts.pIndex ?? -1,
    netId: opts.netId ?? null, remote: !!opts.remote,
    z: 0, x: 0, vx: 0, h: 0, vh: 0, speed: 0, lean: 0, tilt: 0, camX: 0, bgX: 0, pedal: 0,
    maxSpd: BASE_SPEED * vdef.max * rdef.spd * (1 + 0.03 * upg[0]),
    accel: BASE_SPEED * 0.3 * vdef.acc * rdef.acc,
    handling: vdef.grip * rdef.hdl * (1 + 0.06 * upg[1]),
    grip: vdef.grip * (1 + 0.06 * upg[1]),
    armor: clamp(vdef.armor + 0.08 * upg[2], -0.2, 0.6),
    mass: vdef.mass * (rdef.id === "bruno" ? 1.25 : rdef.id === "yuki" ? 0.8 : 1),
    pow: rdef.pow, trickMul: vdef.trick,
    maxHp: rdef.hp, hp: rdef.hp, hpShow: rdef.hp,
    boost: 20, items: [rdef.item, rdef.item], boosting: false, padT: 0, drafting: false,
    hurtT: 0, meleeImm: 0, atkT: 0, atkCD: 0, atkSide: 1, atkKick: false, comboN: 0, comboT: 0,
    invuln: 0, flash: 0, wobble: 0, blindT: 0, burnT: 0, shake: 0, fovKick: 0, wipeT: 0,
    trick: null, chain: 0, trickPts: 0, takedowns: 0, wipes: 0,
    finished: false, finishTime: 0, place: 0, popups: [], lastSeg: 0, lastPad: -99,
    dmgT: 0, dmgAmt: 0, bloodT: 0, bloodSeed: 1, perk: null, shield: 0, coinMul: 1,
    driftT: 0, driftOff: 0, driftTier: 0, stallT: 0, cdBoost: false, cdTap: 0, streakK: 0,
    ai: opts.human ? null : { skill: opts.skill || 0.85, aggr: 0.5 + Math.random() * 0.5, t: 0, tx: 0, inp: {} },
    sprites: null, face: null,
  };
  return e;
}

function popup(e, txt, col, big, sub) {
  if (!e.human) return;
  e.popups.unshift({ txt, col, big, sub, t: 0, life: big ? 1.6 : 1.1 });
  if (e.popups.length > 3) e.popups.length = 3;
}

/* ---------------- Race setup ---------------- */
async function createRace(cfg, onProgress) {
  const def = TRACKS.find((t) => t.id === cfg.trackId);
  const track = buildTrack(def);
  const biome = track.biome;
  onProgress && onProgress(0.2);
  const assets = await buildWorldSprites(biome);
  onProgress && onProgress(0.5);

  const riders = [];
  const used = {};
  let localIdx = 0;
  cfg.humans.forEach((hm, i) => {
    const r = RIDERS.find((x) => x.id === hm.riderId);
    const dup = used[r.id];
    used[r.id] = (used[r.id] || 0) + 1;
    const e = makeRiderEntity(riderVariant(r, dup), VEHICLES.find((v) => v.id === hm.vehId), { human: !hm.remote, remote: hm.remote, pIndex: i, upg: hm.upg, netId: hm.netId });
    e.human = true; e.local = !hm.remote; e.pIndex = hm.remote ? i : localIdx++; e.mark = i;
    e.name = hm.name || (cfg.humans.length > 1 ? (cfg.online ? (hm.remote ? "Friend" : "You") : "P" + (i + 1)) : "You");
    riders.push(e);
  });
  const total = cfg.total || 8;
  const R = rng(def.seed * 7 + (cfg.botSeed || 0));
  const pool = RIDERS.map((r) => r.id).sort(() => R() - 0.5);
  pool.sort((a, b) => (used[a] || 0) - (used[b] || 0));
  const biomeIdx = def.biome;
  const diff = cfg.difficulty ?? 1;
  for (let i = 0; riders.length < total; i++) {
    const rid = pool[i % pool.length];
    const r = RIDERS.find((x) => x.id === rid);
    const dup = used[rid];
    used[rid] = (used[rid] || 0) + 1;
    const v = VEHICLES[(R() * VEHICLES.length) | 0];
    const lvl = Math.min(3, Math.floor(biomeIdx * 0.6 + R() * 1.2));
    const skill = clamp([0.72, 0.84, 0.95][diff] + biomeIdx * 0.012 + (R() - 0.5) * 0.08, 0.6, 1.02);
    const e = makeRiderEntity(riderVariant(r, dup), v, { skill, upg: [lvl, lvl, lvl] });
    e.name = (dup ? "Shadow " : "") + r.name;
    riders.push(e);
  }
  // start grid: humans in the middle rows
  const order = riders.slice();
  const humans = order.filter((e) => e.human), bots = order.filter((e) => !e.human);
  const grid = bots.slice(0, 2).concat(humans, bots.slice(2));
  grid.forEach((e, i) => {
    e.z = track.startZ - (Math.floor(i / 2)) * 420 - 200;
    e.x = (i % 2 ? 0.42 : -0.42) + (i % 4 > 1 ? 0.1 : -0.1);
    e.camX = e.x;
    e.lastSeg = Math.floor(e.z / SEG);
  });
  // sprites (prebuilt per rider+vehicle)
  for (const e of riders) {
    const key = (e.rider.vid || e.rider.id) + ":" + TONE;      // art differs per tone, so each tone has its own cache
    if (!riderSpriteCache[key + ":" + e.veh.id]) {
      const out = {};
      await Promise.all(RIDER_POSES.map(async (pose) => {
        const p = pose.startsWith("ride") ? "ride" : pose;
        out[pose] = await svgToCanvas(riderBackSVG(e.rider, e.veh.id, p, pose === "ride1" ? 1 : 0), SPRITE_W, SPRITE_H);
      }));
      riderSpriteCache[key + ":" + e.veh.id] = out;
    }
    e.sprites = riderSpriteCache[key + ":" + e.veh.id];
    if (e.human) e.face = await faceIcon(e.rider);
  }
  onProgress && onProgress(1);

  const race = {
    cfg, track, assets, riders, humans: riders.filter((e) => e.human && e.local),
    projs: [], fx: [], buckets: {}, time: 0, countdown: 3.99, lastBeep: 4,
    split: cfg.humans.filter((h) => !h.remote).length > 1, over: false, overT: 0, finishOrder: [],
    // Avalanche! starts well behind the grid and only gets up to full speed after ~12 s, so riders can get away at the
    // start (it used to catch everyone ~1 s after GO, while they were still accelerating from a standstill).
    avalanche: def.avalanche ? { z: track.startZ - 16000, speed: 0 } : null,
    storm: def.storm ? { t: 14, on: 0 } : null, stormFog: 0, stormWarn: 0,
    touch: IS_TOUCH, events: [],
  };
  return race;
}

const faceCache = {};
async function faceIcon(r) {
  const key = (r.vid || r.id) + ":" + TONE;
  if (faceCache[key]) return faceCache[key];
  // crop the portrait head into a round icon
  const c = await svgToCanvas(portraitSVG(r), 150, 195);
  const out = makeCanvas(96, 96);
  const x = out.getContext("2d");
  x.beginPath(); x.arc(48, 48, 46, 0, TAU); x.fillStyle = r.main; x.fill(); x.save(); x.clip();
  x.drawImage(c, 75 - 62, 25 + 6, 124, 124, 0, 0, 96, 96); x.restore();
  x.lineWidth = 4; x.strokeStyle = "#fff"; x.beginPath(); x.arc(48, 48, 46, 0, TAU); x.stroke();
  faceCache[key] = out;
  return out;
}

/* ---------------- Simulation step ---------------- */
function stepRace(race, inputs, dt) {
  const tr = race.track;
  if (race.hold) { rebuildBuckets(race); return; }
  if (race.countdown > 0) {
    race.countdown -= dt;
    const n = Math.ceil(race.countdown);
    if (n < race.lastBeep) { race.lastBeep = n; race.events.push(n > 0 ? "beep" : "go"); }
    for (const e of race.riders) { e.hpShow = e.hp; updatePopups(e, dt); }
    startTiming(race, inputs);
    if (race.countdown <= 0) applyStarts(race);
    rebuildBuckets(race);
    return;
  }
  race.time += dt;

  // hazards: avalanche & sandstorm
  if (race.avalanche) {
    const lead = Math.min(...race.riders.filter((e) => !e.finished).map((e) => e.z).concat([tr.finishZ]));
    const ramp = clamp(race.time / 12, 0, 1);                       // 0 → full speed over the first 12 s
    race.avalanche.speed = BASE_SPEED * (0.7 + Math.min(0.12, race.time * 0.0012)) * (0.25 + 0.75 * ramp * ramp);
    race.avalanche.z += race.avalanche.speed * dt;
    if (race.time > 12) race.avalanche.z = Math.max(race.avalanche.z, lead - 9000);   // never falls hopelessly far behind
  }
  if (race.storm) {
    const s = race.storm;
    s.t -= dt;
    if (s.t <= 0) { s.on = !s.on; s.t = s.on ? 9 : 16 + Math.random() * 8; if (s.on) { race.stormWarn = 2; race.events.push("storm"); } }
    race.stormFog = lerp(race.stormFog, s.on ? 0.75 : 0, dt * 1.2);
    race.stormWarn = Math.max(0, race.stormWarn - dt);
  }

  // rubber-band reference = best local/remote human (in cutie mode: the favoured player)
  const humans = race.riders.filter((e) => e.human);
  let humanZ = humans.length ? Math.max(...humans.map((e) => e.z)) : 0;
  const fav = cutieFav(race);
  if (fav && !fav.finished) humanZ = fav.z;
  cutieStep(race, fav, dt);

  for (const e of race.riders) {
    if (e.remote) { remoteFollow(race, e, dt); continue; }
    let inp;
    if (e.human) inp = inputs[e.pIndex] || {};
    else inp = aiThink(race, e, dt, humanZ);
    if (e.finished && e.human) inp = Object.assign({}, aiThink(race, e, dt, humanZ), { attack: false, throwBack: false });
    updateRider(race, e, inp, dt);
  }
  riderCollisions(race);
  updateProjectiles(race, dt);
  updateFx(race, dt);
  // places
  const sorted = race.riders.slice().sort((a, b) => {
    if (fav && fav.finished) { if (a === fav) return -1; if (b === fav) return 1; }
    return (a.finished && b.finished) ? a.finishTime - b.finishTime : a.finished ? -1 : b.finished ? 1 : b.z - a.z;
  });
  sorted.forEach((e, i) => (e.place = i + 1));
  // end
  const localHumans = race.riders.filter((e) => e.human && e.local);
  if (!race.over && localHumans.length && localHumans.every((e) => e.finished)) { race.over = true; race.overT = 3.2; }
  if (race.over) race.overT -= dt;
  rebuildBuckets(race);
}

/* ---------------- Perfect start ----------------
   Tap BOOST in the last half-second of the countdown (the second half of "1") = PERFECT START: a launch burst at GO.
   Tap it earlier = TOO EARLY: a short stall at GO. Only the FIRST tap counts, so mashing doesn't work.
   Bots sometimes get a good start too. */
const START_WINDOW = 0.5;
function startTiming(race, inputs) {
  if (race.demo) return;
  for (const e of race.riders) {
    if (!e.human || e.remote || e.cdTap) continue;
    const down = !!(inputs[e.pIndex] && inputs[e.pIndex].boost);
    if (down && !e.cdBoost) e.cdTap = race.countdown <= START_WINDOW ? 1 : -1;
    e.cdBoost = down;
  }
}
function applyStarts(race) {
  for (const e of race.riders) {
    if (e.remote) continue;
    let r = e.cdTap;
    if (!e.human) r = Math.random() < 0.18 + 0.2 * (e.ai ? e.ai.skill - 0.7 : 0) ? 1 : 0;
    if (r === 1) {
      e.speed = e.maxSpd * 0.45; e.padT = Math.max(e.padT, 1.3);
      popup(e, "PERFECT START!", "#2bd9c5", true);
      race.events.push({ snd: "pad", e });
    } else if (r === -1) {
      e.stallT = 0.7;
      popup(e, "TOO EARLY!", "#ff8a1c");
    }
  }
}

function rebuildBuckets(race) {
  const b = (race.buckets = {});
  const put = (e) => { const i = Math.floor(e.z / SEG); (b[i] || (b[i] = [])).push(e); };
  race.riders.forEach(put);
  race.projs.forEach(put);
  race.fx.forEach(put);
}

function updatePopups(e, dt) {
  for (const p of e.popups) { p.t += dt; p.life -= dt; }
  e.popups = e.popups.filter((p) => p.life > 0);
}

function updateRider(race, e, inp, dt) {
  const tr = race.track;
  // timers
  e.hurtT -= dt; e.atkT -= dt; e.atkCD -= dt; e.invuln -= dt; e.flash -= dt * 2; e.wobble -= dt;
  e.blindT -= dt; e.padT -= dt; e.meleeImm -= dt; e.shake = Math.max(0, e.shake - dt * 30); e.comboT -= dt;
  e.hpShow = lerp(e.hpShow, e.hp, Math.min(1, dt * 6));
  e.dmgT -= dt; e.bloodT -= dt;
  updatePopups(e, dt);
  if (e.burnT > 0) { e.burnT -= dt; damage(race, e, 5 * dt, null, "burn", true); }

  if (e.wipeT > 0) {
    e.wipeT -= dt;
    e.speed *= 1 - 1.8 * dt;
    e.z += e.speed * dt;
    e.h = Math.max(0, e.h - 2000 * dt);
    if (e.wipeT <= 0) respawn(race, e);
    camFollow(race, e, dt, { steer: 0 });
    return;
  }

  let seg = segAt(tr, e.z);
  const pct = e.speed / e.maxSpd;
  // ----- surfaces -----
  let surfMax = 1, slip = false;
  const sf = seg.surface;
  if (sf && e.h <= 0 && e.x >= sf.x0 && e.x <= sf.x1) {
    if (sf.type === "sand") { surfMax = 0.72; if (Math.random() < 0.3) spawnFx(race, e.z - 80, e.x + rnd(-0.1, 0.1), 40, "#f2cf91", 70, 0.6); }
    else if (sf.type === "mud") { surfMax = 0.68; if (Math.random() < 0.35) spawnFx(race, e.z - 60, e.x + rnd(-0.1, 0.1), 60, "#5a2e14", 60, 0.5); }
    else if (sf.type === "water") { surfMax = 0.76; if (Math.random() < 0.6) spawnFx(race, e.z - 40, e.x + rnd(-0.15, 0.15), 120, "#d8f1ff", 70, 0.5, 900); }
    else if (sf.type === "ice") slip = true;
    else if (sf.type === "lava") { damage(race, e, 14 * dt, null, "lava", true); e.burnT = Math.max(e.burnT, 0.8); spawnFx(race, e.z - 40, e.x, 60, "#ff7a1f", 60, 0.5, 600); }
  }
  const offroad = Math.abs(e.x) > seg.w + 0.03 || (seg.split > 0.4 && Math.abs(e.x) < 0.2 * seg.split);
  const sideG = Math.abs(e.x) > seg.w + 0.03 ? (e.x < 0 ? seg.gL : seg.gR) : null;
  if (offroad && e.h <= 0 && sideG === "ice") { slip = true; surfMax *= 0.9; }
  else if (offroad && e.h <= 0 && sideG === "water") { surfMax *= 0.55; if (Math.random() < 0.6) spawnFx(race, e.z - 40, e.x + rnd(-0.15, 0.15), 120, "#d8f1ff", 70, 0.5, 900); }
  else if (offroad && e.h <= 0 && sideG === "lava") { surfMax *= 0.6; damage(race, e, 16 * dt, null, "lava", true); e.burnT = Math.max(e.burnT, 0.8); spawnFx(race, e.z - 40, e.x, 60, "#ff7a1f", 60, 0.5, 600); }
  else if (offroad && e.h <= 0) {
    surfMax *= 0.58;
    if (e.human) e.shake = Math.max(e.shake, 2 * pct);
    if (Math.random() < 0.4) spawnFx(race, e.z - 60, e.x + rnd(-0.1, 0.1), 50, tr.biome.ground[0], 80, 0.6);
  }
  e.wrongWay = offroad && Math.abs(e.x) > seg.w + 1.2 && e.human;

  // ----- speed -----
  let max = e.maxSpd * (0.72 + 0.28 * (e.hp / e.maxHp)) * surfMax * (1 + (e.assist || 0));
  e.boosting = false;
  if (inp.boost && e.boost > 0.5 && !e.finished) { e.boosting = true; e.boost = Math.max(0, e.boost - 30 * dt); }
  const bonus = Math.max(e.boosting ? 0.28 : 0, e.padT > 0 ? 0.36 : 0) + (e.boosting && e.padT > 0 ? 0.06 : 0);
  max *= 1 + bonus;
  if (e.drafting) { max *= 1.04; e.boost = Math.min(100, e.boost + 8 * dt); }
  if (e.veh.regen && !e.finished) e.boost = Math.min(100, e.boost + e.veh.regen * dt);
  if (e.finished) max *= 0.7;
  // throttle: everyone auto-accelerates (humans send throttle 1; undefined = full). Kept as a 0..1 knob for tuning.
  let thr = inp.throttle === undefined ? 1 : clamp(inp.throttle, 0, 1);
  if (e.boosting || e.padT > 0) thr = 1;
  if (e.stallT > 0) { e.stallT -= dt; thr = 0; }                   // TOO EARLY at the start
  const target = max * thr;
  let accel = e.accel * (e.boosting || e.padT > 0 ? 2.4 : 1);
  const drifting = !!inp.brake && Math.abs(inp.steer || 0) > 0.35 && pct > 0.4 && e.h <= 0;
  if (inp.brake) e.speed -= BASE_SPEED * (drifting ? 0.18 : 0.9) * dt;
  if (inp.stop && e.h <= 0) e.speed -= BASE_SPEED * 1.15 * dt;
  if (e.speed < target) e.speed = Math.min(target, e.speed + accel * dt * (1 - Math.min(0.8, pct * 0.35)));
  else if (e.speed > max) e.speed -= (e.speed - max) * 2.2 * dt;
  else if (e.h <= 0) e.speed = Math.max(target, e.speed - BASE_SPEED * (0.3 + 0.25 * pct) * dt);   // off the throttle: roll to a stop
  if (e.speedCap !== undefined && e.speed > e.speedCap) e.speed = Math.max(e.speedCap, e.speed - BASE_SPEED * 0.6 * dt);
  if (e.speed < 0) e.speed = 0;
  driftTurbo(race, e, drifting, dt);
  e.fovKick = lerp(e.fovKick, e.boosting || e.padT > 0 ? 1 : 0, dt * 4);

  // ----- steering -----
  const steer = clamp(inp.steer || 0, -1, 1) * (e.blindT > 0 && !e.human ? 0.4 : 1);
  const rate = 2.15 * e.handling * (drifting ? 1.5 : 1) * (e.h > 0 ? 0.55 : 1) * (0.4 + 0.6 * Math.min(1, pct * 1.5)) * Math.min(1, 0.08 + pct * 5);
  const gripK = e.h > 0 ? 2.5 : slip ? 1.2 : 9 * e.grip;
  e.vx += (steer * rate - e.vx) * Math.min(1, gripK * dt);
  e.x += e.vx * dt;
  if (e.h <= 0) e.x -= CENT * pct * pct * seg.curve * dt * (slip ? 1.35 : 1) * (drifting ? 0.5 : 1);
  e.x = clamp(e.x, -(seg.w + 2.4), seg.w + 2.4);
  // rock walls, tunnel sides and bridge / cliff rails
  if ((seg.wl && e.x < -seg.wl) || (seg.wr && e.x > seg.wr)) {
    const side = e.x < 0 ? -1 : 1, lim = side < 0 ? seg.wl : seg.wr;
    e.x = side * lim; e.vx = -side * Math.min(1.2, Math.abs(e.vx) * 0.4 + 0.3);
    e.speed *= 1 - 0.9 * dt;
    if (e.human) e.shake = Math.max(e.shake, 3);
    if (Math.random() < 0.3) spawnFx(race, e.z + 40, e.x, 120, "#fff6a8", 30, 0.3, 500);
    if (!e.wallT || e.wallT < race.time) { e.wallT = race.time + 0.4; race.events.push({ snd: "bump", e }); }
  }
  e.lean = lerp(e.lean, steer * (drifting ? 1.25 : 0.8) + (e.vx - steer * rate) * 0.08, Math.min(1, dt * 8));

  // ----- air & tricks -----
  if (e.h > 0 || e.vh > 0) {
    e.vh -= GRAV * dt;
    e.h += e.vh * dt;
    if (inp.trick && !e.trick && e.h > 120) {
      const def = TRICKS[(inp.trick - 1) % TRICKS.length];
      e.trick = { def, t: 0, dur: def.dur / e.trickMul };
      race.events.push({ snd: "whoosh", e });
    }
    if (e.trick) {
      e.trick.t += dt;
      if (e.trick.t >= e.trick.dur) {
        const pts = Math.round(e.trick.def.pts * (1 + e.chain * 0.5));
        e.trickPts += pts; e.chain++;
        e.boost = Math.min(100, e.boost + pts / 9);
        popup(e, e.trick.def.name.toUpperCase() + (e.chain > 1 ? " x" + e.chain : ""), "#2bd9c5", false, "+" + pts);
        race.events.push({ snd: "trick", e });
        e.trick = null;
      }
    }
    if (e.h <= 0) land(race, e);
  }

  // ----- track features crossed this frame -----
  const prevSeg = e.lastSeg;
  e.z += e.speed * dt;
  e.pedal += dt * (2 + pct * 7);
  const curSeg = Math.floor(e.z / SEG);
  for (let i = prevSeg + 1; i <= curSeg; i++) {
    const s = tr.segs[i];
    if (!s) continue;
    if (e.h <= 0 && s.ramp) for (const r of s.ramp) if (Math.abs(e.x - r.x) < 0.3) { launch(race, e, 1700 + e.speed * 0.22); break; }
    if (e.h <= 0 && s.vent && Math.abs(e.x - s.vent.x) < 0.32) { launch(race, e, 3600); for (let k = 0; k < 14; k++) spawnFx(race, s.i * SEG, s.vent.x + rnd(-0.2, 0.2), 120 + Math.random() * 120, "#f0f0f0", 40 + k * 60, 1.2, 1400); }
    if (e.h < 380 && e.invuln <= 0) collideSprites(race, e, s);
    for (const o of s.objs) {
      if (Math.abs(e.x - o.x) > 0.34 || e.h > 1100) continue;
      if (o.taken > race.time) { catchUpCrate(race, e, o); continue; }
      o.taken = race.time + RESPAWN_T;
      if (race.net && !e.remote) race.net.send({ t: "ev", k: "take", s: s.i, o: s.objs.indexOf(o) });
      if (o.kind === "crate") {
        const lucky = e === cutieFav(race);
        if (e.items.length < 3) e.items.push(Math.random() < (lucky ? 0.6 : 0.25) ? e.rider.item : tr.biome.item);
        if (lucky) e.boost = Math.min(100, e.boost + 12);
        popup(e, "+ " + ITEMS[e.items[e.items.length - 1]].name.toUpperCase(), "#ffd23f");
        race.events.push({ snd: "pickup", e });
      } else {
        e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.4);
        popup(e, "REPAIRED!", "#2bd96a");
        race.events.push({ snd: "repair", e });
      }
    }
  }
  seg = segAt(tr, e.z);
  const d = seg.decal;
  if (d && d.type === "boost" && e.h <= 0 && e.x >= d.x0 - 0.05 && e.x <= d.x1 + 0.05 && seg.i - d.k !== e.lastPad) {
    e.lastPad = seg.i - d.k; e.padT = 1.4; e.boost = Math.min(100, e.boost + 5);
    race.events.push({ snd: "pad", e });
  }
  e.lastSeg = curSeg;

  // ----- combat -----
  if (inp.attack && e.atkCD <= 0 && e.h <= 0 && !e.finished) attack(race, e);
  if (inp.throwBack && e.atkCD <= 0 && e.items.length && !e.finished) { throwItem(race, e, -1); e.atkCD = 0.4; }

  // ----- avalanche -----
  if (race.avalanche && e.z < race.avalanche.z + 250 && !e.finished) {
    damage(race, e, 18 * dt, null, "avalanche", true);
    e.speed = Math.min(e.speed, e.maxSpd * 0.6);
    if (Math.random() < 0.5) spawnFx(race, e.z - 100, e.x + rnd(-0.4, 0.4), 100, "#ffffff", 120, 0.6, 400);
  }

  // finish
  const favE = cutieFav(race);
  if (favE && e !== favE && !favE.finished && !e.finished && !e.remote && e.z >= tr.finishZ - 160) { e.z = tr.finishZ - 160; e.speed = Math.min(e.speed, favE.speed * 0.5); }
  if (!e.finished && e.z >= tr.finishZ) {
    e.finished = true; e.finishTime = race.time; race.finishOrder.push(e);
    e.trick = null;
    race.events.push({ snd: "finish", e });
  }
  if (e.z > tr.length - SEG * 160) e.speed = Math.min(e.speed, e.maxSpd * 0.4);

  camFollow(race, e, dt, { steer });
}

/* ---------------- Crates & repair kits ----------------
   Taken crates and repair kits come back after RESPAWN_T seconds. Catch-up: a HUMAN rider in the back half of the pack who
   rides through an EMPTY crate spot still gets an item (once per crate spot per rider). They see a faint outline of
   the crate there (render.js). Leaders don't, so the help goes to whoever is behind. */
const RESPAWN_T = 4;
function inBackHalf(race, e) { return e.place > race.riders.length / 2; }
function catchUpCrate(race, e, o) {
  // humans only: when bots got it too, twice as many items were thrown at the player (simulated), so it stays a
  // catch-up for people, not more ammo for the pack
  if (!e.human || o.kind !== "crate" || !inBackHalf(race, e) || e.items.length >= 3 || e.finished) return;
  const got = o.gotBy || (o.gotBy = new Set());
  if (got.has(e)) return;
  got.add(e);
  e.items.push(Math.random() < 0.25 ? e.rider.item : race.track.biome.item);
  popup(e, "+ " + ITEMS[e.items[e.items.length - 1]].name.toUpperCase(), "#ffd23f");
  race.events.push({ snd: "pickup", e });
}

/* ---------------- Drift mini-turbos ----------------
   Hold DRIFT through a corner: sparks under the wheels go BLUE → ORANGE → PINK the longer the drift lasts.
   Let go (or straighten up) and you get a speed burst; bigger for each colour. A short grace period means a quick
   wobble of the stick doesn't cancel the drift. Tune the times / burst lengths here. */
const DRIFT_TIERS = [0.7, 1.5, 2.4];            // seconds of drifting for blue, orange, pink
const DRIFT_BURST = [0.55, 0.95, 1.4];          // burst length (s) at each tier (uses the boost-pad speed bonus)
const DRIFT_COLS = ["#4fb3ff", "#ff8a1c", "#ff4fd8"];
const DRIFT_NAMES = ["MINI-TURBO", "SUPER TURBO", "ULTRA TURBO"];
function driftTurbo(race, e, drifting, dt) {
  if (drifting) {
    e.driftT += dt; e.driftOff = 0;
    const tier = DRIFT_TIERS.filter((x) => e.driftT >= x).length;
    if (tier > e.driftTier) { e.driftTier = tier; if (e.human) race.events.push({ snd: "tier", e }); }
    const col = tier ? DRIFT_COLS[tier - 1] : "#f4ecd8";
    const n = tier ? 3 : Math.random() < 0.5 ? 1 : 0;              // sparks spray from both sides of the rear wheel
    for (let k = 0; k < n; k++) {
      const side = k % 2 ? -1 : 1;
      spawnFx(race, e.z + 15 + rnd(-10, 10), e.x + side * (0.07 + Math.random() * 0.05), 10 + Math.random() * 30, col, tier ? 34 + tier * 8 : 22, 0.22, 250 + Math.random() * 350);
      const f = race.fx[race.fx.length - 1]; if (f) f.vz = e.speed * 0.92;      // sparks travel with the bike (they'd fly back at the camera otherwise)
    }
    return;
  }
  if (e.driftT <= 0) return;
  e.driftOff += dt;
  if (e.driftOff < 0.15 && e.h <= 0) return;   // grace: a quick wobble keeps the drift alive
  const tier = e.driftTier;
  e.driftT = 0; e.driftOff = 0; e.driftTier = 0;
  if (!tier) return;
  e.padT = Math.max(e.padT, DRIFT_BURST[tier - 1]);
  popup(e, DRIFT_NAMES[tier - 1] + "!", DRIFT_COLS[tier - 1]);
  race.events.push({ snd: "pad", e });
}

function camFollow(race, e, dt, inp) {
  if (!e.human && !e.cam) return;
  const seg = segAt(race.track, e.z);
  // camera pitch follows the slope just ahead (looks a little further ahead so drops show before you reach them)
  const tr = race.track, y0 = roadY(tr, e.z);
  const sl = Math.min((roadY(tr, e.z + 10 * SEG) - y0) / (10 * SEG), (roadY(tr, e.z + 26 * SEG) - y0) / (26 * SEG) * 0.9 + (roadY(tr, e.z + 10 * SEG) - y0) / (10 * SEG) * 0.1);
  const tgt = clamp(sl < 0 ? sl * RENDER.PITCH_DOWN : sl * RENDER.PITCH_UP, -0.75, 0.3);
  e.pitch = lerp(e.pitch || 0, tgt, Math.min(1, dt * 2.6));
  const inTun = segAt(tr, e.z - PLAYER_DIST).tun || seg.tun;
  e.tunT = lerp(e.tunT || 0, inTun ? 1 : 0, Math.min(1, dt * 4));
  if (inTun) e.tunKind = inTun;
  e.camX = lerp(e.camX, e.x * 0.82, Math.min(1, dt * 7));
  e.tilt = lerp(e.tilt, -(inp.steer || 0) * 0.03 - seg.curve * 0.0045 * (e.speed / e.maxSpd), Math.min(1, dt * 3));
  e.bgX += seg.curve * (e.speed / BASE_SPEED) * dt * 160;
}

function launch(race, e, vh) {
  e.vh = vh; e.h = 1; e.chain = 0;
  race.events.push({ snd: "jump", e });
}

function land(race, e) {
  const fall = -e.vh;
  e.h = 0; e.vh = 0;
  if (e.trick) {
    const p = e.trick.t / e.trick.dur;
    e.trick = null;
    if (p < 0.72) {
      damage(race, e, 18, null, "crash");
      e.speed *= 0.4; e.hurtT = 0.9; e.wobble = 1; e.chain = 0;
      popup(e, "BAILED!", "#ff3b3b", true);
      race.events.push({ snd: "crash", e });
      return;
    }
    popup(e, "SKETCHY!", "#ffcf3a");
  }
  if (e.chain > 0) {
    popup(e, e.chain > 2 ? "INSANE COMBO!" : e.chain > 1 ? "CLEAN COMBO!" : "CLEAN LANDING!", "#ffd23f", e.chain > 1);
    e.padT = Math.max(e.padT, 0.5 + e.chain * 0.25);
    e.chain = 0;
  }
  if (e.human) e.shake = Math.min(10, fall / 400);
  race.events.push({ snd: "land", e });
}

function collideSprites(race, e, s) {
  const assets = race.assets;
  const rHalf = (e.veh.w / ROAD_W) * 0.28;
  for (const sp of s.sprites) {
    if (sp.flat || sp.dead || sp.gate) continue;
    const S = assets.sprites[sp.id];
    if (!S || (!S.solid && !S.obstacle)) continue;
    const half = (S.ww / ROAD_W) * 0.5 * (S.obstacle === "log" ? 0.92 : 0.5);
    if (Math.abs(e.x - sp.x) > half + rHalf) continue;
    if (S.obstacle === "small") {
      sp.dead = true;
      damage(race, e, 5, null, "crash");
      e.speed *= 0.85;
      for (let k = 0; k < 8; k++) spawnFx(race, e.z + 100, sp.x + rnd(-0.15, 0.15), 60 + Math.random() * 100, "#a0783c", 60, 0.7, 700);
      race.events.push({ snd: "bump", e });
      continue;
    }
    damage(race, e, 10 + (e.speed / BASE_SPEED) * 8, null, "crash");
    e.speed *= e === cutieFav(race) ? 0.55 : 0.32;
    const dir = e.x < sp.x ? -1 : 1;
    e.x = sp.x + dir * (half + rHalf + 0.02);
    e.vx = dir * 2.2;
    e.hurtT = 0.7; e.wobble = 1; e.invuln = 0.7;
    if (e.human) e.shake = 12;
    for (let k = 0; k < 10; k++) spawnFx(race, e.z + 60, e.x + rnd(-0.2, 0.2), 80 + Math.random() * 200, "#d9c8a8", 60, 0.7, 900);
    race.events.push({ snd: "crash", e });
    return;
  }
}

function damage(race, e, amt, by, kind, silent) {
  if (e.wipeT > 0 || e.finished) return;
  if (e.remote) {
    // the owner of that rider applies damage on their own device
    if (race.net && (kind === "melee" || kind === "bump")) race.net.queueHit(e, amt, by, kind);
    return;
  }
  if (e.invuln > 0 && (kind === "melee" || kind === "item" || kind === "crash")) return;
  if (e.shield > 0 && (kind === "melee" || kind === "item" || kind === "crash" || kind === "bump")) {      // Daily Spin perk: blocks the first hit
    e.shield = 0; e.invuln = 0.7; e.flash = 0;
    popup(e, "SHIELD BLOCKED IT!", "#2bd9c5", true);
    race.events.push({ snd: "unlock", e });
    return;
  }
  if (kind === "melee") { if (e.meleeImm > 0) return; e.meleeImm = 0.38; }
  // bots hit humans a bit softer (scaled by difficulty) so a good rider isn't ganged into constant wipeouts
  if (by && !by.human && e.human) amt *= [0.6, 0.78, 0.95][race.cfg.difficulty ?? 1];
  if (e === cutieFav(race)) amt *= 0.55;
  e.hp -= amt * (1 - e.armor);
  if (!silent) {
    e.flash = 1; e.hurtT = Math.max(e.hurtT, 0.35); e.wobble = Math.max(e.wobble, 0.5);
    if (e.human) { e.dmgAmt = (e.dmgT > 0 ? e.dmgAmt : 0) + amt * (1 - e.armor); e.dmgT = 1.1; }   // number shown on the HP bar
    if (SAVAGE() && amt >= 6) bloodBurst(race, e, amt >= 14 ? 2 : 1);
  }
  if (e.hp <= 0) {
    e.hp = 0; e.wipeT = 1.8; e.trick = null; e.wipes++; e.vh = 0;
    popup(e, "WIPEOUT!", "#ff3b3b", true);
    if (SAVAGE()) bloodBurst(race, e, 3);
    race.events.push({ snd: "wipe", e });
    if (by) {
      by.takedowns++;
      by.boost = Math.min(100, by.boost + 35);
      popup(by, "TAKEDOWN!", "#ff3d7f", true, "+40 coins");
    }
  }
}

function respawn(race, e) {
  const seg = segAt(race.track, e.z);
  e.hp = Math.round(e.maxHp * 0.65); e.invuln = 2; e.speed = e.maxSpd * 0.5;
  if (race.avalanche && race.avalanche.z > e.z - 2500) race.avalanche.z = e.z - 4000;
  e.x = clamp(e.x, -seg.w * 0.7, seg.w * 0.7); e.vx = 0; e.h = 0; e.vh = 0;
  if (seg.split > 0.3 && Math.abs(e.x) < 0.3) e.x = e.x < 0 ? -0.8 : 0.8;
}

function attack(race, e) {
  let best = null, bd = 1e9;
  for (const o of race.riders) {
    if (o === e || o.wipeT > 0 || o.finished || o.h > 500) continue;
    const dz = Math.abs(o.z - e.z), dx = Math.abs(o.x - e.x);
    if (dz < 320 && dx < 0.58) { const d = dz + dx * 500; if (d < bd) { bd = d; best = o; } }
  }
  if (best) {
    const side = best.x === e.x ? (Math.random() < 0.5 ? -1 : 1) : sign(best.x - e.x);
    e.comboN = e.comboT > 0 ? e.comboN + 1 : 1;
    e.comboT = 1.5;
    const kick = e.comboN % 3 === 0;
    e.atkSide = side; e.atkKick = kick; e.atkT = 0.3; e.atkCD = kick ? 0.6 : 0.42;
    if (race.net && best.remote) race.net.hitInfo = { slow: kick ? 0.72 : 0.9, push: side * (kick ? 3.2 : 1.4) * Math.min(2, e.mass / best.mass) };
    damage(race, best, (kick ? 17 : 9) * e.pow, e, "melee");
    best.speed *= kick ? 0.72 : 0.9;
    best.vx += side * (kick ? 3.2 : 1.4) * Math.min(2, e.mass / best.mass);
    best.hurtT = Math.max(best.hurtT, 0.45);
    if (best.human) best.shake = kick ? 10 : 5;
    for (let k = 0; k < 6; k++) spawnFx(race, best.z, best.x - side * 0.1 + rnd(-0.05, 0.05), 500 + Math.random() * 200, "#fff6a8", 40, 0.3, 300);
    race.events.push({ snd: kick ? "kick" : "punch", e, target: best });
    if (e.human) popup(e, kick ? "KICK!" : "POW!", kick ? "#ff8a1c" : "#fff");
  } else if (e.items.length) {
    throwItem(race, e, 1);
    e.atkT = 0.22; e.atkKick = false; e.atkSide = 1; e.atkCD = 0.4;
  } else {
    e.atkSide = -e.atkSide; e.atkKick = false; e.atkT = 0.25; e.atkCD = 0.35;
    race.events.push({ snd: "swing", e });
  }
}

let projSeq = 0;
function throwItem(race, e, dir) {
  const id = e.items.shift();
  spawnProjectiles(race, e, id, dir, e.z, e.x, e.speed, null);
  if (race.net) race.net.send({ t: "ev", k: "throw", i: race.riders.indexOf(e), item: id, dir, z: e.z, x: e.x, sp: e.speed, id: race.lastProjId });
}
function spawnProjectiles(race, e, id, dir, z, x, sp, netId) {
  const it = ITEMS[id];
  const n = it.spread || 1;
  const base = netId || (race.net ? race.net.role + ":" : "") + (++projSeq);
  race.lastProjId = base;
  for (let k = 0; k < n; k++) {
    race.projs.push({
      type: "proj", item: id, owner: e, z: z + dir * 160, x: x + (n > 1 ? (k - 1) * 0.3 : 0), h: 320, id: base + "/" + k,
      vz: dir > 0 ? sp + it.spd : sp * 0.35, vx: n > 1 ? (k - 1) * 0.5 : 0, life: dir > 0 ? 2.6 : 6, dir, big: id === "boulder",
    });
  }
  race.events.push({ snd: "throw", e });
}

function updateProjectiles(race, dt) {
  const keep = [];
  for (const p of race.projs) {
    p.life -= dt;
    const it = ITEMS[p.item];
    if (it.home && p.dir > 0) {
      let tgt = null, bd = 4000;
      for (const o of race.riders) if (o !== p.owner && o.wipeT <= 0 && o.z > p.z && o.z - p.z < bd) { bd = o.z - p.z; tgt = o; }
      if (tgt) p.vx = lerp(p.vx, (tgt.x - p.x) * 2.5, dt * 4);
    }
    p.z += p.vz * dt; p.x += p.vx * dt;
    p.h = p.dir > 0 ? 300 + Math.sin(p.life * 6) * 40 : Math.max(120, p.h - 400 * dt);
    let hit = false;
    for (const o of race.riders) {
      if (o === p.owner || o.wipeT > 0 || o.finished || o.h > 700 || o.remote) continue;
      if (Math.abs(o.z - p.z) < 200 && Math.abs(o.x - p.x) < 0.3) {
