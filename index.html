<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wild Riders</title>
<meta name="description" content="Downhill bike and ATV racing with anime riders, punches, throwables and wild nature tracks.">
<meta name="theme-color" content="#14101c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wild Riders">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/bangers.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Bangers"; src: url("fonts/bangers.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Chakra Petch"; font-weight: 500; src: url("fonts/chakra-500.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "Chakra Petch"; font-weight: 700; src: url("fonts/chakra-700.woff2") format("woff2"); font-display: swap; }

:root {
  --ink: #14101c; --ink2: #221a33; --panel: rgba(28, 20, 44, .86); --line: rgba(255,255,255,.14);
  --hot: #ff3d7f; --sun: #ffd23f; --teal: #2bd9c5; --orange: #ff8a1c; --sky: #2b9cff; --good: #2bd96a; --bad: #ff3b3b;
  --txt: #f5f1ff; --mute: #a99cc7;
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--txt); font-family: "Chakra Petch", system-ui, sans-serif; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
.hidden { display: none !important; }
button, .trk, .seg button, .back { touch-action: manipulation; }

/* ---------- screens ---------- */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; padding: calc(10px + var(--st)) calc(14px + var(--sr)) calc(10px + var(--sb)) calc(14px + var(--sl)); overflow: hidden;
  background: radial-gradient(120% 90% at 80% -10%, #4b2a7a 0%, rgba(75,42,122,0) 55%), radial-gradient(90% 80% at 0% 110%, #6b1f4a 0%, rgba(107,31,74,0) 60%), linear-gradient(160deg, #1a1030, #0e0a18); }
.screen::before { content: ""; position: absolute; inset: -50%; background: repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 46px); animation: drift 6s linear infinite; pointer-events: none; }
@keyframes drift { to { transform: translateX(46px); } }
.screen > * { position: relative; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.topbar h2 { margin: 0; flex: 1; font: 400 clamp(26px, 5.2vh, 40px)/1 Bangers, Impact, sans-serif; letter-spacing: 1.5px; text-shadow: 3px 3px 0 var(--ink); }
.coins { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 20px; background: rgba(0,0,0,.35); border: 1px solid var(--line); font-weight: 700; font-size: 16px; }
.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6b0, #ffd23f 45%, #d99a00); box-shadow: inset 0 0 0 2px #b37b00; }
.back { width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(255,255,255,.1); color: #fff; font: 400 26px Bangers, sans-serif; }

.btn { --c: var(--hot); position: relative; border: 0; padding: 0 26px; height: 52px; color: #fff; font: 400 24px/1 Bangers, Impact, sans-serif; letter-spacing: 1.2px; cursor: pointer; background: var(--c);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000)); clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
  text-shadow: 2px 2px 0 rgba(0,0,0,.45); transition: transform .08s; }
.btn:active { transform: scale(.95); }
.btn.sm { height: 40px; font-size: 19px; padding: 0 16px; }
.btn.ghost { --c: #3a2d55; }
.btn[disabled] { filter: grayscale(.8) brightness(.7); }
.btn .tag { position: absolute; top: -2px; right: 10px; font: 700 10px "Chakra Petch"; background: var(--sun); color: var(--ink); padding: 1px 6px; border-radius: 3px; text-shadow: none; letter-spacing: 0; }

/* ---------- title ---------- */
#scr-title { padding-top: calc(6px + var(--st)); background: linear-gradient(90deg, rgba(14,10,24,.92) 0%, rgba(14,10,24,.7) 45%, rgba(14,10,24,.15) 100%); }
#scr-title::before { display: none; }
.title-wrap { flex: 1; display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; align-items: center; min-height: 0; }
.logo { font: 400 clamp(50px, 14vh, 120px)/.86 Bangers, Impact, sans-serif; letter-spacing: 3px; transform: skewX(-8deg) rotate(-3deg); margin: 0 0 clamp(8px, 3vh, 22px) 8px;
  background: linear-gradient(180deg, #fff6b0 0%, var(--sun) 40%, var(--orange) 70%, var(--hot) 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(4px 4px 0 var(--ink)) drop-shadow(0 0 18px rgba(255,61,127,.45)); }
.logo small { display: block; font-size: .24em; letter-spacing: 5px; line-height: 1.2; color: var(--teal); -webkit-text-fill-color: var(--teal); margin: 6px 0 0 4px; }
.title-cast { position: relative; height: 100%; min-height: 0; }
.title-cast .por { position: absolute; bottom: 0; width: 34%; filter: drop-shadow(4px 6px 0 rgba(0,0,0,.4)); animation: bob 2.4s ease-in-out infinite; }
.title-cast .por svg { width: 100%; height: auto; display: block; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.menu { display: flex; flex-direction: column; gap: 9px; align-items: flex-start; }
.menu .btn { width: min(330px, 40vw); text-align: left; }
.menu .row { display: flex; gap: 9px; }
.menu .row .btn { width: calc((min(330px, 40vw) - 9px) / 2); text-align: center; }
.hint { position: absolute; left: 0; right: 0; bottom: calc(6px + var(--sb)); text-align: center; font-size: 12px; color: var(--mute); }

/* ---------- cards / grids ---------- */
.cards { flex: 1; display: grid; gap: 10px; min-height: 0; padding: 8px 2px; overflow-x: auto; overflow-y: hidden; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
.card { position: relative; scroll-snap-align: start; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform .12s, border-color .12s; min-height: 0; }
.card.sel { border-color: var(--sun); transform: translateY(-3px); box-shadow: 0 0 0 3px rgba(255,210,63,.25), 0 10px 22px rgba(0,0,0,.4); }
.card .art { position: relative; flex: 1; min-height: 0; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.card .art::before { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, var(--c1, #333), var(--c2, #111)); clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%); }
.card .art svg { position: relative; max-width: 100%; max-height: 100%; height: 100%; width: auto; }
.card .info { padding: 6px 10px 9px; }
.card .nm { font: 400 22px/1 Bangers, sans-serif; letter-spacing: 1px; }
.card .tg { font-size: 11px; color: var(--mute); text-transform: uppercase; letter-spacing: 1px; }
.lock { position: absolute; inset: 0; background: rgba(10,6,18,.8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 400 22px Bangers, sans-serif; z-index: 2; text-align: center; padding: 8px; }
.lock .coins { font-size: 15px; }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; font-size: 10px; font-weight: 700; color: var(--mute); margin-top: 5px; }
.bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--teal), var(--sun)); }
.bar i.up { background: linear-gradient(90deg, var(--teal), var(--good)); }

.footer { display: flex; align-items: center; gap: 10px; padding-top: 6px; min-height: 52px; }
.footer .desc { flex: 1; font-size: 13px; color: var(--mute); line-height: 1.3; min-width: 0; }
.footer .desc b { color: var(--txt); font-size: 15px; }

/* rider select detail */
.who { position: absolute; top: 8px; left: 10px; font: 400 18px Bangers; padding: 2px 10px; border-radius: 10px; z-index: 3; color: var(--ink); }

/* tracks */
.biome .art { flex: 1; }
.biome .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.tracks { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
.trk { display: flex; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 10px; background: rgba(255,255,255,.07); border: 2px solid transparent; font-weight: 700; font-size: 13px; }
.trk.sel { border-color: var(--sun); background: rgba(255,210,63,.12); }
.trk .st { margin-left: auto; color: var(--sun); letter-spacing: 1px; white-space: nowrap; }
.trk .st .off { color: rgba(255,255,255,.2); }
.trk .bt { font-size: 11px; color: var(--mute); font-weight: 500; }

/* garage upgrades */
.upg { display: flex; flex-direction: column; gap: 6px; min-width: 210px; }
.upg .u { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.upg .pips { display: flex; gap: 3px; flex: 1; }
.upg .pips i { flex: 1; height: 8px; border-radius: 2px; background: rgba(255,255,255,.14); }
.upg .pips i.on { background: var(--good); }

/* ---------- modal / overlays ---------- */
#modal { position: fixed; inset: 0; background: rgba(8,5,14,.72); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
.mbox { width: min(560px, 92vw); max-height: 92vh; overflow: auto; background: linear-gradient(170deg, #2b1f45, #1a1230); border: 2px solid var(--line); border-radius: 18px; padding: 18px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.mbox h3 { margin: 0 0 10px; font: 400 34px/1 Bangers, sans-serif; letter-spacing: 1.5px; }
.mbox p { margin: 6px 0; font-size: 14px; line-height: 1.45; color: #ddd3f5; }
.mbox .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.mbox textarea { width: 100%; height: 84px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: #fff; font: 12px/1.3 ui-monospace, monospace; padding: 8px; user-select: text; -webkit-user-select: text; touch-action: auto; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-weight: 700; }
.seg { display: inline-flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; color: var(--mute); font: 700 13px "Chakra Petch"; padding: 8px 12px; }
.seg button.on { background: var(--teal); color: var(--ink); }
.ctl-help { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; line-height: 1.35; margin: 6px 0; }
.ctl-help b { font: 400 18px Bangers, sans-serif; letter-spacing: 1px; color: var(--sun); white-space: nowrap; }

/* results */
.results { flex: 1; display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; min-height: 0; }
.standings { background: var(--panel); border-radius: 16px; border: 2px solid var(--line); padding: 6px; overflow: auto; }
.srow { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 10px; font-weight: 700; font-size: 14px; }
.srow.me { background: rgba(43,217,197,.18); }
.srow .pl { width: 26px; font: 400 22px Bangers; color: var(--sun); }
.srow canvas { width: 30px; height: 30px; }
.srow .tm { margin-left: auto; color: var(--mute); font-size: 13px; }
.reward { background: var(--panel); border-radius: 16px; border: 2px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.reward .big { font: 400 46px/1 Bangers; text-align: center; color: var(--sun); text-shadow: 3px 3px 0 var(--ink); }
.reward .ln { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: #ddd3f5; }
.reward .stars { text-align: center; font-size: 34px; letter-spacing: 6px; color: var(--sun); }
.reward .stars .off { color: rgba(255,255,255,.18); }

#loading { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(160deg, #1a1030, #0e0a18); }
#loading .lt { font: 400 40px Bangers; letter-spacing: 2px; }
#loading .lb { width: min(360px, 70vw); height: 10px; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; }
#loading .lb i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--sun)); transition: width .2s; }
#loading .tip { max-width: 520px; text-align: center; color: var(--mute); font-size: 14px; padding: 0 20px; }

#rotate { position: fixed; inset: 0; z-index: 60; background: #0e0a18; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 30px; font: 400 30px Bangers; letter-spacing: 1px; }
#rotate .ph { width: 70px; height: 116px; border: 5px solid #fff; border-radius: 14px; animation: rot 2s ease-in-out infinite; }
@keyframes rot { 40%, 60% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }

#install { position: fixed; left: 50%; bottom: calc(10px + var(--sb)); transform: translateX(-50%); z-index: 20; background: #fff; color: var(--ink); border-radius: 14px; padding: 10px 14px; font-size: 13px; font-weight: 700; display: flex; gap: 10px; align-items: center; box-shadow: 0 8px 30px rgba(0,0,0,.5); max-width: 92vw; }
#install button { border: 0; background: var(--ink); color: #fff; border-radius: 8px; padding: 6px 10px; font-weight: 700; }

.toast { position: fixed; top: calc(14px + var(--st)); left: 50%; transform: translateX(-50%); z-index: 40; background: var(--sun); color: var(--ink); font: 400 22px Bangers; letter-spacing: 1px; padding: 8px 18px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: pop .25s ease-out; }
@keyframes pop { from { transform: translate(-50%, -20px); opacity: 0; } }

/* online */
.codebox { font: 400 64px/1 Bangers; letter-spacing: 14px; text-align: center; color: var(--sun); padding: 10px; text-shadow: 3px 3px 0 var(--ink); }
.codein { width: 100%; font: 400 44px/1 Bangers; letter-spacing: 12px; text-align: center; text-transform: uppercase; border-radius: 12px; border: 2px solid var(--line); background: rgba(0,0,0,.35); color: #fff; padding: 10px; touch-action: auto; user-select: text; -webkit-user-select: text; }

@media (max-height: 500px) {
  .mbox { padding: 12px 16px; max-height: 96vh; width: min(760px, 94vw); }
  .mbox h3 { font-size: 26px; margin-bottom: 6px; }
  .mbox .acts { margin-top: 8px; }
  .ctl-help { grid-template-columns: auto 1fr auto 1fr; gap: 5px 10px; font-size: 12px; line-height: 1.3; }
  .ctl-help b { font-size: 15px; }
  .kbd-note { display: none; }
}
@media (max-height: 430px) {
  .btn { height: 44px; font-size: 21px; }
  .menu { gap: 7px; }
  .card .nm { font-size: 19px; }
  .stats { font-size: 9px; gap: 2px 6px; }
  .footer { min-height: 46px; }
}

</style>
</head>
<body>
<canvas id="game"></canvas>

<section id="scr-title" class="screen hidden">
  <div class="topbar"><div style="flex:1"></div><span class="coins"><i class="coin"></i><span class="coinv">0</span></span></div>
  <div class="title-wrap">
    <div>
      <h1 class="logo">WILD<br>RIDERS<small>DOWNHILL · BRAWL · BOOST</small></h1>
      <div class="menu">
        <button class="btn" style="--c:#ff3d7f" data-act="race">RACE</button>
        <button class="btn" style="--c:#ff8a1c" data-act="split">2 PLAYERS · ONE SCREEN</button>
        <button class="btn" style="--c:#2b9cff" data-act="online">2 PLAYERS · ONLINE</button>
        <div class="row">
          <button class="btn sm" style="--c:#13a89e" data-act="garage">GARAGE</button>
          <button class="btn sm ghost" data-act="settings">SETTINGS</button>
        </div>
      </div>
    </div>
    <div class="title-cast" id="cast"></div>
  </div>
</section>

<section id="scr-rider" class="screen hidden">
  <div class="topbar"><button class="back" data-act="back">‹</button><h2 id="rider-h">CHOOSE YOUR RIDER</h2><span class="coins"><i class="coin"></i><span class="coinv">0</span></span></div>
  <div class="cards" id="rider-cards"></div>
  <div class="footer"><div class="desc" id="rider-desc"></div><button class="btn" id="rider-go">NEXT ›</button></div>
</section>

<section id="scr-veh" class="screen hidden">
  <div class="topbar"><button class="back" data-act="back">‹</button><h2 id="veh-h">CHOOSE YOUR RIDE</h2><span class="coins"><i class="coin"></i><span class="coinv">0</span></span></div>
  <div class="cards" id="veh-cards"></div>
  <div class="footer"><div class="desc" id="veh-desc"></div><div class="upg" id="veh-upg"></div><button class="btn" id="veh-go">NEXT ›</button></div>
</section>

<section id="scr-track" class="screen hidden">
  <div class="topbar"><button class="back" data-act="back">‹</button><h2>CHOOSE A TRAIL</h2><span class="coins"><i class="coin"></i><span class="coinv">0</span></span></div>
  <div class="cards" id="track-cards"></div>
  <div class="footer"><div class="desc" id="track-desc"></div><button class="btn" style="--c:#2bd96a" id="track-go">RIDE!</button></div>
</section>

<section id="scr-results" class="screen hidden">
  <div class="topbar"><h2 id="res-h">RESULTS</h2><span class="coins"><i class="coin"></i><span class="coinv">0</span></span></div>
  <div class="results"><div class="standings" id="res-list"></div><div class="reward" id="res-reward"></div></div>
  <div class="footer"><div class="desc"></div><button class="btn ghost sm" data-act="menu">MENU</button><button class="btn sm" style="--c:#ff8a1c" data-act="retry">RETRY</button><button class="btn" style="--c:#2bd96a" id="res-next">NEXT TRAIL ›</button></div>
</section>

<div id="loading" class="hidden"><div class="lt">LOADING TRAIL…</div><div class="lb"><i></i></div><div class="tip"></div></div>
<div id="modal" class="hidden"><div class="mbox"></div></div>
<div id="rotate"><div class="ph"></div>Turn your phone sideways to ride</div>
<div id="install" class="hidden"></div>

<script>
// ===== core.js =====
"use strict";
/* Core helpers shared by every module. */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => (v < 0 ? -1 : v > 0 ? 1 : 0);
const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

// Seeded RNG (mulberry32) so tracks are identical on every device (needed for online play).
function rng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

// Rasterize an SVG string into a canvas (async). Data-URL SVG images draw fine on iOS Safari.
function svgToCanvas(svg, w, h) {
  return new Promise((resolve) => {
    const img = new Image();
    const c = makeCanvas(w, h);
    img.onload = () => {
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c);
    };
    img.onerror = () => resolve(c);
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(h1, h2, t) {
  const a = hexToRgb(h1), b = hexToRgb(h2);
  const r = a.map((v, i) => Math.round(lerp(v, b[i], t)));
  return "#" + r.map((v) => v.toString(16).padStart(2, "0")).join("");
}
function shade(hex, amt) { return amt < 0 ? mix(hex, "#000000", -amt) : mix(hex, "#ffffff", amt); }
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

const IS_TOUCH = "ontouchstart" in window || navigator.maxTouchPoints > 0;
const now = () => performance.now() / 1000;

// ===== data.js =====
/* Game data: riders, vehicles, items, biomes, tracks, progression. */

const RIDERS = [
  { id: "kaito", name: "Kaito", full: "Kaito Arashi", tag: "The Storm", num: 7,
    blurb: "Calm, cocky, never brakes. Rides like the wind he's named after.",
    hp: 100, spd: 1.0, acc: 1.0, hdl: 1.0, pow: 1.0, item: "shuriken",

/* Character & vehicle art. Everything is SVG authored in code, rasterized to canvas for the race.
   Back-view sprites (what you see in the race) + front-view anime portraits (menus) + side-view vehicles. */

const OL = "#1b1426";           // ink outline
const FONT = "Arial Black,Impact,Helvetica,sans-serif";

const SV = {
  line(x1, y1, x2, y2, w, c, ol = OL) {
    const d = `M${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}`;
    return `<path d="${d}" stroke="${ol}" stroke-width="${w + 5}" stroke-linecap="round" fill="none"/>` +
      `<path d="${d}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;
  },
  poly(pts, w, c, ol = OL) {
    const d = "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L");
    return `<path d="${d}" stroke="${ol}" stroke-width="${w + 5}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>` +
      `<path d="${d}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
  },
  path(d, fill, sw = 3, extra = "") {
    return `<path d="${d}" fill="${fill}" stroke="${OL}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
  },
  circ(x, y, r, fill, sw = 3) { return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${OL}" stroke-width="${sw}"/>`; },
  ell(x, y, rx, ry, fill, sw = 3, extra = "") { return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${OL}" stroke-width="${sw}" ${extra}/>`; },
  rect(x, y, w, h, rx, fill, sw = 3, extra = "") { return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${fill}" stroke="${OL}" stroke-width="${sw}" ${extra}/>`; },
  wrap(w, h, body, defs = "") {
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${body}</svg>`;
  },
};

const VGEO = {

  bmx:  { gl: [72, 142], gr: [168, 142], fl: [96, 252], fr: [144, 252], hipY: 184, shY: 122, head: [120, 90], pedal: 1 },

function backVehicleUnder(v, r) {
  // Parts that sit *behind* the rider (handlebars, front end).
  const g = VGEO[v];
  const p = r.paint, p2 = r.paint2;
  let s = "";
  if (v === "mtb" || v === "bmx") {
    s += SV.poly([g.gl, [g.gl[0] + 22, g.gl[1] - 6], [120, g.gl[1] - 10], [g.gr[0] - 22, g.gr[1] - 6], g.gr], 6, "#2b2b33");
    s += SV.line(120, g.gl[1] - 8, 120, g.gl[1] + 26, 8, "#3a3a44");
    // front tire peeking below handlebars
    s += SV.rect(112, g.gl[1] + 34, 16, v === "bmx" ? 60 : 72, 8, "#1e1e22", 3);
  } else if (v === "dirt") {
    s += SV.path(`M78 ${g.gl[1] + 8} Q120 ${g.gl[1] - 26} 162 ${g.gl[1] + 8} L150 ${g.gl[1] + 30} Q120 ${g.gl[1] + 14} 90 ${g.gl[1] + 30}Z`, p, 3); // number board
    s += SV.poly([g.gl, [g.gl[0] + 30, g.gl[1] - 10], [g.gr[0] - 30, g.gr[1] - 10], g.gr], 7, "#2b2b33");
    s += SV.rect(106, g.gl[1] + 30, 28, 66, 12, "#1c1c20", 3);
  } else {
    s += SV.poly([g.gl, [70, g.gl[1] - 12], [170, g.gr[1] - 12], g.gr], 7, "#2b2b33");
    s += SV.path(`M58 ${g.gl[1] + 18} Q120 ${g.gl[1] - 12} 182 ${g.gl[1] + 18} L170 ${g.gl[1] + 44} L70 ${g.gl[1] + 44}Z`, p, 3);
    s += SV.rect(30, 150, 44, 50, 14, "#1b1b20", 3) + SV.rect(166, 150, 44, 50, 14, "#1b1b20", 3); // front tires peeking
  }
  return s;
}

function backVehicleOver(v, r, f) {
  // Parts closer to the camera than the rider (rear wheel, fender, plate, exhaust, rack).
  const p = r.paint, p2 = r.paint2;
  let s = "";
  const knobs = (x, y0, y1, w) => {
    let k = "";
    for (let y = y0 + 6; y < y1 - 4; y += 11) {
      const o = ((y / 11) | 0) % 2 ? 0 : 3;
      k += `<rect x="${x - 3 + o * 0}" y="${y}" width="5" height="6" rx="1.5" fill="#111"/>`;
      k += `<rect x="${x + w - 2 - o * 0}" y="${y + 4}" width="5" height="6" rx="1.5" fill="#111"/>`;
    }
    return k;
  };
  if (v === "mtb") {
    s += SV.poly([[104, 250], [114, 194], [120, 186]], 5, p) + SV.poly([[136, 250], [126, 194], [120, 186]], 5, p);
    s += SV.rect(107, 196, 26, 98, 13, "#24242a", 3) + knobs(105, 196, 294, 26);
    s += `<rect x="112" y="202" width="5" height="84" rx="2.5" fill="#4a4a55"/>`;
    s += SV.ell(120, 248, 9, 9, "#9aa0ac", 2.5) + SV.ell(136, 248, 6, 14, "#c9ced8", 2.5); // hub + cassette
    s += SV.path("M104 200 Q120 186 136 200 L134 210 Q120 198 106 210Z", p2, 2.5); // mud guard
    s += SV.path("M108 176 Q120 168 132 176 L128 186 L112 186Z", "#222", 2.5); // saddle
    s += SV.ell(120, 214, 5, 3, "#ff3b3b", 1.5); // tail reflector
  } else if (v === "bmx") {
    s += SV.poly([[106, 262], [116, 214], [120, 206]], 5, p) + SV.poly([[134, 262], [124, 214], [120, 206]], 5, p);
    s += SV.rect(109, 232, 22, 62, 11, "#25252b", 3) + knobs(107, 232, 294, 22);
    s += SV.rect(90, 258, 18, 10, 4, "#c9ced8", 2.5) + SV.rect(132, 258, 18, 10, 4, "#c9ced8", 2.5); // pegs
    s += SV.ell(120, 263, 7, 7, "#9aa0ac", 2.5);
    s += SV.path("M110 196 Q120 189 130 196 L127 206 L113 206Z", "#222", 2.5);
  } else if (v === "dirt") {
    s += SV.rect(100, 204, 40, 90, 18, "#1c1c21", 3) + knobs(98, 204, 294, 40);
    s += `<rect x="108" y="212" width="7" height="72" rx="3" fill="#3d3d47"/>`;
    // exhaust
    s += SV.path("M146 196 L166 204 L170 236 L156 240 L148 210Z", "#c7ccd6", 3);
    s += SV.ell(162, 237, 8, 6, "#3a3a40", 2.5);
    // fender + plate
    s += SV.path("M90 186 Q120 150 150 186 L146 212 Q120 196 94 212Z", p, 3);
    s += SV.path("M96 176 Q120 154 144 176 L140 194 Q120 184 100 194Z", "#f7f7f2", 2.5);
    s += `<text x="120" y="190" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="17" fill="${OL}">${r.num}</text>`;
    s += SV.rect(112, 197, 16, 7, 3, "#ff3030", 2);
    s += SV.path("M82 172 L96 160 L104 176 L90 190Z", p2, 2.5) + SV.path("M158 172 L144 160 L136 176 L150 190Z", p2, 2.5); // side panels
  } else {
    // ATV: two big rear tires, rack, tail light, fenders
    const tire = (x) => SV.rect(x, 214, 52, 80, 20, "#1b1b20", 3) + knobs(x - 2, 214, 294, 52) +
      `<rect x="${x + 10}" y="222" width="8" height="64" rx="4" fill="#3a3a44"/>`;
    s += tire(16) + tire(172);
    s += SV.rect(68, 238, 104, 14, 6, "#4a4a55", 3); // axle housing
    s += SV.path("M10 214 Q40 180 78 196 L82 226 L14 228Z", p, 3) + SV.path("M230 214 Q200 180 162 196 L158 226 L226 228Z", p, 3);
    s += SV.rect(70, 196, 100, 30, 8, p2, 3);
    s += SV.rect(80, 184, 80, 10, 3, "#8d929e", 2.5) + SV.line(84, 184, 84, 200, 3, "#8d929e") + SV.line(156, 184, 156, 200, 3, "#8d929e");
    s += SV.rect(100, 204, 40, 12, 4, "#ff2a2a", 2.5) + `<rect x="104" y="206" width="14" height="4" rx="2" fill="#ffd0d0"/>`;
    s += `<text x="120" y="238" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="11" fill="#fff">${r.num}</text>`;
  }
  return s;
}

/* ---------------- Hair / headwear (back view) ---------------- */
function backHead(r, hx, hy, k, f) {
  const R = 24 * k;
  const sk = r.skin, h = r.hair, h2 = r.hair2;
  const fl = f % 2 ? 1 : -1; // flutter
  let s = "";
  // neck & ears
  s += SV.rect(hx - 9 * k, hy + R * 0.55, 18 * k, 16 * k, 6, shade(sk, -0.12), 2.5);
  s += SV.ell(hx - R + 1, hy + 3, 5 * k, 8 * k, sk, 2.5) + SV.ell(hx + R - 1, hy + 3, 5 * k, 8 * k, sk, 2.5);
  switch (r.id) {
    case "kaito": {
      // spiky navy hair swept back by wind + red goggle strap
      let sp = "";
      const spikes = [[-26, -6, -46, 6], [-22, -18, -40, -16], [-12, -26, -24, -40], [2, -28, 0, -48], [14, -24, 26, -42], [22, -14, 44, -18], [26, -2, 46, 10]];
      sp += `M${hx - 24 * k} ${hy + 12 * k}`;
      spikes.forEach(([ax, ay, bx, by], i) => {
        sp += ` L${hx + bx * k + (i % 2 ? fl * 2 : 0)} ${hy + by * k} L${hx + ax * k} ${hy + ay * k}`;
      });
      sp += ` L${hx + 24 * k} ${hy + 12 * k} Q${hx} ${hy + 22 * k} ${hx - 24 * k} ${hy + 12 * k}Z`;
      s += SV.path(sp, h, 3);
      s += `<path d="M${hx - 10 * k} ${hy - 16 * k} L${hx - 18 * k} ${hy - 32 * k} M${hx + 8 * k} ${hy - 18 * k} L${hx + 16 * k} ${hy - 34 * k} M${hx - 2} ${hy - 6 * k} L${hx - 4} ${hy - 30 * k}" stroke="${h2}" stroke-width="3" stroke-linecap="round"/>`;
      s += SV.rect(hx - 25 * k, hy - 2 * k, 50 * k, 8 * k, 3, "#e2433b", 2.5);
      s += SV.rect(hx - 6 * k, hy - 4 * k, 12 * k, 12 * k, 3, "#2a2a30", 2);
      break;
    }
    case "priya": {
      // half-shell helmet + flying braid
      s += SV.path(`M${hx - 26 * k} ${hy + 8 * k} Q${hx - 26 * k} ${hy + 22 * k} ${hx} ${hy + 22 * k} Q${hx + 26 * k} ${hy + 22 * k} ${hx + 26 * k} ${hy + 8 * k}Z`, h, 3);
      const bx = hx + 6 * k * fl;
      s += SV.poly([[hx, hy + 18 * k], [hx + 4 * k, hy + 40 * k], [bx + 12 * k, hy + 62 * k], [bx + 26 * k, hy + 80 * k]], 13 * k, h);
      for (let i = 0; i < 4; i++) {
        const t = i / 4;
        const px = lerp(hx + 2 * k, bx + 24 * k, t), py = lerp(hy + 24 * k, hy + 78 * k, t);
        s += `<path d="M${px - 6 * k} ${py} Q${px} ${py + 6 * k} ${px + 6 * k} ${py}" stroke="${h2}" stroke-width="2.4" fill="none"/>`;
      }
      s += SV.rect(bx + 20 * k, hy + 74 * k, 10 * k, 7 * k, 2, "#ffd23f", 2);
      s += SV.path(`M${hx - 28 * k} ${hy + 8 * k} Q${hx - 28 * k} ${hy - 30 * k} ${hx} ${hy - 30 * k} Q${hx + 28 * k} ${hy - 30 * k} ${hx + 28 * k} ${hy + 8 * k} Z`, r.main, 3);
      s += `<path d="M${hx - 6 * k} ${hy - 29 * k} L${hx - 6 * k} ${hy + 6 * k} M${hx + 6 * k} ${hy - 29 * k} L${hx + 6 * k} ${hy + 6 * k}" stroke="#fff" stroke-width="${4 * k}"/>`;
      s += `<path d="M${hx - 18 * k} ${hy - 20 * k} Q${hx - 10 * k} ${hy - 26 * k} ${hx - 2 * k} ${hy - 27 * k}" stroke="#fff" stroke-opacity=".55" stroke-width="3" fill="none"/>`;
      break;
    }
    case "bruno": {
      // knit beanie with pom
      s += SV.path(`M${hx - 25 * k} ${hy + 12 * k} Q${hx} ${hy + 26 * k} ${hx + 25 * k} ${hy + 12 * k} L${hx + 25 * k} ${hy + 2 * k} L${hx - 25 * k} ${hy + 2 * k}Z`, h, 3);
      s += SV.path(`M${hx - 27 * k} ${hy + 6 * k} Q${hx - 28 * k} ${hy - 32 * k} ${hx} ${hy - 32 * k} Q${hx + 28 * k} ${hy - 32 * k} ${hx + 27 * k} ${hy + 6 * k}Z`, r.alt, 3);
      s += SV.rect(hx - 28 * k, hy - 2 * k, 56 * k, 12 * k, 5, shade(r.alt, -0.18), 3);
      for (let i = -3; i <= 3; i++) s += `<path d="M${hx + i * 7 * k} ${hy - 26 * k + Math.abs(i) * 2} L${hx + i * 7 * k} ${hy - 4 * k}" stroke="${shade(r.alt, -0.25)}" stroke-width="2"/>`;
      s += SV.circ(hx + fl * 2, hy - 36 * k, 9 * k, "#fff4e0", 2.5);
      break;
    }
    case "yuki": {
      // pigtails streaming + bunny-ear helmet
      const pt = (dir) => SV.path(`M${hx + dir * 18 * k} ${hy + 8 * k} Q${hx + dir * 40 * k} ${hy + 10 * k + fl * 3} ${hx + dir * 54 * k} ${hy + 34 * k} Q${hx + dir * 44 * k} ${hy + 30 * k} ${hx + dir * 36 * k} ${hy + 36 * k} Q${hx + dir * 34 * k} ${hy + 20 * k} ${hx + dir * 16 * k} ${hy + 18 * k}Z`, h, 3) +
        SV.circ(hx + dir * 20 * k, hy + 12 * k, 5 * k, "#ff79b0", 2);
      s += pt(-1) + pt(1);
      const ear = (dir) => SV.path(`M${hx + dir * 10 * k} ${hy - 22 * k} Q${hx + dir * 22 * k} ${hy - 64 * k} ${hx + dir * (16 + fl) * k} ${hy - 66 * k} Q${hx + dir * 4 * k} ${hy - 58 * k} ${hx + dir * 2 * k} ${hy - 24 * k}Z`, "#fff", 3) +
        `<path d="M${hx + dir * 8 * k} ${hy - 28 * k} Q${hx + dir * 15 * k} ${hy - 54 * k} ${hx + dir * 14 * k} ${hy - 58 * k}" stroke="#ffb3d1" stroke-width="${4 * k}" stroke-linecap="round" fill="none"/>`;
      s += ear(-1) + ear(1);
      s += SV.path(`M${hx - 27 * k} ${hy + 10 * k} Q${hx - 28 * k} ${hy - 30 * k} ${hx} ${hy - 30 * k} Q${hx + 28 * k} ${hy - 30 * k} ${hx + 27 * k} ${hy + 10 * k} Q${hx} ${hy + 18 * k} ${hx - 27 * k} ${hy + 10 * k}Z`, "#ff79b0", 3);
      s += `<path d="M${hx - 14 * k} ${hy - 18 * k} Q${hx} ${hy - 26 * k} ${hx + 14 * k} ${hy - 18 * k}" stroke="#fff" stroke-width="${5 * k}" stroke-linecap="round" fill="none"/>`;
      s += SV.path(`M${hx - 6 * k} ${hy - 4 * k} l${4 * k} ${-4 * k} l${4 * k} ${4 * k} l${4 * k} ${-4 * k} l${4 * k} ${4 * k}`, "none", 2.4);
      break;
    }
    case "zara": {
      // teal head wrap with a long fluttering scarf tail and gold coins
      const tail = `M${hx + 10 * k} ${hy + 10 * k} Q${hx + 40 * k} ${hy + 18 * k + fl * 6} ${hx + 70 * k} ${hy + 8 * k - fl * 4} Q${hx + 90 * k} ${hy + 2 * k} ${hx + 104 * k} ${hy + 14 * k + fl * 6} L${hx + 96 * k} ${hy + 24 * k} Q${hx + 70 * k} ${hy + 22 * k} ${hx + 42 * k} ${hy + 34 * k + fl * 3} Q${hx + 20 * k} ${hy + 30 * k} ${hx + 2 * k} ${hy + 22 * k}Z`;
      s += SV.path(tail, shade(r.main, -0.1), 3);
      s += `<path d="M${hx + 30 * k} ${hy + 22 * k + fl * 2} Q${hx + 60 * k} ${hy + 14 * k} ${hx + 92 * k} ${hy + 16 * k}" stroke="${r.alt}" stroke-width="2.5" fill="none"/>`;
      s += SV.path(`M${hx - 27 * k} ${hy + 12 * k} Q${hx - 30 * k} ${hy - 30 * k} ${hx} ${hy - 30 * k} Q${hx + 30 * k} ${hy - 30 * k} ${hx + 27 * k} ${hy + 12 * k} Q${hx} ${hy + 24 * k} ${hx - 27 * k} ${hy + 12 * k}Z`, r.main, 3);
      for (let i = 0; i < 4; i++) s += `<path d="M${hx - 26 * k} ${hy - 12 * k + i * 8 * k} Q${hx} ${hy - 22 * k + i * 10 * k} ${hx + 26 * k} ${hy - 12 * k + i * 8 * k}" stroke="${shade(r.main, -0.22)}" stroke-width="2" fill="none"/>`;
      for (let i = -2; i <= 2; i++) s += SV.circ(hx + i * 10 * k, hy + 14 * k + Math.abs(i) * -2, 3.4 * k, "#f5c542", 1.5);
      break;
    }
    case "rex": {
      // shaved sides, tall green mohawk
      s += SV.path(`M${hx - 24 * k} ${hy + 6 * k} Q${hx - 26 * k} ${hy - 24 * k} ${hx} ${hy - 25 * k} Q${hx + 26 * k} ${hy - 24 * k} ${hx + 24 * k} ${hy + 6 * k} Q${hx} ${hy + 22 * k} ${hx - 24 * k} ${hy + 6 * k}Z`, shade(r.skin, -0.06), 3);
      s += `<path d="M${hx - 18 * k} ${hy - 10 * k} Q${hx} ${hy - 4 * k} ${hx + 18 * k} ${hy - 10 * k}" stroke="${shade(r.skin, -0.25)}" stroke-width="2" stroke-dasharray="2 4" fill="none"/>`;
      let m = `M${hx - 8 * k} ${hy + 14 * k}`;
      const tips = [[-6, 2, -26 + fl], [-6, -14, -50], [-4, -24, -66 + fl * 2], [4, -24, -66 - fl], [6, -14, -50], [6, 2, -26]];
      tips.forEach(([dx, base, tip]) => { m += ` L${hx + dx * 3 * k} ${hy + tip * k} L${hx + dx * k} ${hy + base * k}`; });
      m += ` L${hx + 8 * k} ${hy + 14 * k}Z`;
      s += SV.path(m, h, 3);
      s += `<path d="M${hx - 2 * k} ${hy + 8 * k} L${hx - 6 * k} ${hy - 50 * k}" stroke="${r.hair2}" stroke-width="3" fill="none"/>`;
      s += SV.circ(hx - R + 1, hy + 9 * k, 2.6, "#d9dde6", 1.5) + SV.circ(hx + R - 1, hy + 9 * k, 2.6, "#d9dde6", 1.5);
      break;
    }
  }
  return s;
}

/* ---------------- Full back-view rider sprite ---------------- */
// pose: ride | punchL | punchR | kickL | kickR | hurt | nohand | super | cancan ; f = animation frame 0/1
function riderBackSVG(r, v, pose, f) {
  const g = VGEO[v];
  const k = r.id === "bruno" ? 1.16 : r.id === "yuki" ? 0.88 : 1.0;   // body build
  const lw = 15 * k;                                                // limb thickness
  const shW = 40 * k, waist = 21 * k;
  let shY = g.shY + (f ? 2 : 0), hipY = g.hipY;
  let head = [g.head[0], g.head[1] + (f ? 2 : 0)];
  let gl = g.gl.slice(), gr = g.gr.slice(), fl = g.fl.slice(), fr = g.fr.slice();
  if (g.pedal) { fl[1] += f ? -8 : 6; fr[1] += f ? 6 : -8; }
  const shL = [120 - shW + 6, shY + 6], shR = [120 + shW - 6, shY + 6];
  let handL = gl, handR = gr, elbowL = [gl[0] + 4, (shL[1] + gl[1]) / 2 + 14], elbowR = [gr[0] - 4, (shR[1] + gr[1]) / 2 + 14];
  let kneeL = [fl[0] - 8, (hipY + fl[1]) / 2 + 2], kneeR = [fr[0] + 8, (hipY + fr[1]) / 2 + 2];
  let footL = fl, footR = fr, tilt = 0, body = "";
  const hipL = [120 - waist + 6, hipY], hipR = [120 + waist - 6, hipY];
  switch (pose) {
    case "punchL": handL = [12, shY + 4]; elbowL = [52, shY + 10]; tilt = -6; break;
    case "punchR": handR = [228, shY + 4]; elbowR = [188, shY + 10]; tilt = 6; break;
    case "kickL": footL = [10, hipY + 26]; kneeL = [54, hipY + 10]; tilt = 5; break;
    case "kickR": footR = [230, hipY + 26]; kneeR = [186, hipY + 10]; tilt = -5; break;
    case "cancan": footL = [196, hipY + 40]; kneeL = [150, hipY + 6]; tilt = 4; break;
    case "nohand": handL = [70, shY - 72]; elbowL = [74, shY - 26]; handR = [170, shY - 72]; elbowR = [166, shY - 26]; break;
    case "hurt": handL = [44, shY - 40]; elbowL = [56, shY - 8]; handR = [204, shY - 20]; elbowR = [186, shY + 6]; tilt = 10; footR = [196, hipY + 46]; kneeR = [170, hipY + 20]; break;
    case "super":
      // legs fly up behind the rider toward the camera
      footL = [84, 26]; kneeL = [98, 92]; footR = [156, 26]; kneeR = [142, 92];
      shY += 18; head = [120, g.head[1] + 24]; break;
  }
  const sk = r.skin, glove = "#2a2730", boot = r.id === "rex" ? "#141318" : shade(r.dark, 0.1);
  const isMoto = v === "dirt" || v === "atv";

  // arms (behind torso)
  const arm = (sh, el, ha) => SV.poly([sh, el, ha], lw, r.main) + SV.circ(ha[0], ha[1], 8.5 * k, glove, 2.5);
  // legs
  const legCol = isMoto ? r.dark : (r.id === "priya" ? "#2b2b3a" : r.dark);
  const leg = (hp, kn, ft, dir) => SV.poly([hp, kn, ft], lw + 3, legCol) +
    `<path d="M${kn[0]} ${kn[1]}" />` + SV.circ(kn[0], kn[1], (isMoto ? 9 : 7) * k, isMoto ? "#d9dde6" : shade(legCol, 0.15), 2.5) +
    SV.path(`M${ft[0] - 12 * dir} ${ft[1] - 7} Q${ft[0]} ${ft[1] - 14} ${ft[0] + 12 * dir} ${ft[1] - 4} L${ft[0] + 12 * dir} ${ft[1] + 5} L${ft[0] - 12 * dir} ${ft[1] + 5}Z`, boot, 2.5);

  body += backVehicleUnder(v, r);
  body += arm(shL, elbowL, handL) + arm(shR, elbowR, handR);
  body += leg(hipL, kneeL, footL, -1) + leg(hipR, kneeR, footR, 1);
  // shorts / pants seat
  body += SV.path(`M${120 - waist - 4} ${hipY - 18} Q120 ${hipY - 26} ${120 + waist + 4} ${hipY - 18} L${120 + waist + 2} ${hipY + 10} Q120 ${hipY + 20} ${120 - waist - 2} ${hipY + 10}Z`, legCol, 3);
  // torso (jersey) — trapezoid with rounded shoulders
  const tY = shY, bY = hipY - 14;
  const torso = `M${120 - shW} ${tY + 14} Q${120 - shW} ${tY - 2} ${120 - shW + 14} ${tY - 4} L${120 + shW - 14} ${tY - 4} Q${120 + shW} ${tY - 2} ${120 + shW} ${tY + 14} L${120 + waist + 4} ${bY} Q120 ${bY + 6} ${120 - waist - 4} ${bY}Z`;
  body += SV.path(torso, r.main, 3);
  // side panels / stripes
  body += `<path d="M${120 - shW + 6} ${tY + 10} L${120 - waist} ${bY - 2}" stroke="${r.alt}" stroke-width="${7 * k}" stroke-linecap="round"/>`;
  body += `<path d="M${120 + shW - 6} ${tY + 10} L${120 + waist} ${bY - 2}" stroke="${r.alt}" stroke-width="${7 * k}" stroke-linecap="round"/>`;
  if (r.id === "rex") {
    for (let i = 0; i < 5; i++) body += SV.circ(120 - shW + 10 + i * (shW * 2 - 20) / 4, tY + 4, 3, "#d9dde6", 1.5);
    body += `<path d="M${120 - 22} ${tY + 20} l10 10 l10 -10 l10 10 l10 -10" stroke="${r.alt}" stroke-width="3" fill="none"/>`;
  }
  if (r.id === "bruno") {
    body += SV.path(`M${120 - shW - 6} ${tY + 16} Q${120 - shW - 4} ${tY - 8} ${120 - shW + 22} ${tY - 6} L${120 - shW + 20} ${tY + 14}Z`, "#8a8f99", 3);
    body += SV.path(`M${120 + shW + 6} ${tY + 16} Q${120 + shW + 4} ${tY - 8} ${120 + shW - 22} ${tY - 6} L${120 + shW - 20} ${tY + 14}Z`, "#8a8f99", 3);
  }
  // name + number on the back
  const midY = (tY + bY) / 2;
  if (v === "mtb") {
    body += SV.rect(120 - 24 * k, tY + 4, 48 * k, 46 * k, 12, "#2c2c34", 3);
    body += `<path d="M${120 - 16 * k} ${tY + 4} L${120 - 20 * k} ${tY - 6} M${120 + 16 * k} ${tY + 4} L${120 + 20 * k} ${tY - 6}" stroke="#2c2c34" stroke-width="6"/>`;
    body += SV.rect(120 - 14 * k, tY + 14, 28 * k, 8, 3, r.alt, 2);
    body += `<text x="120" y="${bY - 4}" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="13" fill="${r.alt}" stroke="${OL}" stroke-width="0.6">${r.num}</text>`;
  } else {
    body += `<text x="120" y="${tY + 14}" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="9" fill="${r.alt}" letter-spacing="1">${r.name.toUpperCase()}</text>`;
    body += `<text x="120" y="${midY + 14}" text-anchor="middle" font-family="${FONT}" font-weight="900" font-size="${26 * k}" fill="${r.alt}" stroke="${OL}" stroke-width="1.2">${r.num}</text>`;
  }
  // head + hair
  body += backHead(r, head[0], head[1], k, f);
  body += backVehicleOver(v, r, f);
  const rot = tilt ? ` transform="rotate(${tilt} 120 290)"` : "";
  return SV.wrap(240, 300, `<g${rot}>${body}</g>`);
}

/* ---------------- Front-view anime portraits (menus) ---------------- */
function animeEyes(cx, cy, r, style) {
  // style: sharp | round | small | cat
  const ec = r.eye;
  const one = (x, dir) => {
    const w = style === "small" ? 15 : style === "round" ? 19 : 18;
    const h = style === "small" ? 12 : style === "round" ? 23 : style === "cat" ? 17 : 15;
    const slant = style === "sharp" || style === "cat" ? 6 : style === "small" ? 3 : 0;
    let s = "";
    s += `<path d="M${x - w * dir} ${cy + 2} Q${x} ${cy - h - 2} ${x + w * dir} ${cy - slant} Q${x + w * 0.4 * dir} ${cy + h * 0.9} ${x - w * dir} ${cy + 2}Z" fill="#fff"/>`;
    s += `<ellipse cx="${x + 1 * dir}" cy="${cy - 1}" rx="${w * 0.58}" ry="${h * 0.72}" fill="url(#iris-${r.id})"/>`;
    s += `<ellipse cx="${x + 1 * dir}" cy="${cy}" rx="${w * 0.26}" ry="${h * 0.36}" fill="${OL}"/>`;
    s += `<ellipse cx="${x - w * 0.22 * dir + 4}" cy="${cy - h * 0.3}" rx="${w * 0.2}" ry="${h * 0.17}" fill="#fff"/>`;
    s += `<circle cx="${x + w * 0.25 * dir}" cy="${cy + h * 0.25}" r="${w * 0.08 + 1}" fill="#fff" opacity=".85"/>`;
    s += `<path d="M${x - w * dir - 3 * dir} ${cy + 4} Q${x} ${cy - h - 6} ${x + w * dir + 4 * dir} ${cy - slant - 3}" stroke="${OL}" stroke-width="${style === "round" ? 4.5 : 5}" fill="none" stroke-linecap="round"/>`;
    if (style === "round" || style === "cat") s += `<path d="M${x + w * dir + 2 * dir} ${cy - slant - 3} l${6 * dir} -4" stroke="${OL}" stroke-width="3.5" stroke-linecap="round"/>`;
    s += `<path d="M${x - w * 0.6 * dir} ${cy + h * 0.8} Q${x + 2 * dir} ${cy + h * 0.95} ${x + w * 0.7 * dir} ${cy + h * 0.55}" stroke="${shade(r.skin, -0.45)}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    return s;
  };
  return one(cx - 30, -1) + one(cx + 30, 1);
}

      front += SV.path(`M${cx - 60} ${cy - 22} L${cx - 54} ${cy - 70} L${cx - 30} ${cy - 40} L${cx - 26} ${cy - 84} L${cx - 2} ${cy - 30} L${cx + 6} ${cy - 86} L${cx + 26} ${cy - 36} L${cx + 40} ${cy - 76} L${cx + 52} ${cy - 30} L${cx + 62} ${cy - 50} L${cx + 62} ${cy - 92} Q${cx} ${cy - 120} ${cx - 62} ${cy - 92}Z`, HG, 3.5);

/* ---------------- Side-view vehicles (garage) ---------------- */
function vehicleSideSVG(v, r) {
  const p = r ? r.paint : "#e2433b", p2 = r ? r.paint2 : "#1e1e28";
  let s = "";
  const wheel = (x, y, R, fat) => {
    let w = SV.circ(x, y, R, "#1b1b20", 3) + `<circle cx="${x}" cy="${y}" r="${R - fat}" fill="#d0d4dc" stroke="${OL}" stroke-width="2"/>`;
    for (let i = 0; i < 12; i++) { const a = (i / 12) * TAU; w += `<path d="M${x} ${y} L${(x + Math.cos(a) * (R - fat)).toFixed(1)} ${(y + Math.sin(a) * (R - fat)).toFixed(1)}" stroke="#7d828c" stroke-width="1.5"/>`; }
    for (let i = 0; i < 18; i++) { const a = (i / 18) * TAU; w += `<rect x="${(x + Math.cos(a) * R - 3).toFixed(1)}" y="${(y + Math.sin(a) * R - 3).toFixed(1)}" width="6" height="6" rx="1.5" fill="#111"/>`; }
    return w + SV.circ(x, y, 6, "#7d828c", 2);
  };
  if (v === "mtb" || v === "bmx") {
    const R = v === "bmx" ? 40 : 52, y = 150, x1 = v === "bmx" ? 80 : 70, x2 = v === "bmx" ? 220 : 236;
    s += wheel(x1, y, R, 7) + wheel(x2, y, R, 7);
    const bb = [150, y - 6], seat = [v === "bmx" ? 120 : 126, v === "bmx" ? 88 : 70], head = [v === "bmx" ? 196 : 206, v === "bmx" ? 82 : 66];
    s += SV.poly([[x1, y], bb, seat, [x1, y]], 9, p) + SV.poly([seat, head, bb], 10, p);
    s += SV.poly([head, [x2, y]], 8, "#c9ced8");                         // fork
    if (v === "mtb") s += SV.rect(118, 92, 34, 12, 5, "#f0c419", 2.5);  // rear shock
    s += SV.line(seat[0], seat[1], seat[0] - 8, seat[1] - 18, 6, "#2b2b33") + SV.path(`M${seat[0] - 30} ${seat[1] - 22} L${seat[0] + 14} ${seat[1] - 22} L${seat[0] + 6} ${seat[1] - 14} L${seat[0] - 26} ${seat[1] - 14}Z`, "#222", 2.5);
    s += SV.poly([head, [head[0] - 6, head[1] - 22], [head[0] - 22, head[1] - 26]], 6, "#2b2b33");
    s += SV.circ(bb[0], bb[1], 12, "#9aa0ac", 2.5) + SV.line(bb[0], bb[1], bb[0] + 16, bb[1] + 18, 5, "#2b2b33");
  } else if (v === "dirt") {
    const y = 150;
    s += wheel(66, y, 50, 12) + wheel(240, y, 54, 12);
    s += SV.path("M60 96 L120 86 L150 120 L200 120 L238 60 L252 66 L222 130 L150 146 L110 140 L70 110Z", p, 3);
    s += SV.path("M84 86 Q110 70 170 78 L176 92 L92 100Z", "#1e1e24", 3); // seat
    s += SV.path("M120 104 L176 104 L182 134 L126 138Z", "#9aa0ac", 3);  // engine
    for (let i = 0; i < 4; i++) s += `<path d="M${128 + i * 13} 108 L${130 + i * 13} 134" stroke="#5d626c" stroke-width="3"/>`;
    s += SV.path("M118 136 Q80 150 54 118 L60 110 Q84 132 116 124Z", "#c7ccd6", 3); // exhaust
    s += SV.poly([[230, 58], [240, 150]], 9, "#c9ced8") + SV.poly([[222, 46], [244, 40], [252, 30]], 6, "#2b2b33");
    s += SV.path("M196 64 Q238 44 268 70 L256 80 Q230 64 202 76Z", p2, 3); // front fender
    s += `<text x="168" y="102" font-family="${FONT}" font-weight="900" font-size="16" fill="#fff" stroke="${OL}" stroke-width=".8">${r ? r.num : 1}</text>`;
  } else {
    const y = 156;
    s += wheel(70, y, 44, 16) + wheel(236, y, 44, 16);
    s += SV.path("M30 120 Q60 70 110 96 L196 96 Q240 70 276 120 L270 132 L30 132Z", p, 3);
    s += SV.path("M110 96 L196 96 L188 70 L118 70Z", "#1e1e24", 3);
    s += SV.rect(120, 108, 70, 34, 6, "#7d828c", 3);
    s += SV.rect(16, 92, 70, 10, 4, "#8d929e", 2.5) + SV.rect(222, 92, 64, 10, 4, "#8d929e", 2.5);
    s += SV.poly([[200, 72], [214, 46], [236, 42]], 7, "#2b2b33");
    s += SV.rect(270, 108, 14, 12, 4, "#fff6c2", 2.5);
    s += SV.path("M118 132 L190 132 L182 146 L126 146Z", p2, 2.5);
  }
  return SV.wrap(310, 210, s);
}

/* ---------------- Sprite cache ---------------- */
const RIDER_POSES = ["ride0", "ride1", "punchL", "punchR", "kickL", "kickR", "hurt", "nohand", "super", "cancan"];
const SPRITE_W = 240, SPRITE_H = 300;
const riderSpriteCache = {};
async function buildRiderSprites(riderId, vehId) {
  const key = riderId + ":" + vehId;
  if (riderSpriteCache[key]) return riderSpriteCache[key];
  const r = RIDERS.find((x) => x.id === riderId);
  const out = {};
  await Promise.all(RIDER_POSES.map(async (pose) => {
    const p = pose.startsWith("ride") ? "ride" : pose;
    const f = pose === "ride1" ? 1 : 0;
    out[pose] = await svgToCanvas(riderBackSVG(r, vehId, p, f), SPRITE_W, SPRITE_H);
  }));
  riderSpriteCache[key] = out;
  return out;
}

/* World art: scenery sprites per biome, track objects, projectiles and parallax backgrounds. */

const W = {}; // generators: id -> {w,h,svg(), ww (world width), solid, glow}

function conifer(w, h, col, snow, trunk = "#5a3a22", layers = 5) {
  let s = SV.rect(w / 2 - w * 0.06, h * 0.78, w * 0.12, h * 0.22, 3, trunk, 3);
  for (let i = 0; i < layers; i++) {
    const t = i / layers;
    const y0 = h * (0.04 + t * 0.66), y1 = y0 + h * 0.3;
    const hw = w * (0.18 + t * 0.32);
    s += SV.path(`M${w / 2} ${y0} L${w / 2 + hw} ${y1} Q${w / 2} ${y1 - h * 0.05} ${w / 2 - hw} ${y1}Z`, shade(col, -t * 0.15), 3);
    if (snow) s += `<path d="M${w / 2} ${y0 + 3} L${w / 2 + hw * 0.55} ${y0 + h * 0.15} Q${w / 2} ${y0 + h * 0.11} ${w / 2 - hw * 0.55} ${y0 + h * 0.15}Z" fill="${snow}"/>`;
  }
  return s;
}
function rock(w, h, col, top) {
  let s = SV.path(`M${w * 0.06} ${h * 0.96} L${w * 0.12} ${h * 0.45} L${w * 0.34} ${h * 0.12} L${w * 0.66} ${h * 0.08} L${w * 0.9} ${h * 0.38} L${w * 0.96} ${h * 0.96}Z`, col, 3);

  s += `<path d="M${w * 0.44} ${h * 0.6} L${w * 0.9} ${h * 0.38} L${w * 0.96} ${h * 0.96} L${w * 0.5} ${h * 0.96}Z" fill="${shade(col, -0.2)}" opacity=".6"/>`;
  if (top) s += `<path d="M${w * 0.14} ${h * 0.42} L${w * 0.34} ${h * 0.14} L${w * 0.66} ${h * 0.1} L${w * 0.88} ${h * 0.36} Q${w * 0.5} ${h * 0.3} ${w * 0.14} ${h * 0.42}Z" fill="${top}"/>`;
  return s;
}

/* ---- parallax backgrounds (2048 wide, tileable) ---- */
function bgSVG(biome, layer) {
  const Wd = 2048, H = layer === "far" ? 420 : 300;
  const R = rng(biome.id.length * 97 + (layer === "far" ? 1 : 2));
  const ridge = (base, amp, step, jag) => {
    let d = `M0 ${H}`, y = base;
    const pts = [];
    for (let x = 0; x <= Wd; x += step) {
      y = base - amp * (0.4 + 0.6 * Math.abs(Math.sin(x * 0.0021 + R() * 0.2) * Math.cos(x * 0.0013))) - (jag ? R() * jag : 0);
      pts.push([x, y]);
    }
    pts[pts.length - 1][1] = pts[0][1]; // tileable
    pts.forEach(([x, y]) => (d += ` L${x} ${y.toFixed(1)}`));
    return { d: d + ` L${Wd} ${H}Z`, pts };
  };
  let s = "";
  const id = biome.id;
  if (layer === "far") {
    const cols = { forest: ["#6f9fb4", "#5d8aa0"], desert: ["#d98b5a", "#c4703f"], glacier: ["#c9dcf2", "#a9c4e6"], ghats: ["#6f9a8a", "#5b8574"], volcano: ["#3b1f26", "#2a161c"], tundra: ["#1e3354", "#162843"] }[id];
    const a = ridge(H - 120, 230, 64, id === "glacier" || id === "volcano" ? 50 : 18);
    s += `<path d="${a.d}" fill="${cols[0]}"/>`;
    if (id === "glacier" || id === "tundra") {
      // snow caps on peaks
      a.pts.forEach(([x, y], i) => { if (y < H - 260 && i % 1 === 0) s += `<path d="M${x - 40} ${y + 50} L${x} ${y} L${x + 40} ${y + 50} Q${x} ${y + 34} ${x - 40} ${y + 50}Z" fill="#fff" opacity=".9"/>`; });
    }
    if (id === "desert") {
      for (let i = 0; i < 5; i++) { const x = 150 + i * 420, w = 160 + R() * 120, h = 120 + R() * 90; s += `<path d="M${x} ${H} L${x + 20} ${H - h} L${x + w - 20} ${H - h} L${x + w} ${H}Z" fill="#b8552c"/><path d="M${x + 20} ${H - h} L${x + w - 20} ${H - h} L${x + w - 14} ${H - h + 14} L${x + 26} ${H - h + 14}Z" fill="#e8925a"/>`; }
    }
    if (id === "volcano") {
      s += `<path d="M700 ${H} L940 120 L1000 110 L1060 118 L1300 ${H}Z" fill="#1f1216"/><path d="M940 120 L1000 110 L1060 118 L1040 140 L960 140Z" fill="#ff6a2b"/><ellipse cx="1000" cy="116" rx="60" ry="12" fill="#ffb36b" opacity=".8"/>`;
      s += `<path d="M990 110 Q940 40 1010 0 L1060 0 Q1000 50 1030 110Z" fill="#3b2a2e" opacity=".75"/>`;
      s += `<path d="M960 140 Q930 220 900 ${H}" stroke="#ff5a1f" stroke-width="10" fill="none" opacity=".8"/>`;
    }
    if (id === "ghats") {
      for (let i = 0; i < 4; i++) { const x = 200 + i * 520; s += `<path d="M${x} ${H - 200} L${x + 8} ${H}" stroke="#e9f6ff" stroke-width="10" opacity=".75"/>`; }
    }
    const b = ridge(H - 40, 120, 48, 10);
    s += `<path d="${b.d}" fill="${cols[1]}"/>`;
  } else {
    const cols = { forest: "#2f5d36", desert: "#d9a05e", glacier: "#e6eefa", ghats: "#2f6e3e", volcano: "#1c1414", tundra: "#0f1f33" }[id];
    const a = ridge(H - 40, 70, 40, 6);
    s += `<path d="${a.d}" fill="${cols}"/>`;
    if (id === "forest" || id === "glacier" || id === "tundra" || id === "ghats") {
      const tc = { forest: "#244a2a", glacier: "#2c5248", tundra: "#0a1622", ghats: "#245a32" }[id];
      for (let x = 0; x < Wd; x += 26 + R() * 30) {
        const i = Math.min(a.pts.length - 1, Math.round(x / 40));
        const y = a.pts[i][1] + 10, h = 50 + R() * 60;
        if (id === "ghats" && R() < 0.5) { s += `<path d="M${x} ${y} L${x + 4} ${y - h}" stroke="#4a3a24" stroke-width="5"/><path d="M${x - 24} ${y - h + 10} Q${x + 4} ${y - h - 20} ${x + 30} ${y - h + 12}" stroke="${tc}" stroke-width="14" fill="none"/>`; continue; }
        s += `<path d="M${x - h * 0.22} ${y} L${x} ${y - h} L${x + h * 0.22} ${y}Z" fill="${tc}"/>`;
        if (id === "glacier" || id === "tundra") s += `<path d="M${x - h * 0.1} ${y - h * 0.55} L${x} ${y - h} L${x + h * 0.1} ${y - h * 0.55}Z" fill="#fff" opacity=".85"/>`;
      }
    }
    if (id === "desert") for (let i = 0; i < 6; i++) { const x = R() * Wd; s += `<path d="M${x - 200} ${H} Q${x} ${H - 90} ${x + 260} ${H}Z" fill="#e8b878"/>`; }

  }
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}">${s}</svg>`;
}

/* ---- build all world sprites for one biome (async) ---- */
const worldCache = {};
async function buildWorldSprites(biome) {
  if (worldCache[biome.id]) return worldCache[biome.id];
  const set = BIOME_SCENERY[biome.id];
  const ids = new Set(["ramp", "crate", "repair", "arch", "startgate", "crowd", "banner", "log", "vent"]);
  set.near.forEach(([id]) => ids.add(id));
  set.far.forEach((id) => ids.add(id));
  set.obstacles.forEach((id) => ids.add(id));
  set.special.forEach((id) => ids.add(id));
  const out = { sprites: {}, items: {} };
  await Promise.all([...ids].map(async (id) => {
    const d = W[id];
    const c = await svgToCanvas(SV.wrap(d.w, d.h, d.svg()), d.w, d.h);
    out.sprites[id] = { c, ww: d.ww, wh: d.ww * d.h / d.w, solid: d.solid, obstacle: d.obstacle, glow: d.glow, id };
  }));
  await Promise.all(Object.keys(ITEMS).map(async (id) => { out.items[id] = await svgToCanvas(itemSVG(id), 64, 64); }));
  out.far = await svgToCanvas(bgSVG(biome, "far"), 2048, 420);
  out.near = await svgToCanvas(bgSVG(biome, "near"), 2048, 300);
  worldCache[biome.id] = out;
  return out;
}

// ===== audio.js =====
/* Synthesized audio: engine/wind, SFX and a procedural soundtrack per biome. No audio files. */

const SFX = (() => {
  let ac = null, master, musicBus, sfxBus, noiseBuf;
  let musicOn = true, sfxOn = true, musicVol = 0.45, sfxVol = 0.8;
  let unlocked = false;
  const engines = [];

  function init() {
    if (ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
    const comp = ac.createDynamicsCompressor(); comp.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = musicOn ? musicVol : 0; musicBus.connect(comp);
    sfxBus = ac.createGain(); sfxBus.gain.value = sfxOn ? sfxVol : 0; sfxBus.connect(comp);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  function unlock() {
    init();
    if (!ac) return;
    if (ac.state === "suspended") ac.resume();
    if (!unlocked) {
      // iOS: play a silent buffer inside the gesture
      const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
      s.buffer = b; s.connect(ac.destination); s.start(0);
      unlocked = true;
    }
  }
  const T = () => ac.currentTime;

  function tone(freq, dur, type = "square", vol = 0.2, bus = sfxBus, when = 0, slide = 0, attack = 0.005) {
    if (!ac) return;

    o.type = type; o.frequency.setValueAtTime(freq, t);

    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }
  function noise(dur, vol = 0.3, f = 1200, q = 1, type = "bandpass", when = 0, bus = sfxBus, fSlide = 0) {
    if (!ac) return;
    const t = T() + when;
    const s = ac.createBufferSource(); s.buffer = noiseBuf;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (fSlide) fl.frequency.exponentialRampToValueAtTime(Math.max(40, f * fSlide), t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(bus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }

  const sounds = {
    click: () => { tone(880, 0.06, "square", 0.08); tone(1320, 0.05, "square", 0.05, sfxBus, 0.04); },
    back: () => tone(520, 0.08, "triangle", 0.1, sfxBus, 0, 0.6),
    beep: () => tone(660, 0.18, "square", 0.16),
    go: () => { tone(1320, 0.5, "square", 0.18); tone(990, 0.5, "square", 0.08); },
    punch: () => { noise(0.08, 0.5, 900, 0.8); tone(140, 0.12, "sine", 0.5, sfxBus, 0, 0.5); },
    kick: () => { noise(0.14, 0.6, 600, 0.7); tone(100, 0.2, "sine", 0.7, sfxBus, 0, 0.4); tone(300, 0.06, "square", 0.08); },
    swing: () => noise(0.12, 0.18, 2200, 2, "bandpass", 0, sfxBus, 0.4),
    throw: () => noise(0.22, 0.25, 600, 3, "bandpass", 0, sfxBus, 4),
    hit: () => { noise(0.18, 0.5, 400, 0.6); tone(220, 0.1, "square", 0.12, sfxBus, 0, 0.5); },
    pickup: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.09, "square", 0.08, sfxBus, i * 0.05)); },
    repair: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.14, "triangle", 0.12, sfxBus, i * 0.06)); },
    pad: () => { tone(300, 0.35, "sawtooth", 0.12, sfxBus, 0, 4); noise(0.35, 0.2, 800, 2, "bandpass", 0, sfxBus, 5); },
    boost: () => noise(0.5, 0.25, 500, 2, "bandpass", 0, sfxBus, 6),
    jump: () => tone(220, 0.25, "triangle", 0.12, sfxBus, 0, 2.2),
    land: () => { noise(0.12, 0.4, 300, 0.7, "lowpass"); tone(80, 0.15, "sine", 0.4, sfxBus, 0, 0.5); },
    crash: () => { noise(0.5, 0.6, 700, 0.4, "lowpass", 0, sfxBus, 0.2); tone(90, 0.3, "sawtooth", 0.2, sfxBus, 0, 0.4); },
    bump: () => noise(0.08, 0.25, 500, 1),
    trick: () => { tone(1047, 0.12, "square", 0.1); tone(1568, 0.2, "square", 0.08, sfxBus, 0.08); },
    whoosh: () => noise(0.3, 0.2, 1500, 2, "bandpass", 0, sfxBus, 0.3),
    wipe: () => { noise(0.8, 0.6, 1200, 0.5, "lowpass", 0, sfxBus, 0.1); tone(400, 0.6, "sawtooth", 0.15, sfxBus, 0, 0.25); },
    finish: () => { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i === 6 ? 0.6 : 0.14, "square", 0.12, sfxBus, i * 0.11)); },
    storm: () => noise(1.6, 0.3, 300, 0.5, "lowpass", 0, sfxBus, 3),
    unlock: () => { [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.2, "triangle", 0.14, sfxBus, i * 0.09)); },
  };

  /* Engine voice per local human: motor (dirt/atv) or wind + freewheel (bikes) */
  function engineStart(i, vehId) {
    if (!ac) return;

    const wf = ac.createBiquadFilter(); wf.type = "bandpass"; wf.frequency.value = 600; wf.Q.value = 0.6;
    const wg = ac.createGain(); wg.gain.value = 0;

    } else {
      const o = ac.createOscillator(); o.type = "square"; o.frequency.value = 8;
      const tg = ac.createGain(); tg.gain.value = 0;
      const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000;
      o.connect(hp); hp.connect(tg); tg.connect(g); o.start();

    }

  }
  function engineUpdate(i, speedPct, boosting, air, vol = 1) {
    const e = engines[i];
    if (!e || !ac) return;
    const t = T();
    e.g.gain.setTargetAtTime(sfxOn ? 0.5 * vol : 0, t, 0.1);
    e.wind.g.gain.setTargetAtTime(0.05 + speedPct * speedPct * 0.25, t, 0.1);
    e.wind.f.frequency.setTargetAtTime(400 + speedPct * 900 + (boosting ? 500 : 0), t, 0.1);
    if (e.lp) {
      const f = 45 + speedPct * 110 + (boosting ? 30 : 0) + (air ? 40 : 0);
      e.osc.forEach((o) => o.frequency.setTargetAtTime(f, t, 0.08));
      e.lp.frequency.setTargetAtTime(500 + speedPct * 1400, t, 0.1);
    } else {
      e.osc[0].frequency.setTargetAtTime(6 + speedPct * 22, t, 0.1);
      e.tick.gain.setTargetAtTime(air ? 0.04 : 0.015 + speedPct * 0.02, t, 0.1);
    }
  }
  function engineStop(i) {
    const e = engines[i];
    if (!e) return;
    try { e.osc.forEach((o) => o.stop()); e.wind.src.stop(); } catch (_) {}
    e.g.disconnect();
    engines[i] = null;
  }
  function enginesOff() { for (let i = 0; i < engines.length; i++) engineStop(i); }

  /* ---------- procedural music ---------- */
  const SONGS = [
    { bpm: 150, root: 45, scale: [0, 3, 5, 7, 10], prog: [0, 0, 5, 3], lead: "square", feel: "rock" },     // forest: A minor pentatonic
    { bpm: 138, root: 43, scale: [0, 1, 4, 5, 7, 8, 10], prog: [0, 1, 0, 6], lead: "sawtooth", feel: "desert" }, // G phrygian dominant
    { bpm: 164, root: 47, scale: [0, 2, 3, 5, 7, 8, 10], prog: [0, 5, 3, 6], lead: "square", feel: "dnb" }, // B minor
    { bpm: 142, root: 50, scale: [0, 2, 4, 7, 9], prog: [0, 3, 4, 3], lead: "triangle", feel: "dhol" },    // D major pentatonic, dhol groove
    { bpm: 156, root: 40, scale: [0, 1, 3, 5, 7, 8, 10], prog: [0, 1, 5, 6], lead: "sawtooth", feel: "metal" }, // E phrygian
    { bpm: 128, root: 42, scale: [0, 2, 3, 7, 8], prog: [0, 5, 3, 4], lead: "triangle", feel: "synth" },   // F# minor, dreamy
    { bpm: 120, root: 48, scale: [0, 2, 4, 7, 9], prog: [0, 5, 3, 4], lead: "square", feel: "menu" },
  ];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function kick(t, v = 0.9) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.3); }
  function snare(t, v = 0.35) { const s = ac.createBufferSource(); s.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1500; const g = ac.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16); s.connect(f); f.connect(g); g.connect(musicBus); s.start(t, Math.random()); s.stop(t + 0.2); const o = ac.createOscillator(), og = ac.createGain(); o.frequency.value = 190; og.gain.setValueAtTime(v * 0.5, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.08); o.connect(og); og.connect(musicBus); o.start(t); o.stop(t + 0.1); }

  function tom(t, f0, v = 0.4) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.6, t + 0.2); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.3); }
  function note(t, m, dur, type, v, cutoff = 2400) {
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = type; o.frequency.value = mtof(m); f.type = "lowpass"; f.frequency.value = cutoff;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur + 0.02);
  }
  function music(idx) {
    init();
    if (!ac) return;
    stopMusic();
    const S = SONGS[idx];
    const step = 60 / S.bpm / 4;
    let n = 0, nextT = T() + 0.08;
    const R = rng(idx * 31 + 5);
    const motif = Array.from({ length: 16 }, () => (R() < 0.55 ? (R() * S.scale.length) | 0 : -1));
    const motif2 = Array.from({ length: 16 }, () => (R() < 0.45 ? (R() * S.scale.length) | 0 : -1));
    const sc = (deg, oct = 0) => S.root + S.scale[((deg % S.scale.length) + S.scale.length) % S.scale.length] + 12 * (oct + Math.floor(deg / S.scale.length));
    seq = setInterval(() => {
      if (!ac || ac.state !== "running") return;
      while (nextT < T() + 0.15) {
        const s16 = n % 16, bar = Math.floor(n / 16), chord = S.prog[bar % 4];
        const sect = Math.floor(bar / 8) % 2; // A/B sections
        const t = nextT;
        // drums
        if (S.feel === "menu") { if (s16 % 8 === 0) kick(t, 0.6); if (s16 % 8 === 4) snare(t, 0.2); if (s16 % 2 === 0) hat(t, 0.04); }
        else if (S.feel === "dnb") { if (s16 === 0 || s16 === 10) kick(t); if (s16 === 4 || s16 === 12) snare(t, 0.4); hat(t, s16 % 2 ? 0.05 : 0.08); }
        else if (S.feel === "dhol") { if ([0, 3, 6, 10].includes(s16)) tom(t, 90, 0.55); if ([2, 8, 11, 14].includes(s16)) tom(t, 260, 0.25); if (s16 === 4 || s16 === 12) snare(t, 0.22); if (s16 % 2 === 0) hat(t, 0.05); }
        else if (S.feel === "metal") { if (s16 % 2 === 0) kick(t, 0.7); if (s16 === 4 || s16 === 12) snare(t, 0.42); if (s16 % 4 === 2) hat(t, 0.08, true); }
        else { if (s16 === 0 || s16 === 8 || (s16 === 11 && sect)) kick(t); if (s16 === 4 || s16 === 12) snare(t); if (s16 % 2 === 0) hat(t, 0.07, s16 === 14); }
        // bass
        const bassPat = S.feel === "metal" ? s16 % 2 === 0 : S.feel === "synth" ? s16 % 4 === 0 : [0, 3, 6, 8, 10, 14].includes(s16);
        if (bassPat) note(t, sc(chord) - 12 + (s16 === 14 ? 12 : 0), step * 1.8, "sawtooth", 0.16, 500);
        // pad on bar start
        if (s16 === 0 && S.feel !== "metal") [0, 2, 4].forEach((d) => note(t, sc(chord + d, 1), step * 15, "triangle", 0.035, 1500));
        // lead motif
        const m = (sect ? motif2 : motif)[s16];
        if (m >= 0 && bar % 8 !== 7) note(t, sc(chord + m, 2), step * (S.feel === "synth" ? 3 : 1.6), S.lead, S.lead === "sawtooth" ? 0.05 : 0.06, 3200);
        if (S.feel === "desert" && s16 % 4 === 0) note(t, sc(chord + 4, 2), step * 0.8, "triangle", 0.04);
        nextT += step; n++;
      }
    }, 30);
  }

  function setMusic(on) { musicOn = on; if (musicBus) musicBus.gain.setTargetAtTime(on ? musicVol : 0, T(), 0.05); }
  function setSfx(on) { sfxOn = on; if (sfxBus) sfxBus.gain.setTargetAtTime(on ? sfxVol : 0, T(), 0.05); }

  function resume() { if (ac && ac.state === "suspended") ac.resume(); }
  return { init, unlock, play, music, stopMusic, setMusic, setSfx, suspend, resume, engineStart, engineUpdate, engineStop, enginesOff, get on() { return { musicOn, sfxOn }; } };
})();

// ===== track.js =====
/* Track generation. Deterministic from the track seed so every device builds the identical course. */

const SEG = 200;          // segment length (world units)
const ROAD_W = 2000;      // road half-width (world units) — x = ±1 is the road edge
const CAM_H = 1000;       // camera height
const CAM_D = 0.84;       // focal factor (≈ 100° fov)
const PLAYER_DIST = CAM_H * CAM_D;

function buildTrack(def) {
  const biome = BIOMES[def.biome];
  const R = rng(def.seed);
  const segs = [];
  let y = 0;
  const add = (curve, dy, extra) => {
    const i = segs.length;
    const s = { i, y1: y, y2: y + dy, curve, w: 1, split: 0, dark: ((i / 3) | 0) % 2, sprites: [], decal: null, surface: null, ramp: null, vent: null, clip: 0, objs: [] };
    if (extra) Object.assign(s, extra);
    y += dy;
    segs.push(s);
    return s;
  };
  // eased section: enter, hold, leave counts; curve strength; total drop
  const section = (enter, hold, leave, curve, drop) => {
    const total = enter + hold + leave;
    const startY = y;
    for (let n = 0; n < total; n++) {
      let c;
      if (n < enter) c = curve * easeIn(n / enter);
      else if (n < enter + hold) c = curve;
      else c = curve * (1 - easeIn((n - enter - hold) / leave));
      const t0 = n / total, t1 = (n + 1) / total;
      const dy = (easeInOut(t1) - easeInOut(t0)) * drop;
      add(c, dy);
    }
    return startY;
  };
  function easeIn(t) { return t * t; }
  function easeInOut(t) { return -Math.cos(t * Math.PI) / 2 + 0.5; }

  // ---- 1. Layout ----
  section(0, 40, 0, 0, 0);                         // start straight
  const H = def.hilly, C = def.curvy;
  while (segs.length < def.len) {
    const r = R();
    const len = 40 + ((R() * 90) | 0);
    const dir = R() < 0.5 ? -1 : 1;
    const drop = -(SEG * (8 + R() * 34) * H);       // mostly downhill
    if (r < 0.38) section(14, len, 14, dir * (2 + R() * 4.5) * C, drop);
    else if (r < 0.55) { section(10, len / 2, 10, dir * (3 + R() * 3) * C, drop * 0.5); section(10, len / 2, 10, -dir * (3 + R() * 3) * C, drop * 0.5); }
    else if (r < 0.72) { section(12, 16, 12, 0, SEG * (6 + R() * 10) * H); section(10, len, 10, dir * R() * 2 * C, drop * 1.4); } // crest then plunge
    else if (r < 0.86) section(8, len, 8, dir * R() * 1.2 * C, drop * 1.6);                                                     // steep chute
    else section(10, len, 10, 0, -SEG * 4);                                                                                    // breather
  }
  const finishIdx = segs.length;
  section(0, 200, 0, 0, -SEG * 10);                // run-out after the finish
  const N = segs.length;

  // ---- 2. Features ----
  const freeAt = (i, span = 6) => { for (let k = i - span; k <= i + span; k++) { const s = segs[k]; if (!s || s.ramp || s.split || s.surface || s.vent || s.decal) return false; } return true; };
  const placeable = (i) => i > 70 && i < finishIdx - 60;

  // split sections (a fork with a median; the riskier side carries pads and a repair kit)
  for (let n = 0; n < def.splits; n++) {
    const i0 = 160 + (((finishIdx - 360) / def.splits) * (n + 0.35 + R() * 0.3)) | 0;
    const len = 90 + ((R() * 50) | 0);
    let ok = true;
    for (let k = i0 - 10; k < i0 + len + 10; k++) if (!segs[k] || segs[k].split || segs[k].ramp) ok = false;
    if (!ok) continue;
    const risky = R() < 0.5 ? -1 : 1;
    for (let k = 0; k < len; k++) {
      const s = segs[i0 + k];
      const t = k < 20 ? k / 20 : k > len - 20 ? (len - k) / 20 : 1;
      s.w = 1 + 0.75 * t;
      s.split = t;
      s.curve *= 0.5;
    }
    const med = BIOME_SCENERY[biome.id].obstacles[0];
    segs[i0 - 12].sprites.push({ id: "sign", x: 0 });
    for (let k = 14; k < len - 14; k += 7) segs[i0 + k].sprites.push({ id: k % 14 === 0 ? med : BIOME_SCENERY[biome.id].near[0][0], x: 0, median: 1 });
    // pads on the risky side, obstacles too
    for (let k = 26; k < len - 30; k += 34) {
      decal(i0 + k, 8, risky * 0.95, 0.4, "boost");
      segs[i0 + k + 16].sprites.push({ id: BIOME_SCENERY[biome.id].obstacles[0], x: risky * (0.95 + (R() < 0.5 ? -0.35 : 0.35)) });
    }
    segs[i0 + ((len / 2) | 0)].objs.push({ kind: "repair", x: risky * 0.95 });
  }

  function decal(i, len, x, hw, type) {
    for (let k = 0; k < len; k++) { const s = segs[i + k]; if (s) s.decal = { type, x0: x - hw, x1: x + hw, k, len }; }
  }

  // ramps (sometimes a pair) — after a ramp: a gap with no obstacles
  for (let n = 0; n < def.ramps; n++) {
    for (let tries = 0; tries < 20; tries++) {
      const i = 120 + ((R() * (finishIdx - 260)) | 0);
      if (!placeable(i) || !freeAt(i, 30)) continue;
      const pair = R() < 0.4;
      const xs = pair ? [-0.5, 0.5] : [pick3(R)];
      segs[i].ramp = xs.map((x) => ({ x }));
      xs.forEach((x) => segs[i].sprites.push({ id: "ramp", x, flat: 1 }));
      // crates high-reward line just after landing
      if (R() < 0.6) segs[i + 26].objs.push({ kind: "crate", x: xs[0] });
      break;
    }
  }
  function pick3(r) { const v = r(); return v < 0.33 ? -0.5 : v < 0.66 ? 0 : 0.5; }

  // boost pads
  for (let n = 0; n < def.pads; n++) {
    for (let tries = 0; tries < 20; tries++) {
      const i = 90 + ((R() * (finishIdx - 200)) | 0);
      if (!placeable(i) || !freeAt(i, 12)) continue;
      decal(i, 8, (R() * 1.2 - 0.6), 0.28, "boost");
      break;
    }
  }

  // biome surfaces
  const surf = { forest: null, desert: "sand", glacier: "ice", ghats: "mud", volcano: "lava", tundra: "ice" }[biome.id];
  if (surf) {
    const count = Math.round(6 * def.haz);
    for (let n = 0; n < count; n++) {
      for (let tries = 0; tries < 20; tries++) {
        const i = 110 + ((R() * (finishIdx - 230)) | 0);
        if (!placeable(i) || !freeAt(i, 18)) continue;
        const len = 18 + ((R() * 26) | 0);
        const hw = surf === "lava" ? 0.22 : 0.35 + R() * 0.35;
        const x = (R() * 2 - 1) * (1 - hw) * 0.9;
        for (let k = 0; k < len; k++) { const s = segs[i + k]; s.surface = { type: surf, x0: x - hw, x1: x + hw, k, len }; }
        break;
      }
    }
    if (biome.id === "ghats") {   // full-width river crossings
      for (let n = 0; n < 3; n++) for (let tries = 0; tries < 20; tries++) {
        const i = 200 + ((R() * (finishIdx - 320)) | 0);
        if (!placeable(i) || !freeAt(i, 16)) continue;
        for (let k = 0; k < 14; k++) segs[i + k].surface = { type: "water", x0: -2, x1: 2, k, len: 14 };
        break;
      }
    }
  }
  // volcano geysers act as natural launchers
  if (biome.id === "volcano") {
    for (let n = 0; n < 6; n++) for (let tries = 0; tries < 20; tries++) {
      const i = 140 + ((R() * (finishIdx - 260)) | 0);
      if (!placeable(i) || !freeAt(i, 20)) continue;
      const x = R() * 1.2 - 0.6;
      segs[i].vent = { x };
      segs[i].sprites.push({ id: "vent", x, flat: 1 });
      break;
    }
  }

  // on-road obstacles
  const obsIds = BIOME_SCENERY[biome.id].obstacles;
  const nObs = Math.round(26 * def.haz * (def.len / 3500));
  for (let n = 0; n < nObs; n++) {
    for (let tries = 0; tries < 20; tries++) {
      const i = 100 + ((R() * (finishIdx - 180)) | 0);
      const s = segs[i];
      if (!placeable(i) || s.ramp || s.vent || (segs[i - 1] && segs[i - 1].ramp)) continue;
      // keep landing zones after ramps clear
      let nearRamp = false;
      for (let k = i - 34; k < i; k++) if (segs[k] && (segs[k].ramp || segs[k].vent)) nearRamp = true;
      if (nearRamp) continue;
      if (biome.id === "forest" && R() < 0.35) { s.sprites.push({ id: "log", x: R() < 0.5 ? -0.55 : 0.55 }); break; }
      s.sprites.push({ id: pickW(obsIds, R), x: (R() * 1.6 - 0.8) * s.w });
      break;
    }
  }
  function pickW(arr, r) { return arr[(r() * arr.length) | 0]; }

  // crates: rows of three
  for (let i = 150; i < finishIdx - 80; i += 190 + ((R() * 80) | 0)) {
    if (segs[i].ramp || segs[i].split) continue;
    [-0.6, 0, 0.6].forEach((x) => segs[i].objs.push({ kind: "crate", x: x * segs[i].w }));
  }
  // repair kits near the tricky bits
  for (let n = 0; n < 4; n++) {
    const i = 300 + ((R() * (finishIdx - 450)) | 0);
    segs[i].objs.push({ kind: "repair", x: R() < 0.5 ? -0.8 : 0.8 });
  }

  // ---- 3. Scenery ----
  const set = BIOME_SCENERY[biome.id];
  const wsum = set.near.reduce((a, b) => a + b[1], 0);
  const pickNear = () => { let t = R() * wsum; for (const [id, w] of set.near) { if ((t -= w) <= 0) return id; } return set.near[0][0]; };
  for (let i = 0; i < N; i++) {
    const s = segs[i];
    const edge = s.w;
    if (R() < 0.62) s.sprites.push({ id: pickNear(), x: -(edge + 0.5 + R() * 1.5) });
    if (R() < 0.62) s.sprites.push({ id: pickNear(), x: edge + 0.5 + R() * 1.5 });
    if (i % 4 === 0) {
      const side = R() < 0.5 ? -1 : 1;
      s.sprites.push({ id: set.far[(R() * set.far.length) | 0], x: side * (edge + 2.4 + R() * 4) });
    }
    if (biome.id === "tundra" && i % 24 === 0) { s.sprites.push({ id: "lantern", x: -(edge + 0.22) }); s.sprites.push({ id: "lantern", x: edge + 0.22 }); }
    if (biome.id === "glacier" && i % 30 === 15) s.sprites.push({ id: "gate", x: (i % 60 < 30 ? -1 : 1) * (edge + 0.15) });
    if (i % 140 === 70 && set.special.includes("banner")) s.sprites.push({ id: "banner", x: (i % 280 < 140 ? -1 : 1) * (edge + 0.2) });
  }
  // start & finish dressing
  segs[16].sprites.push({ id: "startgate", x: 0, gate: 1 });
  segs[finishIdx].sprites.push({ id: "arch", x: 0, gate: 1 });
  for (const i of [6, 12, 22, finishIdx - 8, finishIdx - 2, finishIdx + 6]) {
    segs[i].sprites.push({ id: "crowd", x: -(segs[i].w + 0.9) }, { id: "crowd", x: segs[i].w + 0.9 });
  }
  return {
    def, biome, segs, N,
    length: N * SEG,
    finishZ: finishIdx * SEG,
    startZ: 22 * SEG,
  };
}

function segAt(track, z) { return track.segs[(Math.floor(z / SEG) % track.N + track.N) % track.N]; }
function roadY(track, z) {
  const s = segAt(track, z);
  const t = (z % SEG) / SEG;
  return lerp(s.y1, s.y2, t);
}

// ===== render.js =====
/* Pseudo-3D renderer: one call per viewport (split screen draws two). */

// CAM_LIFT raises the camera (0 = original low view). The horizon moves up by the same amount, so the rider stays
// at the same spot and size on screen while you look down on the road and the pack from higher up.
const RENDER = { drawDist: 150, CAM_LIFT: 0.3 };

function projK(w, h) {
  // world→pixel factor at scale 1; tuned so the road spans ~75% of the view at the rider
  return Math.min(h * 0.42, w * (w > h * 1.2 ? 0.2 : 0.3));
}

function renderView(ctx, vp, race, me, tnow) {
  const { track, assets } = race;
  const biome = track.biome;
  const { w, h } = vp;
  ctx.save();
  ctx.beginPath(); ctx.rect(vp.x, vp.y, w, h); ctx.clip();
  ctx.translate(vp.x, vp.y);

  const shake = me.shake > 0 ? me.shake : 0;
  const K = projK(w, h) * (1 - me.fovKick * 0.12);
  const hz = h * 0.38 - RENDER.CAM_LIFT * K;
  const camZ = me.z - PLAYER_DIST;
  const baseIdx = Math.floor(camZ / SEG);
  const base = track.segs[clamp(baseIdx, 0, track.N - 1)];
  const basePct = (camZ - baseIdx * SEG) / SEG;
  const camY = roadY(track, me.z) + CAM_H * (1 + RENDER.CAM_LIFT) + me.h * 0.55;
  const camX = me.camX * ROAD_W;

  // camera tilt + shake
  ctx.translate(w / 2 + (shake ? rnd(-shake, shake) : 0), h * 0.62 + (shake ? rnd(-shake, shake) : 0));
  ctx.rotate(me.tilt);
  const zoom = 1 + Math.abs(me.tilt) * 0.9;
  ctx.scale(zoom, zoom);
  ctx.translate(-w / 2, -h * 0.62);

  // ---- sky & parallax ----
  drawSky(ctx, w, h, hz, biome, tnow, me);
  const slope = (base.y2 - base.y1) / SEG;
  const hzShift = clamp(-slope * h * 0.35, -h * 0.12, h * 0.12);
  drawLayer(ctx, assets.far, w, h, hz + hzShift * 0.6, me.bgX * 0.25, 0.62, biome);
  drawLayer(ctx, assets.near, w, h, hz + hzShift, me.bgX * 0.55, 0.46, biome);

  // ---- road ----
  const segs = track.segs;
  const dd = race.split ? Math.min(RENDER.drawDist, 110) : RENDER.drawDist;
  const fogC = race.stormFog > 0 ? mix(biome.fog, "#d9a868", race.stormFog) : biome.fog;
  const fogDensity = biome.dark ? 2.2 : 1.4 + race.stormFog * 5;
  let maxy = h;
  let x = 0, dx = -(base.curve * basePct);
  const drawn = [];
  for (let n = 0; n < dd; n++) {
    const i = base.i + n;
    if (i >= track.N) break;
    const s = segs[i];
    const z1 = i * SEG - camZ, z2 = (i + 1) * SEG - camZ;
    s.vis = false;
    if (z1 <= 1) { x += dx; dx += s.curve; continue; }
    const sc1 = CAM_D / z1, sc2 = CAM_D / z2;
    s.sc1 = sc1; s.sc2 = sc2;
    s.sx1 = w / 2 + sc1 * (x - camX) * K;  s.sy1 = hz - sc1 * (s.y1 - camY) * K;
    s.sx2 = w / 2 + sc2 * (x + dx - camX) * K; s.sy2 = hz - sc2 * (s.y2 - camY) * K;
    s.rw1 = sc1 * ROAD_W * K; s.rw2 = sc2 * ROAD_W * K;
    s.clip = maxy;
    s.fog = 1 - Math.exp(-((n / dd) ** 2) * fogDensity);
    x += dx; dx += s.curve;
    if (s.sy2 >= s.sy1 || s.sy2 >= maxy) { s.vis = true; drawn.push(s); continue; }
    s.vis = true; drawn.push(s);
    drawSegment(ctx, w, s, biome, tnow, maxy);
    if (s.fog > 0.02) { ctx.fillStyle = rgba(fogC, s.fog); ctx.fillRect(0, s.sy2, w, Math.min(maxy, s.sy1) - s.sy2 + 1); }
    maxy = s.sy2;
  }

  // ---- sprites, riders, objects (far → near) ----
  const glows = [];
  const buckets = race.buckets;
  for (let k = drawn.length - 1; k >= 0; k--) {
    const s = drawn[k];
    const alpha = 1 - s.fog * 0.85;
    for (const sp of s.sprites) {
      const S = assets.sprites[sp.id];
      if (!S || sp.dead) continue;
      drawSprite(ctx, S, s.sx1 + s.sc1 * sp.x * ROAD_W * K, s.sy1, s.sc1 * K, s.clip, alpha, sp.flat);
      if (S.glow && biome.dark) glows.push([s.sx1 + s.sc1 * sp.x * ROAD_W * K, s.sy1 - S.wh * s.sc1 * K * 0.7, S.ww * s.sc1 * K * 1.2, S.glow]);
    }
    for (const o of s.objs) {
      if (o.taken > race.time) continue;
      const S = assets.sprites[o.kind];
      const bob = Math.sin(tnow * 4 + s.i) * 60;
      const sc = s.sc1 * K;
