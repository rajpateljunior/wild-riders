      drawSprite(ctx, S, s.sx1 + s.sc1 * o.x * ROAD_W * K, s.sy1 - (180 + bob) * sc, sc, s.clip, alpha, false);
      if (biome.dark) glows.push([s.sx1 + s.sc1 * o.x * ROAD_W * K, s.sy1 - 400 * sc, 700 * sc, S.glow]);
    }
    const list = buckets[s.i];
    if (list) {
      list.sort((a, b) => b.z - a.z);
      for (const e of list) drawEntity(ctx, e, s, K, me, race, glows, tnow);
    }
  }

  // ---- weather & lighting ----
  drawWeather(ctx, w, h, biome, race, me, tnow);
  if (biome.dark) drawDarkness(ctx, w, h, hz, glows, me);
  ctx.restore();

  // screen-space overlays (not tilted)
  ctx.save();
  ctx.beginPath(); ctx.rect(vp.x, vp.y, w, h); ctx.clip();
  ctx.translate(vp.x, vp.y);
  if (!race.demo) { drawScreenFX(ctx, w, h, me, race, tnow); drawHUD(ctx, w, h, me, race, tnow); }
  ctx.restore();
}

function drawSky(ctx, w, h, hz, biome, t, me) {
  const g = ctx.createLinearGradient(0, -h * 0.1, 0, hz + h * 0.1);
  g.addColorStop(0, biome.sky[0]); g.addColorStop(0.6, biome.sky[1]); g.addColorStop(1, biome.sky[2]);
  ctx.fillStyle = g;
  ctx.fillRect(-w * 0.1, -h * 0.2, w * 1.2, h * 1.3);
  // sun / moon
  const sx = w * biome.sunX - me.bgX * 0.05 % w, sy = h * biome.sunY;
  const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, h * 0.35);
  rg.addColorStop(0, rgba(biome.sun, 0.9)); rg.addColorStop(0.12, rgba(biome.sun, 0.55)); rg.addColorStop(1, rgba(biome.sun, 0));
  ctx.fillStyle = rg; ctx.fillRect(sx - h * 0.4, sy - h * 0.4, h * 0.8, h * 0.8);
  ctx.fillStyle = biome.sun; ctx.beginPath(); ctx.arc(sx, sy, h * (biome.dark ? 0.04 : 0.055), 0, TAU); ctx.fill();
  if (biome.dark) {
    // stars
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 60; i++) {
      const px = ((i * 137.5 + (-me.bgX * 0.02)) % w + w) % w, py = ((i * 61.3) % (hz * 0.9));
      ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.3 + i));
      ctx.fillRect(px, py, 1.6, 1.6);
    }
    ctx.globalAlpha = 1;
    // aurora curtains
    ctx.globalCompositeOperation = "lighter";
    for (let b = 0; b < 3; b++) {
      const col = ["#3dffb0", "#38d0ff", "#b35cff"][b];
      ctx.beginPath();
      const y0 = hz * (0.18 + b * 0.12);
      ctx.moveTo(-10, y0);
      for (let px = 0; px <= w + 20; px += 20) ctx.lineTo(px, y0 + Math.sin(px * 0.006 + t * 0.6 + b * 2 - me.bgX * 0.0008) * hz * 0.12);
      for (let px = w + 20; px >= -10; px -= 20) ctx.lineTo(px, y0 + hz * 0.22 + Math.sin(px * 0.008 + t * 0.5 + b) * hz * 0.08);
      ctx.closePath();
      const ag = ctx.createLinearGradient(0, y0 - hz * 0.1, 0, y0 + hz * 0.3);
      ag.addColorStop(0, rgba(col, 0)); ag.addColorStop(0.5, rgba(col, 0.28)); ag.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = ag; ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }
  if (biome.id === "volcano") {
    ctx.fillStyle = "rgba(40,20,20,.25)";
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.ellipse(((i * 300 - me.bgX * 0.1 - t * 8) % (w + 400) + w + 400) % (w + 400) - 200, hz * (0.25 + i * 0.12), w * 0.3, hz * 0.06, 0, 0, TAU); ctx.fill(); }
  }
}

function drawLayer(ctx, img, w, h, hz, off, frac, biome) {
  if (!img) return;
  const lh = h * frac;
  const lw = lh * (img.width / img.height);
  const y = hz - lh * 0.92;
  let x0 = -((off % lw) + lw) % lw - w * 0.1;
  for (let x = x0; x < w * 1.1; x += lw) ctx.drawImage(img, x, y, lw + 1, lh);
  // fill below the layer down to well under the horizon so hills never show sky gaps
  ctx.fillStyle = biome.ground[1];
}

function drawSegment(ctx, w, s, biome, t, maxy) {
  const { sx1, sy1, sx2, sy2 } = s;
  const y1 = Math.min(sy1, maxy);
  const rw1 = s.rw1 * s.w, rw2 = s.rw2 * s.w;
  // ground band
  ctx.fillStyle = biome.ground[s.dark];
  ctx.fillRect(-w * 0.2, sy2, w * 1.4, y1 - sy2 + 1);
  // rumble edges
  const r1 = rw1 * 1.12, r2 = rw2 * 1.12;
  quad(ctx, sx1 - r1, sy1, sx1 + r1, sy1, sx2 + r2, sy2, sx2 - r2, sy2, biome.edge[s.dark]);
  // road
  quad(ctx, sx1 - rw1, sy1, sx1 + rw1, sy1, sx2 + rw2, sy2, sx2 - rw2, sy2, biome.road[s.dark]);
  // tire ruts
  if (s.rw1 > 6) {
    for (const rx of [-0.42, 0.42]) {
      const a1 = sx1 + rx * s.rw1, a2 = sx2 + rx * s.rw2;
      quad(ctx, a1 - s.rw1 * 0.06, sy1, a1 + s.rw1 * 0.06, sy1, a2 + s.rw2 * 0.06, sy2, a2 - s.rw2 * 0.06, sy2, biome.rut);
    }
  }
  // split median (fork)
  if (s.split > 0.01) {
    const m1 = s.rw1 * 0.22 * s.split, m2 = s.rw2 * 0.22 * s.split;
    quad(ctx, sx1 - m1 * 1.15, sy1, sx1 + m1 * 1.15, sy1, sx2 + m2 * 1.15, sy2, sx2 - m2 * 1.15, sy2, biome.edge[s.dark]);
    quad(ctx, sx1 - m1, sy1, sx1 + m1, sy1, sx2 + m2, sy2, sx2 - m2, sy2, biome.ground[s.dark]);
  }
  // surface patches
  const sf = s.surface;
  if (sf) {
    const col = { sand: "#f2cf91", ice: "#bfeaff", mud: "#5a2e14", water: "#3a8fd0", lava: "#ff5a1f" }[sf.type];
    const taper = Math.sin((sf.k + 0.5) / sf.len * Math.PI);
    const c = (sf.x0 + sf.x1) / 2, hw = (sf.x1 - sf.x0) / 2 * (sf.type === "water" ? 1.2 : 0.4 + 0.6 * taper);
    let col2 = col;
    if (sf.type === "water") col2 = (s.i + Math.floor(t * 8)) % 3 === 0 ? "#7cc6f2" : col;
    if (sf.type === "lava") col2 = (s.i + Math.floor(t * 6)) % 2 ? "#ff7a1f" : "#ffb347";
    if (sf.type === "ice") col2 = s.dark ? "#cdeffd" : "#b2e2fb";
    quad(ctx, sx1 + (c - hw) * s.rw1, sy1, sx1 + (c + hw) * s.rw1, sy1, sx2 + (c + hw) * s.rw2, sy2, sx2 + (c - hw) * s.rw2, sy2, col2);
    if (sf.type === "lava") { const hw2 = hw * 0.35; quad(ctx, sx1 + (c - hw2) * s.rw1, sy1, sx1 + (c + hw2) * s.rw1, sy1, sx2 + (c + hw2) * s.rw2, sy2, sx2 + (c - hw2) * s.rw2, sy2, "#ffe08a"); }
  }
  // boost pads (animated chevrons)
  const d = s.decal;
  if (d && d.type === "boost") {
    const on = ((d.k + Math.floor(t * 12)) % 4) < 2;
    const c = (d.x0 + d.x1) / 2, hw = (d.x1 - d.x0) / 2;
    quad(ctx, sx1 + (c - hw) * s.rw1, sy1, sx1 + (c + hw) * s.rw1, sy1, sx2 + (c + hw) * s.rw2, sy2, sx2 + (c - hw) * s.rw2, sy2, on ? "#2bd9c5" : "#fff35c");
    if (s.rw1 > 20) {
      ctx.fillStyle = on ? "#0d6e66" : "#c48a00";
      const cx1 = sx1 + c * s.rw1, cx2 = sx2 + c * s.rw2;
      ctx.beginPath(); ctx.moveTo(cx1 - hw * s.rw1 * 0.6, sy1); ctx.lineTo(cx2, sy2); ctx.lineTo(cx1 + hw * s.rw1 * 0.6, sy1); ctx.closePath(); ctx.fill();
    }
  }
}

function quad(ctx, x1, y1, x2, y2, x3, y3, x4, y4, col) {
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.closePath(); ctx.fill();
}

function drawSprite(ctx, S, sx, sy, sc, clipY, alpha, flat) {
  const dw = S.ww * sc, dh = S.wh * sc;
  if (dw < 1.5 || dh < 1.5) return;
  const dx = sx - dw / 2, dy = sy - dh;
  if (dy >= clipY) return;
  const visH = Math.min(dh, clipY - dy);
  const srcH = S.c.height * (visH / dh);
  if (alpha < 0.98) ctx.globalAlpha = alpha;
  ctx.drawImage(S.c, 0, 0, S.c.width, srcH, dx, dy, dw, visH);
  if (alpha < 0.98) ctx.globalAlpha = 1;
}

/* Riders, projectiles, particles inside a segment */
function drawEntity(ctx, e, s, K, me, race, glows, t) {
  const pct = (e.z - s.i * SEG) / SEG;
  const sc = lerp(s.sc1, s.sc2, pct) * K;
  const cx = lerp(s.sx1, s.sx2, pct), cy = lerp(s.sy1, s.sy2, pct);
  const rw = lerp(s.rw1, s.rw2, pct);
  const px = cx + e.x * rw, py = cy;
  if (py - 10 > s.clip && !e.h) return;
  if (e.type === "rider") return drawRider(ctx, e, px, py, sc, s.clip, me, race, glows, t);
  if (e.type === "proj") {
    const img = race.assets.items[e.item];
    const size = 380 * sc * (e.big ? 1.6 : 1);
    const yy = py - e.h * sc;
    ctx.save(); ctx.translate(px, yy); ctx.rotate(t * 12);
    ctx.drawImage(img, -size / 2, -size / 2, size, size); ctx.restore();
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(px, py, size * 0.4, size * 0.12, 0, 0, TAU); ctx.fill();
    if (race.track.biome.dark) glows.push([px, yy, size * 1.4, ITEMS[e.item].col]);
    return;
  }
  if (e.type === "fx") {
    const r = Math.max(1, e.size * sc);
    ctx.globalAlpha = clamp(e.life / e.max, 0, 1);
    ctx.fillStyle = e.col;
    ctx.beginPath(); ctx.arc(px, py - e.h * sc, r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function riderPose(e, t) {
  if (e.wipeT > 0) return "hurt";
  if (e.trick) return e.trick.def.pose === "spin" ? "ride0" : e.trick.def.pose;
  if (e.atkT > 0) return (e.atkKick ? "kick" : "punch") + (e.atkSide < 0 ? "L" : "R");
  if (e.hurtT > 0) return "hurt";
  return Math.floor(e.pedal) % 2 ? "ride1" : "ride0";
}

function drawRider(ctx, e, px, py, sc, clipY, me, race, glows, t) {
  const spr = e.sprites[riderPose(e, t)];
  const vw = e.veh.w * 1.25, vh = vw * (SPRITE_H / SPRITE_W);
  const dw = vw * sc, dh = vh * sc;
  if (dw < 2) return;
  const lift = e.h * sc;
  // shadow
  const shs = clamp(1 - e.h / 3000, 0.3, 1);
  ctx.fillStyle = "rgba(0,0,0,.32)";
  ctx.beginPath(); ctx.ellipse(px, py, dw * 0.3 * shs * (e.veh.id === "atv" ? 1.5 : 1), dw * 0.07 * shs, 0, 0, TAU); ctx.fill();
  let rot = e.lean * 0.32 + (e.wobble > 0 ? Math.sin(t * 40) * 0.12 * e.wobble : 0);
  if (e.wipeT > 0) rot = e.wipeT * 9;
  if (e.trick && e.trick.def.pose === "spin") rot = (e.trick.t / e.trick.dur) * TAU;
  const y = py - lift;
  if (y - dh > clipY) return;
  ctx.save();
  ctx.translate(px, y - (e.wipeT > 0 ? dh * 0.3 : 0));
  ctx.rotate(rot);
  if (e.flash > 0 && Math.floor(t * 30) % 2) ctx.globalAlpha = 0.5;
  if (e.invuln > 0 && Math.floor(t * 16) % 2) ctx.globalAlpha = 0.55;
  ctx.drawImage(spr, -dw / 2, -dh * (e.wipeT > 0 ? 0.5 : 0.98), dw, dh);
  ctx.globalAlpha = 1;
  ctx.restore();
  // hit stars
  if (e.hurtT > 0 || e.wipeT > 0) {
    ctx.fillStyle = "#ffd23f";
    for (let i = 0; i < 3; i++) {
      const a = t * 6 + i * 2.1;
      star(ctx, px + Math.cos(a) * dw * 0.35, y - dh * 1.02 + Math.sin(a) * dh * 0.06, dw * 0.07);
    }
  }
  // burning / low-health smoke
  if (e.burnT > 0 || e.hp / e.maxHp < 0.3) {
    ctx.fillStyle = e.burnT > 0 ? "rgba(255,120,40,.55)" : "rgba(60,60,60,.35)";
    for (let i = 0; i < 3; i++) { const ph = (t * 1.5 + i / 3) % 1; ctx.beginPath(); ctx.arc(px + Math.sin(t * 3 + i) * dw * 0.1, y - dh * (0.5 + ph * 0.7), dw * (0.06 + ph * 0.1), 0, TAU); ctx.fill(); }
  }
  // boost flame
  if (e.boosting || e.padT > 0) {
    const fl = dw * (0.18 + Math.random() * 0.08);
    const g = ctx.createRadialGradient(px, y - dh * 0.12, 0, px, y - dh * 0.12, fl * 1.6);
    g.addColorStop(0, "rgba(255,255,220,.95)"); g.addColorStop(0.4, e.padT > 0 ? "rgba(43,217,197,.8)" : "rgba(255,140,30,.8)"); g.addColorStop(1, "rgba(255,60,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, y - dh * 0.12, fl * 1.6, 0, TAU); ctx.fill();
  }
  // markers above other humans / everyone in split mode
  if (e !== me && e.human) {
    ctx.fillStyle = e.pIndex === 0 ? "#2bd9c5" : "#ff3d7f";
    const my = y - dh * 1.1;
    ctx.beginPath(); ctx.moveTo(px - 10, my - 16); ctx.lineTo(px + 10, my - 16); ctx.lineTo(px, my - 2); ctx.closePath(); ctx.fill();
    ctx.font = "16px Bangers, sans-serif"; ctx.textAlign = "center"; ctx.fillText("P" + (e.pIndex + 1), px, my - 20);
  }
  if (race.track.biome.dark && e !== me) glows.push([px, y - dh * 0.85, Math.min(dw * 0.7, 90), "#fff2c0"]);
}

function star(ctx, x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}

/* Weather particles in screen space (per view) */
function drawWeather(ctx, w, h, biome, race, me, t) {
  const sp = me.speed / 11000;
  const P = me.weather || (me.weather = Array.from({ length: 70 }, () => [Math.random(), Math.random(), Math.random()]));
  const kind = biome.weather;
  if (kind === "rain") {
    ctx.strokeStyle = "rgba(200,225,255,.55)"; ctx.lineWidth = 1.5; ctx.beginPath();
    for (const p of P) {
      p[1] += 0.035 + sp * 0.02; p[0] -= 0.004 + me.lean * 0.01;
      if (p[1] > 1) { p[1] -= 1; p[0] = Math.random(); }
      const x = ((p[0] % 1) + 1) % 1 * w, y = p[1] * h;
      ctx.moveTo(x, y); ctx.lineTo(x - 4 - sp * 6, y + 18 + sp * 14);
    }
    ctx.stroke();
    ctx.fillStyle = "rgba(60,80,90,.12)"; ctx.fillRect(0, 0, w, h);
  } else if (kind === "snow" || kind === "aurora") {
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (const p of P) {
      p[1] += 0.004 + p[2] * 0.004 + sp * 0.006; p[0] += Math.sin(t + p[2] * 9) * 0.0015 - me.lean * 0.004;
      if (p[1] > 1) { p[1] -= 1; p[0] = Math.random(); }
      const x = ((p[0] % 1) + 1) % 1 * w, y = p[1] * h;
      ctx.beginPath(); ctx.arc(x, y, 1.2 + p[2] * 2.4, 0, TAU); ctx.fill();
    }
  } else if (kind === "ash") {
    for (const p of P) {
      p[1] += 0.003 + p[2] * 0.003; p[0] += 0.001 - me.lean * 0.003;
      if (p[1] > 1) { p[1] -= 1; p[0] = Math.random(); }
      const x = ((p[0] % 1) + 1) % 1 * w, y = p[1] * h;
      ctx.fillStyle = p[2] > 0.75 ? `rgba(255,${120 + p[2] * 100 | 0},40,${0.6 + Math.sin(t * 8 + p[2] * 20) * 0.3})` : "rgba(70,60,60,.7)";
      ctx.fillRect(x, y, 2 + p[2] * 2, 2 + p[2] * 2);
    }
    const g = ctx.createLinearGradient(0, h, 0, h * 0.5);
    g.addColorStop(0, "rgba(255,80,20,.18)"); g.addColorStop(1, "rgba(255,80,20,0)");
    ctx.fillStyle = g; ctx.fillRect(0, h * 0.5, w, h * 0.5);
  } else if (kind === "sand") {
    const a = 0.25 + race.stormFog * 0.6;
    ctx.fillStyle = `rgba(240,200,140,${a})`;
    for (const p of P) {
      p[0] -= 0.006 + p[2] * 0.01 + race.stormFog * 0.02; p[1] += 0.002;
      if (p[0] < 0) { p[0] += 1; p[1] = Math.random(); }
      if (p[1] > 1) p[1] -= 1;
      ctx.fillRect(p[0] * w, p[1] * h, 6 + p[2] * 10, 1.5);
    }
    if (race.stormFog > 0) { ctx.fillStyle = `rgba(214,160,96,${race.stormFog * 0.45})`; ctx.fillRect(0, 0, w, h); }
  } else if (kind === "shafts") {
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 4; i++) {
      const x0 = ((i * 0.3 + 0.1 - me.bgX * 0.00005) % 1.3 + 1.3) % 1.3 * w - w * 0.15;
      const g = ctx.createLinearGradient(x0, 0, x0 + w * 0.2, h);
      g.addColorStop(0, "rgba(255,240,180,.14)"); g.addColorStop(1, "rgba(255,240,180,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + w * 0.08, 0); ctx.lineTo(x0 + w * 0.32, h); ctx.lineTo(x0 + w * 0.16, h); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#d9772f";
    for (let i = 0; i < 14; i++) {
      const p = P[i];
      p[1] += 0.002 + p[2] * 0.002; p[0] += Math.sin(t * 2 + i) * 0.002;
      if (p[1] > 1) { p[1] = 0; p[0] = Math.random(); }
      ctx.save(); ctx.translate(((p[0] % 1) + 1) % 1 * w, p[1] * h); ctx.rotate(t * 2 + i);
      ctx.fillRect(-4, -2, 8, 4); ctx.restore();
    }
  }
}

function drawDarkness(ctx, w, h, hz, glows, me) {
  // dark overlay with a headlamp cone, then additive glows
  const g = ctx.createRadialGradient(w / 2, h * 0.68, h * 0.06, w / 2, h * 0.55, h * 0.95);
  g.addColorStop(0, "rgba(5,10,30,0)"); g.addColorStop(0.45, "rgba(5,10,30,.35)"); g.addColorStop(1, "rgba(3,6,20,.82)");
  ctx.fillStyle = g; ctx.fillRect(-w * 0.2, -h * 0.2, w * 1.4, h * 1.4);
  ctx.globalCompositeOperation = "lighter";
  const beam = ctx.createLinearGradient(0, h * 0.85, 0, hz);
  beam.addColorStop(0, "rgba(255,240,190,.2)"); beam.addColorStop(1, "rgba(255,240,190,0)");
  ctx.fillStyle = beam;
  ctx.beginPath(); ctx.moveTo(w * 0.45, h * 0.85); ctx.lineTo(w * 0.55, h * 0.85); ctx.lineTo(w * 0.78, hz + h * 0.02); ctx.lineTo(w * 0.22, hz + h * 0.02); ctx.closePath(); ctx.fill();
  for (let [x, y, r, c] of glows) {
    if (r < 2) continue;
    r = Math.min(r, h * 0.35);
    const gg = ctx.createRadialGradient(x, y, 0, x, y, r);
    gg.addColorStop(0, rgba(c, 0.45)); gg.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = gg; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.globalCompositeOperation = "source-over";
}

function drawScreenFX(ctx, w, h, me, race, t) {
  // speed lines when boosting
  const sp = me.speed / 11000;
  if (me.boosting || me.padT > 0 || sp > 1.12) {
    ctx.strokeStyle = me.padT > 0 ? "rgba(140,255,240,.55)" : "rgba(255,255,255,.45)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * TAU + t * 0.7;
      const r0 = h * (0.55 + ((t * 3 + i * 0.37) % 1) * 0.4);
      const cx = w / 2, cy = h * 0.5;
      ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 0.7);
      ctx.lineTo(cx + Math.cos(a) * (r0 + h * 0.2), cy + Math.sin(a) * (r0 + h * 0.2) * 0.7);
    }
    ctx.stroke();
  }
  // damage flash
  if (me.flash > 0) {
    const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.25, w / 2, h / 2, h * 0.85);
    g.addColorStop(0, "rgba(255,40,40,0)"); g.addColorStop(1, `rgba(255,30,30,${me.flash * 0.5})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  // paint / sand splat blind
  if (me.blindT > 0) {
    const a = clamp(me.blindT / 1.2, 0, 1);
    ctx.fillStyle = rgba(me.blindCol || "#38e05a", 0.75 * a);
    const R = rng(7);
    for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(w * (0.15 + R() * 0.7), h * (0.15 + R() * 0.6), h * (0.08 + R() * 0.14), 0, TAU); ctx.fill(); }
  }
  // low health vignette
  if (me.hp / me.maxHp < 0.3 && me.wipeT <= 0) {
    const g = ctx.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, h * 0.9);
    g.addColorStop(0, "rgba(255,0,0,0)"); g.addColorStop(1, `rgba(200,0,0,${0.25 + Math.sin(t * 6) * 0.1})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
  // avalanche behind you
  if (race.avalanche) {
    const d = me.z - race.avalanche.z;
    if (d < 5000) {
      const a = clamp(1 - d / 5000, 0, 1);
      const g = ctx.createLinearGradient(0, h, 0, h * (1 - 0.5 * a));
      g.addColorStop(0, `rgba(255,255,255,${0.95 * a})`); g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g; ctx.fillRect(0, h * 0.4, w, h * 0.6);
    }
  }
}

/* ---------------- HUD ---------------- */
function hudText(ctx, txt, x, y, size, col, align = "left", stroke = "#14101c") {
  ctx.font = `${size}px Bangers, Impact, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  ctx.lineWidth = Math.max(3, size * 0.16); ctx.strokeStyle = stroke; ctx.lineJoin = "round";
  ctx.strokeText(txt, x, y); ctx.fillStyle = col; ctx.fillText(txt, x, y);
}
function ordinal(n) { return n + (n === 1 ? "st" : n === 2 ? "nd" : n === 3 ? "rd" : "th"); }

function drawHUD(ctx, w, h, me, race, t) {
  const u = Math.min(w, h * 1.6) / 100;      // HUD unit
  const pad = Math.max(10, u * 1.6) + (me.vpIndex === 0 ? race.safeL || 0 : 0);
  const padR = Math.max(10, u * 1.6) + (me.vpIndex === race.humans.length - 1 ? race.safeR || 0 : 0);
  const top = Math.max(8, u * 1.4) + (race.safeT || 0);
  // place
  hudText(ctx, String(me.place), pad, top + u * 7.4, u * 8.2, "#ffd23f");
  ctx.font = `${u * 3.4}px Bangers, Impact, sans-serif`;
  const pw = ctx.measureText(String(me.place)).width;
  hudText(ctx, ordinal(me.place).slice(-2) + " / " + race.riders.length, pad + pw + u * 4.5 + u * 0.6, top + u * 4.2, u * 3.2, "#fff");
  // health bar with portrait
  const bx = pad, by = top + u * 9.4, bw = u * 26, bh = u * 2.6;
  if (me.face) ctx.drawImage(me.face, bx, by - u * 0.6, u * 4.2, u * 4.2);
  const hx = bx + u * 4.8;
  ctx.fillStyle = "rgba(10,8,20,.6)"; roundRect(ctx, hx, by, bw, bh, bh / 2); ctx.fill();
  const hp = clamp(me.hpShow / me.maxHp, 0, 1);
  const hcol = hp > 0.55 ? "#2bd96a" : hp > 0.28 ? "#ffcf3a" : "#ff3b3b";
  ctx.fillStyle = hcol; roundRect(ctx, hx + 2, by + 2, (bw - 4) * hp, bh - 4, (bh - 4) / 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.fillRect(hx + bh / 2, by + 3, Math.max(0, (bw - 4) * hp - bh), (bh - 6) * 0.35);
  hudText(ctx, "HP", hx + bw + u * 0.8, by + bh * 0.9, u * 2.2, "#fff");
  // boost meter
  const my = by + bh + u * 1.1;
  ctx.fillStyle = "rgba(10,8,20,.6)"; roundRect(ctx, hx, my, bw, bh * 0.75, bh * 0.37); ctx.fill();
  const bm = clamp(me.boost / 100, 0, 1);
  const bg = ctx.createLinearGradient(hx, 0, hx + bw, 0); bg.addColorStop(0, "#2b9cff"); bg.addColorStop(1, me.boost >= 99 ? (Math.floor(t * 8) % 2 ? "#ffffff" : "#2bd9c5") : "#2bd9c5");
  ctx.fillStyle = bg; roundRect(ctx, hx + 2, my + 2, (bw - 4) * bm, bh * 0.75 - 4, (bh * 0.75 - 4) / 2); ctx.fill();
  hudText(ctx, "BOOST", hx + bw + u * 0.8, my + bh * 0.66, u * 1.8, "#bff6ff");
  // items
  const iy = my + bh + u * 1.0;
  for (let i = 0; i < 3; i++) {
    const ix = hx + i * u * 5.4;
    ctx.fillStyle = i < me.items.length ? "rgba(255,210,63,.25)" : "rgba(10,8,20,.45)";
    roundRect(ctx, ix, iy, u * 4.8, u * 4.8, u * 1.2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1.5; ctx.stroke();
    if (me.items[i]) ctx.drawImage(race.assets.items[me.items[i]], ix + u * 0.4, iy + u * 0.4, u * 4, u * 4);
  }
  // speed (bottom center-ish)
  const kmh = Math.round(me.speed / 11000 * 88);
  const sx = w / 2, sy = h - (race.touch ? u * 2.4 : u * 3);
  hudText(ctx, String(kmh), sx, sy, u * 6, me.boosting || me.padT > 0 ? "#2bd9c5" : "#fff", "center");
  hudText(ctx, "KM/H", sx + u * 6.2, sy, u * 2, "#ffd23f", "left");
  // progress bar (top center)
  const pbw = Math.min(w * 0.36, u * 46), pbx = w / 2 - pbw / 2, pby = top + u * 1.2;
  ctx.fillStyle = "rgba(10,8,20,.55)"; roundRect(ctx, pbx, pby, pbw, u * 1.4, u * 0.7); ctx.fill();
  const prog = (z) => clamp((z - race.track.startZ) / (race.track.finishZ - race.track.startZ), 0, 1);
  if (race.avalanche) { ctx.fillStyle = "#ffffff"; ctx.fillRect(pbx, pby, pbw * prog(race.avalanche.z), u * 1.4); }
  for (const r of race.riders) {
    if (r === me) continue;
    ctx.fillStyle = r.human ? (r.pIndex === 0 ? "#2bd9c5" : "#ff3d7f") : r.rider.main;
    ctx.beginPath(); ctx.arc(pbx + pbw * prog(r.z), pby + u * 0.7, u * 0.8, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#14101c"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(pbx + pbw * prog(me.z), pby + u * 0.7, u * 1.2, 0, TAU); ctx.fill(); ctx.stroke();
  hudText(ctx, "🏁", pbx + pbw + u * 1.2, pby + u * 1.5, u * 2.2, "#fff");
  // timer
  const tt = race.time;
  hudText(ctx, fmtTime(tt), w - padR - (race.touch && !race.split ? 46 : 0), top + u * 4.2, u * 3.4, "#fff", "right");
  if (race.avalanche) {
    const d = Math.max(0, Math.round((me.z - race.avalanche.z) / 40));
    hudText(ctx, "AVALANCHE " + d + "m", w / 2, pby + u * 5, u * 2.8, d < 60 ? (Math.floor(t * 6) % 2 ? "#ff3b3b" : "#fff") : "#d8ecff", "center");
  }
  if (race.stormWarn > 0) hudText(ctx, "SANDSTORM!", w / 2, pby + u * 5, u * 3.4, "#ffcf3a", "center");
  // incoming projectile warning (they come from behind the camera)
  for (const p of race.projs) {
    if (p.owner === me || p.dir < 0) continue;
    const dz = me.z - p.z;
    if (dz < 0 || dz > 3200 || Math.abs(p.x - me.x) > 0.7) continue;
    const ax = w / 2 + (p.x - me.camX) * w * 0.32, ay = h - u * 9 - (1 - dz / 3200) * u * 4;
    const a = 0.5 + 0.5 * Math.sin(t * 20);
    ctx.globalAlpha = 0.6 + a * 0.4;
    ctx.fillStyle = "#ff3b3b";
    ctx.beginPath(); ctx.moveTo(ax, ay - u * 3.4); ctx.lineTo(ax + u * 2.6, ay + u * 1.2); ctx.lineTo(ax - u * 2.6, ay + u * 1.2); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.stroke();
    hudText(ctx, "!", ax, ay + u * 0.6, u * 3, "#fff", "center", "#ff3b3b");
    ctx.globalAlpha = 1;
  }
  // trick / event popups
  let py = h * 0.3;
  for (const p of me.popups) {
    const a = clamp(p.t / 0.3, 0, 1) * clamp((p.life) / 0.4, 0, 1);
    ctx.globalAlpha = a;
    const s = u * (p.big ? 7 : 4.2) * (1 + Math.max(0, 0.3 - p.t) * 1.5);
    hudText(ctx, p.txt, w / 2, py, s, p.col || "#fff", "center");
    if (p.sub) hudText(ctx, p.sub, w / 2, py + s * 0.7, s * 0.5, "#ffd23f", "center");
    ctx.globalAlpha = 1;
    py += s * (p.sub ? 1.4 : 1.05);
  }
  // countdown
  if (race.countdown > 0) {
    const n = Math.ceil(race.countdown);
    const f = race.countdown % 1;
    hudText(ctx, String(n), w / 2, h * 0.5, u * (14 + f * 8), ["#2bd96a", "#ffd23f", "#ff8a1c", "#ff3b3b"][n] || "#fff", "center");
  } else if (race.time < 1) {
    hudText(ctx, "GO!", w / 2, h * 0.5, u * 16 * (1 + (1 - race.time) * 0.4), "#2bd96a", "center");
  }
  if (me.finished) {
    hudText(ctx, ordinal(me.place).toUpperCase() + " PLACE!", w / 2, h * 0.42, u * 9, me.place === 1 ? "#ffd23f" : "#fff", "center");
    hudText(ctx, fmtTime(me.finishTime), w / 2, h * 0.42 + u * 7, u * 4.2, "#bff6ff", "center");
  }
  if (me.wrongWay) hudText(ctx, "STAY ON THE TRAIL!", w / 2, h * 0.6, u * 4, "#ff8a1c", "center");
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ":" + (s < 10 ? "0" : "") + s.toFixed(2);
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ===== game.js =====
/* Race simulation: riders, physics, combat, items, AI. Runs at a fixed 60 Hz step. */

const BASE_SPEED = 11000;
const GRAV = 5200;
const CENT = 0.42;
const STEP = 1 / 60;

function riderVariant(r, dup) {
  if (!dup) return r;
  return Object.assign({}, r, {
    id: r.id, vid: r.id + "-shadow", name: "Shadow " + r.name, full: "Shadow " + r.full,
    main: shade(r.main, -0.55), alt: r.main, paint: shade(r.paint, -0.5), paint2: r.paint, num: r.num + 10, shadow: 1,
  });
}

function makeRiderEntity(rdef, vdef, opts) {
  const upg = opts.upg || [0, 0, 0];
  const e = {
    type: "rider", rider: rdef, veh: vdef, human: !!opts.human, pIndex: opts.pIndex ?? -1, vpIndex: opts.pIndex ?? -1,
    netId: opts.netId ?? null, remote: !!opts.remote,
    z: 0, x: 0, vx: 0, h: 0, vh: 0, speed: 0, lean: 0, tilt: 0, camX: 0, bgX: 0, pedal: 0,
    maxSpd: BASE_SPEED * vdef.max * rdef.spd * (1 + 0.03 * upg[0]),
    accel: BASE_SPEED * 0.3 * vdef.acc * rdef.acc,
    handling: vdef.grip * rdef.hdl * (1 + 0.06 * upg[1]),
    grip: vdef.grip * (1 + 0.06 * upg[1]),
    armor: clamp(vdef.armor + 0.08 * upg[2], -0.2, 0.6),
    mass: vdef.mass * (rdef.id === "bruno" ? 1.25 : rdef.id === "yuki" ? 0.8 : 1),
    pow: rdef.pow, trickMul: vdef.trick,
    maxHp: rdef.hp, hp: rdef.hp, hpShow: rdef.hp,
    boost: 20, items: [rdef.item, rdef.item], boosting: false, padT: 0, drafting: false,
    hurtT: 0, meleeImm: 0, atkT: 0, atkCD: 0, atkSide: 1, atkKick: false, comboN: 0, comboT: 0,
    invuln: 0, flash: 0, wobble: 0, blindT: 0, burnT: 0, shake: 0, fovKick: 0, wipeT: 0,
    trick: null, chain: 0, trickPts: 0, takedowns: 0, wipes: 0,
    finished: false, finishTime: 0, place: 0, popups: [], lastSeg: 0, lastPad: -99,
    ai: opts.human ? null : { skill: opts.skill || 0.85, aggr: 0.5 + Math.random() * 0.5, t: 0, tx: 0, inp: {} },
    sprites: null, face: null,
  };
  return e;
}

function popup(e, txt, col, big, sub) {
  if (!e.human) return;
  e.popups.unshift({ txt, col, big, sub, t: 0, life: big ? 1.6 : 1.1 });
  if (e.popups.length > 3) e.popups.length = 3;
}

/* ---------------- Race setup ---------------- */
async function createRace(cfg, onProgress) {
  const def = TRACKS.find((t) => t.id === cfg.trackId);
  const track = buildTrack(def);
  const biome = track.biome;
  onProgress && onProgress(0.2);
  const assets = await buildWorldSprites(biome);
  onProgress && onProgress(0.5);

  const riders = [];
  const used = {};
  let localIdx = 0;
  cfg.humans.forEach((hm, i) => {
    const r = RIDERS.find((x) => x.id === hm.riderId);
    const dup = used[r.id];
    used[r.id] = (used[r.id] || 0) + 1;
    const e = makeRiderEntity(riderVariant(r, dup), VEHICLES.find((v) => v.id === hm.vehId), { human: !hm.remote, remote: hm.remote, pIndex: i, upg: hm.upg, netId: hm.netId });
    e.human = true; e.local = !hm.remote; e.pIndex = hm.remote ? i : localIdx++; e.mark = i;
    e.name = hm.name || (cfg.humans.length > 1 ? (cfg.online ? (hm.remote ? "Friend" : "You") : "P" + (i + 1)) : "You");
    riders.push(e);
  });
  const total = cfg.total || 8;
  const R = rng(def.seed * 7 + (cfg.botSeed || 0));
  const pool = RIDERS.map((r) => r.id).sort(() => R() - 0.5);
  pool.sort((a, b) => (used[a] || 0) - (used[b] || 0));
  const biomeIdx = def.biome;
  const diff = cfg.difficulty ?? 1;
  for (let i = 0; riders.length < total; i++) {
    const rid = pool[i % pool.length];
    const r = RIDERS.find((x) => x.id === rid);
    const dup = used[rid];
    used[rid] = (used[rid] || 0) + 1;
    const v = VEHICLES[(R() * VEHICLES.length) | 0];
    const lvl = Math.min(3, Math.floor(biomeIdx * 0.6 + R() * 1.2));
    const skill = clamp([0.72, 0.84, 0.95][diff] + biomeIdx * 0.012 + (R() - 0.5) * 0.08, 0.6, 1.02);
    const e = makeRiderEntity(riderVariant(r, dup), v, { skill, upg: [lvl, lvl, lvl] });
    e.name = (dup ? "Shadow " : "") + r.name;
    riders.push(e);
  }
  // start grid: humans in the middle rows
  const order = riders.slice();
  const humans = order.filter((e) => e.human), bots = order.filter((e) => !e.human);
  const grid = bots.slice(0, 2).concat(humans, bots.slice(2));
  grid.forEach((e, i) => {
    e.z = track.startZ - (Math.floor(i / 2)) * 420 - 200;
    e.x = (i % 2 ? 0.42 : -0.42) + (i % 4 > 1 ? 0.1 : -0.1);
    e.camX = e.x;
    e.lastSeg = Math.floor(e.z / SEG);
  });
  // sprites (prebuilt per rider+vehicle)
  for (const e of riders) {
    const key = e.rider.vid || e.rider.id;
    if (!riderSpriteCache[key + ":" + e.veh.id]) {
      const out = {};
      await Promise.all(RIDER_POSES.map(async (pose) => {
        const p = pose.startsWith("ride") ? "ride" : pose;
        out[pose] = await svgToCanvas(riderBackSVG(e.rider, e.veh.id, p, pose === "ride1" ? 1 : 0), SPRITE_W, SPRITE_H);
      }));
      riderSpriteCache[key + ":" + e.veh.id] = out;
    }
    e.sprites = riderSpriteCache[key + ":" + e.veh.id];
    if (e.human) e.face = await faceIcon(e.rider);
  }
  onProgress && onProgress(1);

  const race = {
    cfg, track, assets, riders, humans: riders.filter((e) => e.human && e.local),
    projs: [], fx: [], buckets: {}, time: 0, countdown: 3.99, lastBeep: 4,
    split: cfg.humans.filter((h) => !h.remote).length > 1, over: false, overT: 0, finishOrder: [],
    avalanche: def.avalanche ? { z: track.startZ - 7000, speed: BASE_SPEED * 0.8 } : null,
    storm: def.storm ? { t: 14, on: 0 } : null, stormFog: 0, stormWarn: 0,
    touch: IS_TOUCH, events: [],
  };
  return race;
}

const faceCache = {};
async function faceIcon(r) {
  const key = r.vid || r.id;
  if (faceCache[key]) return faceCache[key];
  // crop the portrait head into a round icon
  const c = await svgToCanvas(portraitSVG(r), 150, 195);
  const out = makeCanvas(96, 96);
  const x = out.getContext("2d");
  x.beginPath(); x.arc(48, 48, 46, 0, TAU); x.fillStyle = r.main; x.fill(); x.save(); x.clip();
  x.drawImage(c, 75 - 62, 25 + 6, 124, 124, 0, 0, 96, 96); x.restore();
  x.lineWidth = 4; x.strokeStyle = "#fff"; x.beginPath(); x.arc(48, 48, 46, 0, TAU); x.stroke();
  faceCache[key] = out;
  return out;
}

/* ---------------- Simulation step ---------------- */
function stepRace(race, inputs, dt) {
  const tr = race.track;
  if (race.hold) { rebuildBuckets(race); return; }
  if (race.countdown > 0) {
    race.countdown -= dt;
    const n = Math.ceil(race.countdown);
    if (n < race.lastBeep) { race.lastBeep = n; race.events.push(n > 0 ? "beep" : "go"); }
    for (const e of race.riders) { e.hpShow = e.hp; updatePopups(e, dt); }
    rebuildBuckets(race);
    return;
  }
  race.time += dt;

  // hazards: avalanche & sandstorm
  if (race.avalanche) {
    const lead = Math.min(...race.riders.filter((e) => !e.finished).map((e) => e.z).concat([tr.finishZ]));
    race.avalanche.speed = BASE_SPEED * (0.7 + Math.min(0.12, race.time * 0.0012));
    race.avalanche.z += race.avalanche.speed * dt;
    race.avalanche.z = Math.max(race.avalanche.z, lead - 9000);
  }
  if (race.storm) {
    const s = race.storm;
    s.t -= dt;
    if (s.t <= 0) { s.on = !s.on; s.t = s.on ? 9 : 16 + Math.random() * 8; if (s.on) { race.stormWarn = 2; race.events.push("storm"); } }
    race.stormFog = lerp(race.stormFog, s.on ? 0.75 : 0, dt * 1.2);
    race.stormWarn = Math.max(0, race.stormWarn - dt);
  }

  // rubber-band reference = best local/remote human
  const humans = race.riders.filter((e) => e.human);
  const humanZ = humans.length ? Math.max(...humans.map((e) => e.z)) : 0;

  for (const e of race.riders) {
    if (e.remote) { remoteFollow(race, e, dt); continue; }
    let inp;
    if (e.human) inp = inputs[e.pIndex] || {};
    else inp = aiThink(race, e, dt, humanZ);
    if (e.finished && e.human) inp = Object.assign({}, aiThink(race, e, dt, humanZ), { attack: false, throwBack: false });
    updateRider(race, e, inp, dt);
  }
  riderCollisions(race);
  updateProjectiles(race, dt);
  updateFx(race, dt);
  // places
  const sorted = race.riders.slice().sort((a, b) => (a.finished && b.finished) ? a.finishTime - b.finishTime : a.finished ? -1 : b.finished ? 1 : b.z - a.z);
  sorted.forEach((e, i) => (e.place = i + 1));
  // end
  const localHumans = race.riders.filter((e) => e.human && e.local);
  if (!race.over && localHumans.length && localHumans.every((e) => e.finished)) { race.over = true; race.overT = 3.2; }
  if (race.over) race.overT -= dt;
  rebuildBuckets(race);
}

function rebuildBuckets(race) {
  const b = (race.buckets = {});
  const put = (e) => { const i = Math.floor(e.z / SEG); (b[i] || (b[i] = [])).push(e); };
  race.riders.forEach(put);
  race.projs.forEach(put);
  race.fx.forEach(put);
}

function updatePopups(e, dt) {
  for (const p of e.popups) { p.t += dt; p.life -= dt; }
  e.popups = e.popups.filter((p) => p.life > 0);
}

function updateRider(race, e, inp, dt) {
  const tr = race.track;
  // timers
  e.hurtT -= dt; e.atkT -= dt; e.atkCD -= dt; e.invuln -= dt; e.flash -= dt * 2; e.wobble -= dt;
  e.blindT -= dt; e.padT -= dt; e.meleeImm -= dt; e.shake = Math.max(0, e.shake - dt * 30); e.comboT -= dt;
  e.hpShow = lerp(e.hpShow, e.hp, Math.min(1, dt * 6));
  updatePopups(e, dt);
  if (e.burnT > 0) { e.burnT -= dt; damage(race, e, 5 * dt, null, "burn", true); }

  if (e.wipeT > 0) {
    e.wipeT -= dt;
    e.speed *= 1 - 1.8 * dt;
    e.z += e.speed * dt;
    e.h = Math.max(0, e.h - 2000 * dt);
    if (e.wipeT <= 0) respawn(race, e);
    camFollow(race, e, dt, { steer: 0 });
    return;
  }

  let seg = segAt(tr, e.z);
  const pct = e.speed / e.maxSpd;
  // ----- surfaces -----
  let surfMax = 1, slip = false;
  const sf = seg.surface;
  if (sf && e.h <= 0 && e.x >= sf.x0 && e.x <= sf.x1) {
    if (sf.type === "sand") { surfMax = 0.72; if (Math.random() < 0.3) spawnFx(race, e.z - 80, e.x + rnd(-0.1, 0.1), 40, "#f2cf91", 70, 0.6); }
    else if (sf.type === "mud") { surfMax = 0.68; if (Math.random() < 0.35) spawnFx(race, e.z - 60, e.x + rnd(-0.1, 0.1), 60, "#5a2e14", 60, 0.5); }
    else if (sf.type === "water") { surfMax = 0.76; if (Math.random() < 0.6) spawnFx(race, e.z - 40, e.x + rnd(-0.15, 0.15), 120, "#d8f1ff", 70, 0.5, 900); }
    else if (sf.type === "ice") slip = true;
    else if (sf.type === "lava") { damage(race, e, 14 * dt, null, "lava", true); e.burnT = Math.max(e.burnT, 0.8); spawnFx(race, e.z - 40, e.x, 60, "#ff7a1f", 60, 0.5, 600); }
  }
  const offroad = Math.abs(e.x) > seg.w + 0.03 || (seg.split > 0.4 && Math.abs(e.x) < 0.2 * seg.split);
  if (offroad && e.h <= 0) {
    surfMax *= 0.58;
    if (e.human) e.shake = Math.max(e.shake, 2 * pct);
    if (Math.random() < 0.4) spawnFx(race, e.z - 60, e.x + rnd(-0.1, 0.1), 50, tr.biome.ground[0], 80, 0.6);
  }
  e.wrongWay = offroad && Math.abs(e.x) > seg.w + 1.2 && e.human;

  // ----- speed -----
  let max = e.maxSpd * (0.72 + 0.28 * (e.hp / e.maxHp)) * surfMax;
  e.boosting = false;
  if (inp.boost && e.boost > 0.5 && !e.finished) { e.boosting = true; e.boost = Math.max(0, e.boost - 30 * dt); }
  const bonus = Math.max(e.boosting ? 0.28 : 0, e.padT > 0 ? 0.36 : 0) + (e.boosting && e.padT > 0 ? 0.06 : 0);
  max *= 1 + bonus;
  if (e.drafting) { max *= 1.04; e.boost = Math.min(100, e.boost + 8 * dt); }
  if (e.finished) max *= 0.7;
  let accel = e.accel * (e.boosting || e.padT > 0 ? 2.4 : 1);
  const drifting = !!inp.brake && Math.abs(inp.steer || 0) > 0.35 && pct > 0.4 && e.h <= 0;
  if (inp.brake) e.speed -= BASE_SPEED * (drifting ? 0.18 : 0.9) * dt;
  if (e.speed < max) e.speed = Math.min(max, e.speed + accel * dt * (1 - Math.min(0.8, pct * 0.35)));
  else e.speed -= (e.speed - max) * 2.2 * dt;
  if (e.speed < 0) e.speed = 0;
  if (drifting) {
    e.boost = Math.min(100, e.boost + 11 * dt);
    if (Math.random() < 0.5) spawnFx(race, e.z - 30, e.x + rnd(-0.08, 0.08), 30, "#ffd36b", 30, 0.25, 200);
  }
  e.fovKick = lerp(e.fovKick, e.boosting || e.padT > 0 ? 1 : 0, dt * 4);

  // ----- steering -----
  const steer = clamp(inp.steer || 0, -1, 1) * (e.blindT > 0 && !e.human ? 0.4 : 1);
  const rate = 2.15 * e.handling * (drifting ? 1.5 : 1) * (e.h > 0 ? 0.55 : 1) * (0.4 + 0.6 * Math.min(1, pct * 1.5));
  const gripK = e.h > 0 ? 2.5 : slip ? 1.2 : 9 * e.grip;
  e.vx += (steer * rate - e.vx) * Math.min(1, gripK * dt);
  e.x += e.vx * dt;
  if (e.h <= 0) e.x -= CENT * pct * pct * seg.curve * dt * (slip ? 1.35 : 1) * (drifting ? 0.5 : 1);
  e.x = clamp(e.x, -(seg.w + 2.4), seg.w + 2.4);
  e.lean = lerp(e.lean, steer * (drifting ? 1.25 : 0.8) + (e.vx - steer * rate) * 0.08, Math.min(1, dt * 8));

  // ----- air & tricks -----
  if (e.h > 0 || e.vh > 0) {
    e.vh -= GRAV * dt;
    e.h += e.vh * dt;
    if (inp.trick && !e.trick && e.h > 120) {
      const def = TRICKS[(inp.trick - 1) % TRICKS.length];
      e.trick = { def, t: 0, dur: def.dur / e.trickMul };
      race.events.push({ snd: "whoosh", e });
    }
    if (e.trick) {
      e.trick.t += dt;
      if (e.trick.t >= e.trick.dur) {
        const pts = Math.round(e.trick.def.pts * (1 + e.chain * 0.5));
        e.trickPts += pts; e.chain++;
        e.boost = Math.min(100, e.boost + pts / 9);
        popup(e, e.trick.def.name.toUpperCase() + (e.chain > 1 ? " x" + e.chain : ""), "#2bd9c5", false, "+" + pts);
        race.events.push({ snd: "trick", e });
        e.trick = null;
      }
    }
    if (e.h <= 0) land(race, e);
  }

  // ----- track features crossed this frame -----
  const prevSeg = e.lastSeg;
  e.z += e.speed * dt;
  e.pedal += dt * (2 + pct * 7);
  const curSeg = Math.floor(e.z / SEG);
  for (let i = prevSeg + 1; i <= curSeg; i++) {
    const s = tr.segs[i];
    if (!s) continue;
    if (e.h <= 0 && s.ramp) for (const r of s.ramp) if (Math.abs(e.x - r.x) < 0.3) { launch(race, e, 1700 + e.speed * 0.22); break; }
    if (e.h <= 0 && s.vent && Math.abs(e.x - s.vent.x) < 0.32) { launch(race, e, 3600); for (let k = 0; k < 14; k++) spawnFx(race, s.i * SEG, s.vent.x + rnd(-0.2, 0.2), 120 + Math.random() * 120, "#f0f0f0", 40 + k * 60, 1.2, 1400); }
    if (e.h < 380 && e.invuln <= 0) collideSprites(race, e, s);
    for (const o of s.objs) {
      if (o.taken > race.time || Math.abs(e.x - o.x) > 0.34 || e.h > 1100) continue;
      o.taken = race.time + 6;
      if (race.net && !e.remote) race.net.send({ t: "ev", k: "take", s: s.i, o: s.objs.indexOf(o) });
      if (o.kind === "crate") {
        if (e.items.length < 3) e.items.push(Math.random() < 0.25 ? e.rider.item : tr.biome.item);
        popup(e, "+ " + ITEMS[e.items[e.items.length - 1]].name.toUpperCase(), "#ffd23f");
        race.events.push({ snd: "pickup", e });
      } else {
        e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.4);
        popup(e, "REPAIRED!", "#2bd96a");
        race.events.push({ snd: "repair", e });
      }
    }
  }
  seg = segAt(tr, e.z);
  const d = seg.decal;
  if (d && d.type === "boost" && e.h <= 0 && e.x >= d.x0 - 0.05 && e.x <= d.x1 + 0.05 && seg.i - d.k !== e.lastPad) {
    e.lastPad = seg.i - d.k; e.padT = 1.4; e.boost = Math.min(100, e.boost + 5);
    race.events.push({ snd: "pad", e });
  }
  e.lastSeg = curSeg;

  // ----- combat -----
  if (inp.attack && e.atkCD <= 0 && e.h <= 0 && !e.finished) attack(race, e);
  if (inp.throwBack && e.atkCD <= 0 && e.items.length && !e.finished) { throwItem(race, e, -1); e.atkCD = 0.4; }

  // ----- avalanche -----
  if (race.avalanche && e.z < race.avalanche.z + 250 && !e.finished) {
    damage(race, e, 18 * dt, null, "avalanche", true);
    e.speed = Math.min(e.speed, e.maxSpd * 0.6);
    if (Math.random() < 0.5) spawnFx(race, e.z - 100, e.x + rnd(-0.4, 0.4), 100, "#ffffff", 120, 0.6, 400);
  }

  // finish
  if (!e.finished && e.z >= tr.finishZ) {
    e.finished = true; e.finishTime = race.time; race.finishOrder.push(e);
    e.trick = null;
    race.events.push({ snd: "finish", e });
  }
  if (e.z > tr.length - SEG * 160) e.speed = Math.min(e.speed, e.maxSpd * 0.4);

  camFollow(race, e, dt, { steer });
}

function camFollow(race, e, dt, inp) {
  if (!e.human && !e.cam) return;
  const seg = segAt(race.track, e.z);
  e.camX = lerp(e.camX, e.x * 0.82, Math.min(1, dt * 7));
  e.tilt = lerp(e.tilt, -(inp.steer || 0) * 0.03 - seg.curve * 0.0045 * (e.speed / e.maxSpd), Math.min(1, dt * 3));
  e.bgX += seg.curve * (e.speed / BASE_SPEED) * dt * 160;
}

function launch(race, e, vh) {
  e.vh = vh; e.h = 1; e.chain = 0;
  race.events.push({ snd: "jump", e });
}

function land(race, e) {
  const fall = -e.vh;
  e.h = 0; e.vh = 0;
  if (e.trick) {
    const p = e.trick.t / e.trick.dur;
    e.trick = null;
    if (p < 0.72) {
      damage(race, e, 18, null, "crash");
      e.speed *= 0.4; e.hurtT = 0.9; e.wobble = 1; e.chain = 0;
      popup(e, "BAILED!", "#ff3b3b", true);
      race.events.push({ snd: "crash", e });
      return;
    }
    popup(e, "SKETCHY!", "#ffcf3a");
  }
  if (e.chain > 0) {
    popup(e, e.chain > 2 ? "INSANE COMBO!" : e.chain > 1 ? "CLEAN COMBO!" : "CLEAN LANDING!", "#ffd23f", e.chain > 1);
    e.padT = Math.max(e.padT, 0.5 + e.chain * 0.25);
    e.chain = 0;
  }
  if (e.human) e.shake = Math.min(10, fall / 400);
  race.events.push({ snd: "land", e });
}

function collideSprites(race, e, s) {
  const assets = race.assets;
  const rHalf = (e.veh.w / ROAD_W) * 0.28;
  for (const sp of s.sprites) {
    if (sp.flat || sp.dead || sp.gate) continue;
    const S = assets.sprites[sp.id];
    if (!S || (!S.solid && !S.obstacle)) continue;
    const half = (S.ww / ROAD_W) * 0.5 * (S.obstacle === "log" ? 0.92 : 0.5);
    if (Math.abs(e.x - sp.x) > half + rHalf) continue;
    if (S.obstacle === "small") {
      sp.dead = true;
      damage(race, e, 5, null, "crash");
      e.speed *= 0.85;
      for (let k = 0; k < 8; k++) spawnFx(race, e.z + 100, sp.x + rnd(-0.15, 0.15), 60 + Math.random() * 100, "#a0783c", 60, 0.7, 700);
      race.events.push({ snd: "bump", e });
      continue;
    }
    damage(race, e, 10 + (e.speed / BASE_SPEED) * 8, null, "crash");
    e.speed *= 0.32;
    const dir = e.x < sp.x ? -1 : 1;
    e.x = sp.x + dir * (half + rHalf + 0.02);
    e.vx = dir * 2.2;
    e.hurtT = 0.7; e.wobble = 1; e.invuln = 0.7;
    if (e.human) e.shake = 12;
    for (let k = 0; k < 10; k++) spawnFx(race, e.z + 60, e.x + rnd(-0.2, 0.2), 80 + Math.random() * 200, "#d9c8a8", 60, 0.7, 900);
    race.events.push({ snd: "crash", e });
    return;
  }
}

function damage(race, e, amt, by, kind, silent) {
  if (e.wipeT > 0 || e.finished) return;
  if (e.remote) {
    // the owner of that rider applies damage on their own device
    if (race.net && (kind === "melee" || kind === "bump")) race.net.queueHit(e, amt, by, kind);
    return;
  }
  if (e.invuln > 0 && (kind === "melee" || kind === "item" || kind === "crash")) return;
  if (kind === "melee") { if (e.meleeImm > 0) return; e.meleeImm = 0.38; }
  // bots hit humans a bit softer (scaled by difficulty) so a good rider isn't ganged into constant wipeouts
  if (by && !by.human && e.human) amt *= [0.6, 0.78, 0.95][race.cfg.difficulty ?? 1];
  e.hp -= amt * (1 - e.armor);
  if (!silent) { e.flash = 1; e.hurtT = Math.max(e.hurtT, 0.35); e.wobble = Math.max(e.wobble, 0.5); }
  if (e.hp <= 0) {
    e.hp = 0; e.wipeT = 1.8; e.trick = null; e.wipes++; e.vh = 0;
    popup(e, "WIPEOUT!", "#ff3b3b", true);
    race.events.push({ snd: "wipe", e });
    if (by) {
      by.takedowns++;
      by.boost = Math.min(100, by.boost + 35);
      popup(by, "TAKEDOWN!", "#ff3d7f", true, "+40 coins");
    }
  }
}

function respawn(race, e) {
  const seg = segAt(race.track, e.z);
  e.hp = Math.round(e.maxHp * 0.65); e.invuln = 2; e.speed = e.maxSpd * 0.5;
  if (race.avalanche && race.avalanche.z > e.z - 2500) race.avalanche.z = e.z - 4000;
  e.x = clamp(e.x, -seg.w * 0.7, seg.w * 0.7); e.vx = 0; e.h = 0; e.vh = 0;
  if (seg.split > 0.3 && Math.abs(e.x) < 0.3) e.x = e.x < 0 ? -0.8 : 0.8;
}

function attack(race, e) {
  let best = null, bd = 1e9;
  for (const o of race.riders) {
    if (o === e || o.wipeT > 0 || o.finished || o.h > 500) continue;
    const dz = Math.abs(o.z - e.z), dx = Math.abs(o.x - e.x);
    if (dz < 320 && dx < 0.58) { const d = dz + dx * 500; if (d < bd) { bd = d; best = o; } }
  }
  if (best) {
    const side = best.x === e.x ? (Math.random() < 0.5 ? -1 : 1) : sign(best.x - e.x);
    e.comboN = e.comboT > 0 ? e.comboN + 1 : 1;
    e.comboT = 1.5;
    const kick = e.comboN % 3 === 0;
    e.atkSide = side; e.atkKick = kick; e.atkT = 0.3; e.atkCD = kick ? 0.6 : 0.42;
    if (race.net && best.remote) race.net.hitInfo = { slow: kick ? 0.72 : 0.9, push: side * (kick ? 3.2 : 1.4) * Math.min(2, e.mass / best.mass) };
    damage(race, best, (kick ? 17 : 9) * e.pow, e, "melee");
    best.speed *= kick ? 0.72 : 0.9;
    best.vx += side * (kick ? 3.2 : 1.4) * Math.min(2, e.mass / best.mass);
    best.hurtT = Math.max(best.hurtT, 0.45);
    if (best.human) best.shake = kick ? 10 : 5;
    for (let k = 0; k < 6; k++) spawnFx(race, best.z, best.x - side * 0.1 + rnd(-0.05, 0.05), 500 + Math.random() * 200, "#fff6a8", 40, 0.3, 300);
    race.events.push({ snd: kick ? "kick" : "punch", e, target: best });
    if (e.human) popup(e, kick ? "KICK!" : "POW!", kick ? "#ff8a1c" : "#fff");
  } else if (e.items.length) {
    throwItem(race, e, 1);
    e.atkT = 0.22; e.atkKick = false; e.atkSide = 1; e.atkCD = 0.4;
  } else {
    e.atkSide = -e.atkSide; e.atkKick = false; e.atkT = 0.25; e.atkCD = 0.35;
    race.events.push({ snd: "swing", e });
  }
}

let projSeq = 0;
function throwItem(race, e, dir) {
  const id = e.items.shift();
  spawnProjectiles(race, e, id, dir, e.z, e.x, e.speed, null);
  if (race.net) race.net.send({ t: "ev", k: "throw", i: race.riders.indexOf(e), item: id, dir, z: e.z, x: e.x, sp: e.speed, id: race.lastProjId });
}
function spawnProjectiles(race, e, id, dir, z, x, sp, netId) {
  const it = ITEMS[id];
  const n = it.spread || 1;
  const base = netId || (race.net ? race.net.role + ":" : "") + (++projSeq);
  race.lastProjId = base;
  for (let k = 0; k < n; k++) {
    race.projs.push({
      type: "proj", item: id, owner: e, z: z + dir * 160, x: x + (n > 1 ? (k - 1) * 0.3 : 0), h: 320, id: base + "/" + k,
      vz: dir > 0 ? sp + it.spd : sp * 0.35, vx: n > 1 ? (k - 1) * 0.5 : 0, life: dir > 0 ? 2.6 : 6, dir, big: id === "boulder",
    });
  }
  race.events.push({ snd: "throw", e });
}

function updateProjectiles(race, dt) {
  const keep = [];
  for (const p of race.projs) {
    p.life -= dt;
    const it = ITEMS[p.item];
    if (it.home && p.dir > 0) {
      let tgt = null, bd = 4000;
      for (const o of race.riders) if (o !== p.owner && o.wipeT <= 0 && o.z > p.z && o.z - p.z < bd) { bd = o.z - p.z; tgt = o; }
      if (tgt) p.vx = lerp(p.vx, (tgt.x - p.x) * 2.5, dt * 4);
    }
    p.z += p.vz * dt; p.x += p.vx * dt;
    p.h = p.dir > 0 ? 300 + Math.sin(p.life * 6) * 40 : Math.max(120, p.h - 400 * dt);
    let hit = false;
    for (const o of race.riders) {
      if (o === p.owner || o.wipeT > 0 || o.finished || o.h > 700 || o.remote) continue;
      if (Math.abs(o.z - p.z) < 200 && Math.abs(o.x - p.x) < 0.3) {
        if (o.invuln > 0) { hit = true; break; }
        damage(race, o, it.dmg, p.owner, "item");
        o.speed *= it.slow; o.hurtT = Math.max(o.hurtT, 0.5);
        if (it.burn) o.burnT = 2.4;
        if (it.blind) { o.blindT = 1.6; o.blindCol = it.col; }
        if (o.human) o.shake = 7;
        for (let k = 0; k < 10; k++) spawnFx(race, p.z, p.x + rnd(-0.2, 0.2), p.h + rnd(-100, 100), it.col, 50, 0.5, 600);
        race.events.push({ snd: "hit", e: o, by: p.owner });
        if (p.owner.human) popup(p.owner, "DIRECT HIT!", "#ffd23f");
        if (race.net) race.net.send({ t: "ev", k: "pop", id: p.id, v: race.riders.indexOf(o) });
        hit = true; break;
      }
    }
    if (!hit && p.life > 0 && Math.abs(p.x) < 3 && p.z < race.track.length) keep.push(p);
  }
  race.projs = keep;
}

function riderCollisions(race) {
  const rs = race.riders;
  for (let i = 0; i < rs.length; i++) {
    const a = rs[i];
    if (a.wipeT > 0) { a.drafting = false; continue; }
    a.drafting = false;
    for (let j = 0; j < rs.length; j++) {
      if (i === j) continue;
      const b = rs[j];
      if (b.wipeT > 0) continue;
      const dz = b.z - a.z, dx = b.x - a.x;
      if (dz > 150 && dz < 1100 && Math.abs(dx) < 0.25 && a.h <= 0) a.drafting = true;
      if (j < i) continue;
      const minDx = ((a.veh.w + b.veh.w) / 2 / ROAD_W) * 0.38;
      if (Math.abs(dz) < 140 && Math.abs(dx) < minDx && Math.abs(a.h - b.h) < 300) {
        const ov = minDx - Math.abs(dx);
        const tot = a.mass + b.mass;
        const s = dx === 0 ? 1 : sign(dx);
        a.x -= s * ov * (b.mass / tot); b.x += s * ov * (a.mass / tot);
        a.vx -= s * 0.8 * (b.mass / tot); b.vx += s * 0.8 * (a.mass / tot);
        const back = dz > 0 ? a : b, front = dz > 0 ? b : a;
        if (back.speed > front.speed) back.speed = front.speed * 0.98;
        if (back.veh.id === "atv" && front.mass < back.mass) { front.speed *= 0.97; damage(race, front, 0.3, null, "bump", true); }
        if ((a.human || b.human) && Math.random() < 0.08) race.events.push({ snd: "bump", e: a.human ? a : b });
      }
    }
  }
}

function spawnFx(race, z, x, h, col, size, life, vh = 0) {
  if (race.fx.length > 220) return;
  race.fx.push({ type: "fx", z, x, h, col, size, life, max: life, vh, vx: rnd(-0.3, 0.3) });
}
function updateFx(race, dt) {
  for (const f of race.fx) { f.life -= dt; f.h += f.vh * dt; f.vh -= 1800 * dt; if (f.h < 0) { f.h = 0; f.vh = 0; } f.x += f.vx * dt; }
  race.fx = race.fx.filter((f) => f.life > 0);
}

/* ---------------- AI ---------------- */
function aiThink(race, e, dt, humanZ) {
  const ai = e.ai || (e.ai = { skill: 0.9, aggr: 0.5, t: 0, tx: 0, inp: {} });
  const inp = ai.inp;
  inp.attack = false; inp.trick = 0; inp.throwBack = false; inp.boost = false; inp.brake = false;
  const tr = race.track;
  const segI = Math.floor(e.z / SEG);
  const seg = tr.segs[segI] || tr.segs[tr.N - 1];
  // rubber band (bots only)
  if (!e.human && !race.cfg.noRubber) {
    const gap = e.z - humanZ;
    const rb = clamp(1 - gap / 28000, 0.88, 1.1);
    const base = BASE_SPEED * e.veh.max * e.rider.spd;
    e.maxSpd = base * (0.86 + 0.14 * ai.skill) * rb;
  }
  ai.t -= dt;
  if (ai.t <= 0) { ai.t = 0.16 + Math.random() * 0.12; ai.tx = chooseLine(race, e, segI); }
  const ahead = tr.segs[Math.min(tr.N - 1, segI + 10)];
  const pct = e.speed / e.maxSpd;
  let steer = (ai.tx - e.x) * 3.4 + ahead.curve * pct * pct * 0.07;
  inp.steer = clamp(steer, -1, 1);
  // brake into hard curves when wide
  const far = tr.segs[Math.min(tr.N - 1, segI + 22)];
  if (Math.abs(far.curve) > 4 && pct > 0.85 && sign(e.x) === -sign(far.curve) && Math.abs(e.x) > 0.6) inp.brake = Math.random() < 0.6;
  if (e.finished) return inp;
  // boost on straights
  if (e.boost > 55 && Math.abs(ahead.curve) < 2 && Math.random() < ai.skill * 0.08) ai.boosting = 1.4;
  if (ai.boosting > 0) { ai.boosting -= dt; inp.boost = e.boost > 2; }
  // combat — pick the nearest candidate (never biased toward humans)
  if (race.time > 3) {
    let mel = null, md = 1e9, ahead = null, ad = 1e9, behind = null, bd = 1e9;
    for (const o of race.riders) {
      if (o === e || o.wipeT > 0 || o.finished) continue;
      const dz = o.z - e.z, dx = Math.abs(o.x - e.x);
      if (Math.abs(dz) < 300 && dx < 0.55) { const d = Math.abs(dz) + dx * 400; if (d < md) { md = d; mel = o; } }
      else if (dz > 300 && dz < 2600 && dx < 0.3 && dz < ad) { ad = dz; ahead = o; }
      else if (dz < -200 && dz > -1200 && dx < 0.3 && -dz < bd) { bd = -dz; behind = o; }
    }
    if (mel && e.atkCD <= 0 && mel.meleeImm <= 0 && Math.random() < ai.aggr * dt * 2.4) inp.attack = true;
    else if (!mel && ahead && e.items.length && Math.random() < ai.skill * dt * 1.0) inp.attack = true;
    else if (behind && e.items.length && Math.random() < ai.skill * dt * 0.6) inp.throwBack = true;
  }
  // tricks in the air
  if (e.h > 150 && !e.trick && e.vh > 600 && Math.random() < ai.skill * 0.12) inp.trick = 1 + ((Math.random() * 4) | 0);
  return inp;
}

function chooseLine(race, e, segI) {
  const tr = race.track, ai = e.ai, skill = ai.skill;
  const segs = tr.segs;
  const look = tr.segs[Math.min(tr.N - 1, segI + 14)];
  const w = look.w;
  const racing = sign(look.curve) * Math.min(0.5, Math.abs(look.curve) * 0.1);
  let bestX = e.x, bestC = 1e9;
  const rHalf = (e.veh.w / ROAD_W) * 0.28;
  for (let c = -4; c <= 4; c++) {
    const cx = (c / 4) * 0.82 * w;
    let cost = Math.abs(cx - racing) * 0.6 + Math.abs(cx - e.x) * 0.35;
    for (let i = segI + 2; i < segI + 34; i++) {
      const s = segs[i];
      if (!s) break;
      const near = 1 - (i - segI) / 36;
      if (s.split > 0.2 && Math.abs(cx) < 0.3 * s.split + rHalf) cost += 6 * near;
      for (const sp of s.sprites) {
        if (sp.flat || sp.dead || sp.gate) continue;
        const S = race.assets.sprites[sp.id];
        if (!S || (!S.solid && !S.obstacle)) continue;
        if (Math.abs(sp.x) > s.w + 0.4) continue;
        const half = (S.ww / ROAD_W) * 0.5 * (S.obstacle === "log" ? 0.92 : 0.5);
        if (Math.abs(cx - sp.x) < half + rHalf + 0.12) cost += 7 * near * (0.6 + skill * 0.4);
      }
      if (s.surface && cx >= s.surface.x0 && cx <= s.surface.x1) cost += (s.surface.type === "lava" ? 4 : 0.8) * near * skill;
      if (s.decal && s.decal.type === "boost" && cx >= s.decal.x0 && cx <= s.decal.x1) cost -= 1.4 * near * skill;
      if (s.ramp) for (const r of s.ramp) if (Math.abs(cx - r.x) < 0.25) cost -= 0.9 * near * skill;
      for (const o of s.objs) if (!(o.taken > race.time) && Math.abs(cx - o.x) < 0.3) cost -= (o.kind === "crate" ? (e.items.length < 3 ? 1 : 0) : (1 - e.hp / e.maxHp) * 3) * near * skill;
      if (Math.abs(cx) > s.w) cost += 3 * near;
    }
    // avoid riding right behind someone when holding no item (they might throw back) — light spacing
    cost += (Math.random() - 0.5) * (1.1 - skill) * 1.2;
    if (cost < bestC) { bestC = cost; bestX = cx; }
  }
  return bestX;
}

/* Remote riders (online): smoothly follow the last received network state. */
function remoteFollow(race, e, dt) {
  const n = e.net;
  if (!n) return;
  n.age += dt;
  const tz = n.z + n.speed * n.age;
  e.z = lerp(e.z, tz, Math.min(1, dt * 10));
  e.x = lerp(e.x, n.x, Math.min(1, dt * 10));
  e.h = n.h; e.speed = n.speed; e.lean = n.lean; e.hp = n.hp; e.boost = n.boost;
  e.boosting = n.boosting; e.padT = n.padT; e.wipeT = n.wipeT; e.atkT = n.atkT; e.atkSide = n.atkSide; e.atkKick = n.atkKick;
  e.trick = n.trick ? { def: TRICKS.find((t) => t.id === n.trick), t: n.trickT, dur: 1 } : null;
  e.hurtT = n.hurtT; e.finished = n.finished; e.finishTime = n.finishTime;
  e.pedal += dt * (2 + (e.speed / e.maxSpd) * 7);
  e.lastSeg = Math.floor(e.z / SEG);
}

// ===== input.js =====
/* Touch + keyboard input. Builds per-player input snapshots and draws the on-screen controls. */

const Input = {
  players: [mkPlayerInput(), mkPlayerInput()],
  touches: {},
  layout: null,       // computed per frame from canvas size + mode
  keys: {},
  enabled: false,
  split: false,
  onPause: null,
};

function mkPlayerInput() {
  return { steer: 0, touchSteer: 0, brake: false, boost: false, attackQ: 0, backQ: 0, trickQ: 0, steerTouch: null, anchor: null, knob: null, btn: {} };
}

function computeLayout(W, H, split, safe) {
  const L = { W, H, split, players: [] };
  const n = split ? 2 : 1;
  for (let p = 0; p < n; p++) {
    const x0 = split ? (p * W) / 2 : 0, w = split ? W / 2 : W;
    const R = clamp(Math.min(w * 0.085, H * 0.12), 30, 62);
    const pad = Math.max(14, R * 0.35);
    const sr = p === n - 1 ? safe.r : 0, sl = p === 0 ? safe.l : 0;
    const atk = { x: x0 + w - pad - R * 1.15 - sr, y: H - pad - R * 1.15 - safe.b, r: R * 1.15 };
    const bst = { x: atk.x - R * 0.35, y: atk.y - R * 2.55, r: R * 0.92 };
    const brk = { x: atk.x - R * 2.45, y: atk.y + R * 0.2, r: R * 0.85 };
    L.players.push({
      x0, w, R, atk, bst, brk,
      steerZone: { x: x0 + sl, y: H * 0.22, w: w * 0.48, h: H * 0.78 },
      ghost: { x: x0 + sl + pad + R * 1.5, y: H - pad - R * 1.5 - safe.b },
      steerRange: R * 1.15,
    });
  }
  L.pause = split ? { x: W / 2, y: H - 26 - safe.b, r: 20 } : { x: W - 30 - safe.r, y: 26 + safe.t, r: 20 };
  return L;
}

function hitBtn(b, x, y, k = 1.3) { const dx = x - b.x, dy = y - b.y; return dx * dx + dy * dy < (b.r * k) * (b.r * k); }

function touchRole(x, y) {
  const L = Input.layout;
  if (!L) return null;
  if (hitBtn(L.pause, x, y, 1.6)) return { role: "pause" };
  for (let p = 0; p < L.players.length; p++) {
    const P = L.players[p];
    if (x < P.x0 || x > P.x0 + P.w) continue;
    if (hitBtn(P.atk, x, y)) return { role: "atk", p };
    if (hitBtn(P.bst, x, y)) return { role: "bst", p };
    if (hitBtn(P.brk, x, y)) return { role: "brk", p };
    const z = P.steerZone;
    if (x >= z.x && x <= z.x + z.w && y >= z.y) return { role: "steer", p };
    if (x > z.x + z.w) return { role: "swipe", p };
  }
  return null;
}

function initInput(canvas) {
  const pt = (t) => { const r = canvas.getBoundingClientRect(); return [t.clientX - r.left, t.clientY - r.top]; };
  const start = (e) => {
    if (!Input.enabled) return;
    e.preventDefault();
    SFX.unlock();
    for (const t of e.changedTouches) {
      const [x, y] = pt(t);
      const role = touchRole(x, y);
      if (!role) continue;
      Input.touches[t.identifier] = Object.assign(role, { sx: x, sy: y, x, y, t0: now() });
      const P = Input.players[role.p];
      if (role.role === "pause") Input.onPause && Input.onPause();
      if (role.role === "steer") { P.anchor = [x, y]; P.knob = [x, y]; P.steerTouch = t.identifier; }
      if (role.role === "bst") P.boost = true;
      if (role.role === "brk") P.brake = true;
      if (role.role === "atk") P.btn.atk = true;
    }
  };
  const move = (e) => {
    if (!Input.enabled) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const T = Input.touches[t.identifier];
      if (!T) continue;
      const [x, y] = pt(t);
      T.x = x; T.y = y;
      if (T.role === "steer") {
        const P = Input.players[T.p], range = Input.layout.players[T.p].steerRange;
        let dx = x - P.anchor[0];
        if (Math.abs(dx) > range * 1.4) { P.anchor[0] = x - sign(dx) * range * 1.4; dx = sign(dx) * range * 1.4; }
        P.knob = [x, y];
        P.touchSteer = clamp(dx / range, -1, 1);
      }
    }
  };
  const end = (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const T = Input.touches[t.identifier];
      if (!T) continue;
      delete Input.touches[t.identifier];
      const P = Input.players[T.p];
      if (!P) continue;
      if (T.role === "steer") { P.touchSteer = 0; P.anchor = null; P.knob = null; P.steerTouch = null; }
      if (T.role === "bst") P.boost = Object.values(Input.touches).some((o) => o.role === "bst" && o.p === T.p);
      if (T.role === "brk") P.brake = Object.values(Input.touches).some((o) => o.role === "brk" && o.p === T.p);
      if (T.role === "atk" || T.role === "swipe") {
        P.btn.atk = false;
        const dx = T.x - T.sx, dy = T.y - T.sy, dist = Math.hypot(dx, dy);
        const air = Input.airborne && Input.airborne[T.p];
        if (dist > 26) {
          // swipe: in the air picks a trick; on the ground a downward swipe throws backward
          let trick = Math.abs(dx) > Math.abs(dy) ? 3 : dy < 0 ? 2 : 4;
          if (air) P.trickQ = trick;
          else if (dy > 20 && Math.abs(dy) > Math.abs(dx)) P.backQ++;
          else if (T.role === "atk") P.attackQ++;
        } else if (T.role === "atk") {
          if (air) P.trickQ = 1; else P.attackQ++;
        } else if (air) P.trickQ = 1;
      }
    }
  };
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end, { passive: false });
  canvas.addEventListener("touchcancel", end, { passive: false });

  // keyboard (desktop / iPad keyboard)
  const KEYMAP = {
    // P1
    KeyA: [0, "left"], KeyD: [0, "right"], KeyW: [0, "up"], KeyS: [0, "brake"], KeyF: [0, "atk"], KeyG: [0, "boost"], Space: [0, "atk"], ShiftLeft: [0, "boost"],
    // P2 (or P1 in single player)
    ArrowLeft: [1, "left"], ArrowRight: [1, "right"], ArrowUp: [1, "up"], ArrowDown: [1, "brake"], KeyL: [1, "atk"], KeyK: [1, "boost"], Enter: [1, "atk"], ShiftRight: [1, "boost"],
  };
  window.addEventListener("keydown", (e) => {
    if (e.code === "Escape" || e.code === "KeyP") { Input.onPause && Input.enabled && Input.onPause(); return; }
    const m = KEYMAP[e.code];
    if (!m || !Input.enabled) return;
    e.preventDefault();
    SFX.unlock();
    const p = Input.split ? m[0] : 0;
    if (Input.keys[e.code]) return;
    Input.keys[e.code] = true;
    const P = Input.players[p];
    if (m[1] === "atk") {
      const air = Input.airborne && Input.airborne[p];
      const k = Input.keys;
      const up = k.KeyW || k.ArrowUp, down = k.KeyS || k.ArrowDown, side = k.KeyA || k.KeyD || k.ArrowLeft || k.ArrowRight;
      if (air) P.trickQ = up ? 2 : down ? 4 : side ? 3 : 1;
      else if (down) P.backQ++;
      else P.attackQ++;
    }
  });
  window.addEventListener("keyup", (e) => { Input.keys[e.code] = false; });
}

function readPlayer(p) {
  const P = Input.players[p];
  const k = Input.keys;
  const sets = Input.split ? [[["KeyA"], ["KeyD"], ["KeyS"], ["KeyG", "ShiftLeft"]], [["ArrowLeft"], ["ArrowRight"], ["ArrowDown"], ["KeyK", "ShiftRight"]]][p]
    : [["KeyA", "ArrowLeft"], ["KeyD", "ArrowRight"], ["KeyS", "ArrowDown"], ["KeyG", "KeyK", "ShiftLeft", "ShiftRight"]];
  const any = (arr) => arr.some((c) => k[c]);
  let ks = (any(sets[1]) ? 1 : 0) - (any(sets[0]) ? 1 : 0);
  if (ks) P.steer = clamp(P.steer + ks * 0.12, -1, 1); else if (!P.anchor) P.steer = 0;
  if (P.anchor) P.steer = P.touchSteer;
  const out = {
    steer: P.steer,
    brake: P.brake || any(sets[2]),
    boost: P.boost || any(sets[3]),
    attack: P.attackQ > 0, throwBack: P.backQ > 0, trick: P.trickQ || 0,
  };
  return out;
}
function consumeEdges(p) { const P = Input.players[p]; P.attackQ = Math.max(0, P.attackQ - 1); P.backQ = Math.max(0, P.backQ - 1); P.trickQ = 0; }
function resetInput() {
  Input.players = [mkPlayerInput(), mkPlayerInput()];
  Input.touches = {};
  Input.keys = {};
}

/* Draw the touch controls over the race */
function drawControls(ctx, race) {
  const L = Input.layout;
  if (!L || !race.touch) return;
  for (let p = 0; p < L.players.length; p++) {
    const P = L.players[p], I = Input.players[p];
    const me = race.humans[p];
    if (!me) continue;
    // steering ring
    const a = I.anchor || [P.ghost.x, P.ghost.y];
    ctx.globalAlpha = I.anchor ? 0.55 : 0.28;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(a[0], a[1], P.steerRange, 0, TAU); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fill();
    const kx = I.anchor ? a[0] + I.touchSteer * P.steerRange : a[0];
    ctx.globalAlpha = I.anchor ? 0.9 : 0.4;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(kx, a[1], P.R * 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = "#14101c"; ctx.font = `${P.R * 0.45}px Bangers, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("◀ ▶", kx, a[1] + 1);
    ctx.globalAlpha = 1;
    // buttons
    const air = me.h > 120;
    const label = air ? "TRICK" : (hasTarget(race, me) ? (me.comboN % 3 === 2 && me.comboT > 0 ? "KICK" : "PUNCH") : me.items.length ? "THROW" : "PUNCH");
    btn(ctx, P.atk, label, air ? "#2bd9c5" : "#ff3d7f", I.btn.atk, me.items.length && !air ? race.assets.items[me.items[0]] : null, me.atkCD > 0 ? clamp(me.atkCD / 0.45, 0, 1) : 0);
    btn(ctx, P.bst, "BOOST", "#2b9cff", I.boost, null, 0, me.boost / 100);
    btn(ctx, P.brk, "DRIFT", "#ffcf3a", I.brake);
  }
  // pause
  const pz = L.pause;
  ctx.fillStyle = "rgba(20,16,28,.55)"; ctx.beginPath(); ctx.arc(pz.x, pz.y, pz.r, 0, TAU); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.fillRect(pz.x - 7, pz.y - 8, 5, 16); ctx.fillRect(pz.x + 2, pz.y - 8, 5, 16);
}

function hasTarget(race, e) {
  return race.riders.some((o) => o !== e && o.wipeT <= 0 && Math.abs(o.z - e.z) < 320 && Math.abs(o.x - e.x) < 0.58);
}

function btn(ctx, b, label, col, down, icon, cd = 0, fill) {
  ctx.save();
  ctx.globalAlpha = down ? 0.95 : 0.72;
  ctx.fillStyle = "rgba(20,16,28,.55)";
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  if (fill !== undefined) {
    ctx.save(); ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.clip();
    ctx.fillStyle = rgba(col, 0.55); ctx.fillRect(b.x - b.r, b.y + b.r - 2 * b.r * fill, 2 * b.r, 2 * b.r * fill);
    ctx.restore();
  }
  ctx.lineWidth = down ? 5 : 3; ctx.strokeStyle = col;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 2, 0, TAU); ctx.stroke();
  if (cd > 0) { ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + TAU * cd); ctx.closePath(); ctx.fill(); }
  if (icon) ctx.drawImage(icon, b.x - b.r * 0.42, b.y - b.r * 0.62, b.r * 0.84, b.r * 0.84);
  ctx.globalAlpha = 1;
  ctx.font = `${b.r * (icon ? 0.36 : 0.42)}px Bangers, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "#14101c"; ctx.strokeText(label, b.x, b.y + (icon ? b.r * 0.42 : 0));
  ctx.fillStyle = "#fff"; ctx.fillText(label, b.x, b.y + (icon ? b.r * 0.42 : 0));
  ctx.restore();
}

// ===== net.js =====
/* Online 2-player over a direct phone-to-phone WebRTC link (PeerJS).
   A free public PeerJS server only introduces the two phones; race data then flows directly between them.
   Host: simulates the bots and its own rider.  Guest: simulates its own rider; bots follow the host.
   Each player is the authority for their own rider's health (hits are sent to the victim's device). */

const NET_PREFIX = "wildriders-v1-";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const NetCfg = (() => {
  // ?peerhost=localhost&peerport=9000 lets tests use a local PeerServer
  const q = new URLSearchParams(location.search);
  if (q.get("peerhost")) return { host: q.get("peerhost"), port: +(q.get("peerport") || 9000), path: q.get("peerpath") || "/", secure: false, debug: 1 };
  return { debug: 1 };
})();

function loadPeerLib() {
  if (window.Peer) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "peerjs.min.js";
    s.onload = () => res(); s.onerror = () => rej(new Error("lib"));
    document.head.appendChild(s);
  });
}

function openOnline() {
  modal(`<h3>2 PLAYERS · ONLINE</h3>
    <p>Race a friend on their own phone or iPad — anywhere, Wi-Fi or cellular. Both of you need internet. Bots fill the other 6 spots.</p>
    <p style="color:var(--mute);font-size:12.5px">One player hosts and gets a 4-letter code. The other taps JOIN and types it. Works best when both are on Wi-Fi; some cellular networks block direct connections.</p>
    <div class="acts"><button class="btn" style="--c:#2b9cff" data-a="host">HOST A RACE</button><button class="btn" style="--c:#ff8a1c" data-a="join">JOIN A RACE</button><button class="btn sm ghost" data-a="close">CANCEL</button></div>`, (box) => {
    box.querySelector('[data-a="close"]').onclick = () => { SFX.play("back"); closeModal(); };
    const go = (role) => { SFX.play("click"); closeModal(); App.mode = "online"; App.netRole = role; App.step = "rider"; App.pick = { riders: [], vehs: [], track: null }; openRider(); };
    box.querySelector('[data-a="host"]').onclick = () => go("host");
    box.querySelector('[data-a="join"]').onclick = () => go("guest");
  });
}

function netStatus(title, msg, extra = "", onCancel) {
  modal(`<h3>${title}</h3>${msg}${extra}<div class="acts"><button class="btn sm ghost" data-a="cancel">CANCEL</button></div>`, (box) => {
    box.querySelector('[data-a="cancel"]').onclick = () => { SFX.play("back"); netLeave(); closeModal(); onCancel && onCancel(); };
  });
}

function makeCode() { let c = ""; for (let i = 0; i < 4; i++) c += CODE_CHARS[(Math.random() * CODE_CHARS.length) | 0]; return c; }

function myHello() {
  return { t: "hello", ver: 1, rider: App.pick.riders[0] || App.save.last.rider, veh: App.pick.vehs[0] || App.save.last.veh, upg: App.save.upg[App.pick.vehs[0] || App.save.last.veh] || [0, 0, 0] };
}

/* ---------------- host ---------------- */
async function netHost() {
  netLeave();
  netStatus("CONNECTING…", "<p>Setting up your room.</p>");
  try { await loadPeerLib(); } catch (_) { return netFail("Couldn't load online play. Check your internet connection."); }
  const N = (App.net = { role: "host", code: makeCode(), conn: null, peer: null, ready: false, loaded: false, tries: 0 });
  const tryOpen = () => {
    const peer = new Peer(NET_PREFIX + N.code, NetCfg);
    N.peer = peer;
    peer.on("open", () => {
      netStatus("ROOM CODE", `<div class="codebox">${N.code}</div>
        <p>Tell your friend: open Wild Riders → <b>2 PLAYERS · ONLINE</b> → <b>JOIN</b> → type <b>${N.code}</b>.</p>
        <p style="color:var(--mute)">Waiting for your friend to join…</p>`);
    });
    peer.on("error", (err) => {
      if (err.type === "unavailable-id" && N.tries++ < 4) { peer.destroy(); N.code = makeCode(); return tryOpen(); }
      if (App.net !== N) return;
      netFail(err.type === "network" || err.type === "server-error" || err.type === "socket-error" ? "Couldn't reach the matchmaking server. Check your internet and try again." : "Online error: " + err.type);
    });
    peer.on("connection", (conn) => {
      if (N.conn) { conn.on("open", () => { conn.send({ t: "full" }); setTimeout(() => conn.close(), 300); }); return; }
      N.conn = conn;
      wireConn(N, conn);
    });
  };
  tryOpen();
}

/* ---------------- guest ---------------- */
function netJoinPrompt() {
  modal(`<h3>JOIN A RACE</h3><p>Type the 4-letter code shown on your friend's screen.</p>
    <input class="codein" id="join-code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
    <div class="acts"><button class="btn" style="--c:#2bd96a" data-a="join">JOIN</button><button class="btn sm ghost" data-a="cancel">CANCEL</button></div>`, (box) => {
    const inp = box.querySelector("#join-code");
    setTimeout(() => inp.focus(), 50);
    inp.addEventListener("input", () => (inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, "")));
    const go = () => { const c = inp.value.trim().toUpperCase(); if (c.length !== 4) { toast("CODES ARE 4 LETTERS"); return; } SFX.play("click"); netJoin(c); };
    box.querySelector('[data-a="join"]').onclick = go;
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    box.querySelector('[data-a="cancel"]').onclick = () => { SFX.play("back"); closeModal(); };
  });
}

async function netJoin(code) {
  netLeave();
  netStatus("JOINING " + code + "…", "<p>Connecting to your friend's phone.</p>");
  try { await loadPeerLib(); } catch (_) { return netFail("Couldn't load online play. Check your internet connection."); }
  const N = (App.net = { role: "guest", code, conn: null, peer: null });
  const peer = new Peer(NetCfg);
  N.peer = peer;
  peer.on("open", () => {
    const conn = peer.connect(NET_PREFIX + code, { reliable: true, serialization: "json" });
    N.conn = conn;
    wireConn(N, conn);
    N.timer = setTimeout(() => { if (!N.opened && App.net === N) netFail("Couldn't connect to that room. Check the code — and try both phones on Wi-Fi."); }, 14000);
  });
  peer.on("error", (err) => {
    if (App.net !== N) return;
    netFail(err.type === "peer-unavailable" ? `No room called <b>${code}</b>. Check the code with your friend.` : err.type === "network" || err.type === "server-error" || err.type === "socket-error" ? "Couldn't reach the matchmaking server. Check your internet." : "Online error: " + err.type);
  });
}

function netFail(msg) {
  netLeave();
  modal(`<h3>OOPS</h3><p>${msg}</p><div class="acts"><button class="btn sm" style="--c:#2b9cff" data-a="ok">OK</button></div>`, (box) => {
    box.querySelector('[data-a="ok"]').onclick = () => { closeModal(); if (!App.race) { startDemo(); renderTitle(); } };
  });
}

/* ---------------- connection + protocol ---------------- */
function wireConn(N, conn) {
  conn.on("open", () => {
    N.opened = true;
    clearTimeout(N.timer);
    if (N.role === "guest") { conn.send(myHello()); netStatus("CONNECTED!", "<p>Waiting for the host to start the race…</p>"); }
  });
  conn.on("data", (m) => netOnMessage(N, m));
  conn.on("close", () => netLost(N));
  conn.on("error", () => netLost(N));
}

function netSend(m) { const N = App.net; if (N && N.conn && N.conn.open) { try { N.conn.send(m); } catch (_) {} } }

function netOnMessage(N, m) {
  if (App.net !== N || !m || !m.t) return;
  const race = App.race;
  switch (m.t) {
    case "full": netFail("That room already has two riders."); break;
    case "hello": // host receives guest's rider choice → start
      N.guest = m;
      netStartAsHost();
      break;
    case "start": netStartAsGuest(m.cfg); break;
    case "ready": N.ready = true; netMaybeGo(); break;
    case "go": if (race) { race.hold = false; closeModal(); } break;
    case "s": if (race) netApplyState(race, m); break;
    case "ev": if (race) netApplyEvent(race, m); break;
    case "rematch": if (N.role === "host") netStartAsHost(); break;
    case "bye": netLost(N, true); break;
  }
}

function netStartAsHost() {
  const N = App.net;
  const g = N.guest;
  const me = myHello();
  const cfg = {
    trackId: App.pick.track || App.save.last.track, total: 8, difficulty: App.save.settings.diff, botSeed: (Math.random() * 100000) | 0, online: true,
    humans: [{ riderId: me.rider, vehId: me.veh, upg: me.upg, netId: 0 }, { riderId: g.rider, vehId: g.veh, upg: g.upg, netId: 1, remote: true }],
  };
  N.ready = false; N.loaded = false;
  netSend({ t: "start", cfg });
  closeModal();
  netLaunch(cfg);
}

function netStartAsGuest(cfg) {
  // same race, but from the guest's side: rider 0 (host) is remote, rider 1 is us
  const mine = JSON.parse(JSON.stringify(cfg));
  mine.humans[0].remote = true; mine.humans[1].remote = false;
  closeModal();
  netLaunch(mine);
}

async function netLaunch(cfg) {
  const N = App.net;
  App.mode = "online";
  if (App.race) { SFX.enginesOff(); App.race = null; }
  show(null);
  $("#loading .tip").textContent = "TIP: Online hits land on your friend's phone — punch them off the trail!";
  $("#loading").classList.remove("hidden");
  stopDemo();
  App.lastCfg = cfg;
  await launchRace(cfg);
  const race = App.race;
  race.hold = true;
  race.net = { role: N.role, send: netSend, queueHit: (e, amt, by, kind) => netSendHit(race, e, amt, by, kind), hitInfo: null };
  if (N.role === "guest") race.riders.forEach((e) => { if (!e.human) e.remote = true; });
  N.sendT = 0;
  netStatus("GET READY", `<p>Waiting for ${N.role === "host" ? "your friend" : "the host"} to finish loading…</p>`);
  if (N.role === "guest") netSend({ t: "ready" });
  else { N.loaded = true; netMaybeGo(); }
}

function netMaybeGo() {
  const N = App.net;
  if (!N || N.role !== "host" || !N.loaded || !N.ready || !App.race) return;
  netSend({ t: "go" });
  App.race.hold = false;
  closeModal();
}

function riderState(e) {
  return [Math.round(e.z), +e.x.toFixed(3), Math.round(e.h), Math.round(e.speed), +e.lean.toFixed(2), Math.round(e.hp * 10) / 10, Math.round(e.boost),
    (e.boosting ? 1 : 0) | (e.padT > 0 ? 2 : 0) | (e.finished ? 4 : 0) | (e.atkKick ? 8 : 0), +Math.max(0, e.wipeT).toFixed(2), +Math.max(0, e.atkT).toFixed(2), e.atkSide,
    e.trick ? TRICKS.indexOf(e.trick.def) : -1, e.trick ? +(e.trick.t / e.trick.dur).toFixed(2) : 0, +Math.max(0, e.hurtT).toFixed(2), +e.finishTime.toFixed(2)];
}
function netBeforeStep() {}
function netAfterFrame(race, dt) {
  const N = App.net;
  if (!N || !race.net || race.hold) return;
  N.sendT -= dt;
  if (N.sendT > 0) return;
  N.sendT = 1 / 20;
  const m = { t: "s", r: {} };
  race.riders.forEach((e, i) => { if (!e.remote) m.r[i] = riderState(e); });
  netSend(m);
}
function netApplyState(race, m) {
  for (const k in m.r) {
    const e = race.riders[+k];
    if (!e || !e.remote) continue;
    const a = m.r[k];
    const first = !e.net;
    e.net = { z: a[0], x: a[1], h: a[2], speed: a[3], lean: a[4], hp: a[5], boost: a[6], boosting: !!(a[7] & 1), padT: a[7] & 2 ? 0.5 : 0, finished: !!(a[7] & 4), atkKick: !!(a[7] & 8),
      wipeT: a[8], atkT: a[9], atkSide: a[10], trick: a[11] >= 0 ? TRICKS[a[11]].id : null, trickT: a[12], hurtT: a[13], finishTime: a[14], age: 0 };
    if (first) { e.z = a[0]; e.x = a[1]; }
    if (e.net.finished && !e.finished) race.finishOrder.push(e);
  }
}
function netApplyEvent(race, m) {
  if (m.k === "throw") {
    const e = race.riders[m.i];
    if (e) spawnProjectiles(race, e, m.item, m.dir, m.z, m.x, m.sp, m.id);
  } else if (m.k === "pop") {
    race.projs = race.projs.filter((p) => p.id !== m.id);
    const v = race.riders[m.v];
    if (v) for (let k = 0; k < 8; k++) spawnFx(race, v.z, v.x + rnd(-0.2, 0.2), 300 + rnd(-100, 100), "#fff6a8", 50, 0.5, 600);
  } else if (m.k === "take") {
    const s = race.track.segs[m.s];
    if (s && s.objs[m.o]) s.objs[m.o].taken = race.time + 6;
  } else if (m.k === "hit") {
    const e = race.riders[m.v], by = race.riders[m.by];
    if (!e || e.remote) return;
    damage(race, e, m.dmg, by || null, m.kind);
    if (m.slow) e.speed *= m.slow;
    if (m.push) e.vx += m.push;
    e.hurtT = Math.max(e.hurtT, 0.45);
    if (e.human) e.shake = m.kick ? 10 : 5;
    if (m.kind === "melee") race.events.push({ snd: m.dmg > 12 ? "kick" : "punch", e: by || e, target: e });
  }
}
function netSendHit(race, e, amt, by, kind) {
  const info = race.net.hitInfo || {};
  race.net.hitInfo = null;
  netSend({ t: "ev", k: "hit", v: race.riders.indexOf(e), by: race.riders.indexOf(by), dmg: +amt.toFixed(2), kind, slow: info.slow || 0, push: info.push || 0, kick: amt > 12 });
}

function netLost(N, bye) {
  if (App.net !== N || N.lost) return;
  N.lost = true;
  const race = App.race;
  if (race && race.net) {
    // keep racing: the friend's rider (and, for a guest, the bots) switch to computer control
    race.riders.forEach((e) => { if (e.remote) { e.remote = false; if (e.human) { e.human = false; e.name = (e.name || "") + " (left)"; } e.ai = e.ai || { skill: 0.85, aggr: 0.5, t: 0, tx: 0, inp: {} }; } });
    race.net = null;
    race.hold = false;
    closeModal();
    toast(bye ? "YOUR FRIEND LEFT" : "CONNECTION LOST");
  } else if (N.opened) {
    netFail(bye ? "Your friend left the room." : "The connection dropped.");
  }
}

function netLeave() {
  const N = App.net;
  if (!N) return;
  App.net = null;
  try { if (N.conn && N.conn.open) N.conn.send({ t: "bye" }); } catch (_) {}
  setTimeout(() => { try { N.conn && N.conn.close(); } catch (_) {} try { N.peer && N.peer.destroy(); } catch (_) {} }, 150);
  clearTimeout(N.timer);
}

function netRematch() {
  const N = App.net;
  if (!N || N.lost) { toast("NOT CONNECTED"); startDemo(); renderTitle(); return; }
  if (N.role === "host") netStartAsHost();
  else { netSend({ t: "rematch" }); netStatus("REMATCH", "<p>Asking the host to start another race…</p>"); }
}
