        if (o.invuln > 0) { hit = true; break; }
        damage(race, o, it.dmg * (p.owner.itemMul || 1), p.owner, "item");
        o.speed *= it.slow; o.hurtT = Math.max(o.hurtT, 0.5);
        if (it.burn) o.burnT = 2.4;
        if (it.blind) { o.blindT = 1.6; o.blindCol = it.col; }
        if (o.human) o.shake = 7;
        for (let k = 0; k < 10; k++) spawnFx(race, p.z, p.x + rnd(-0.2, 0.2), p.h + rnd(-100, 100), it.col, 50, 0.5, 600);
        race.events.push({ snd: "hit", e: o, by: p.owner });
        if (p.owner.human) popup(p.owner, "DIRECT HIT!", "#ffd23f");
        if (race.net) race.net.send({ t: "ev", k: "pop", id: p.id, v: race.riders.indexOf(o) });
        hit = true; break;
      }
    }
    if (!hit && p.life > 0 && Math.abs(p.x) < 3 && p.z < race.track.length) keep.push(p);
  }
  race.projs = keep;
}

function riderCollisions(race) {
  const rs = race.riders;
  for (let i = 0; i < rs.length; i++) {
    const a = rs[i];
    if (a.wipeT > 0) { a.drafting = false; continue; }
    a.drafting = false;
    for (let j = 0; j < rs.length; j++) {
      if (i === j) continue;
      const b = rs[j];
      if (b.wipeT > 0) continue;
      const dz = b.z - a.z, dx = b.x - a.x;
      if (dz > 150 && dz < 1100 && Math.abs(dx) < 0.25 && a.h <= 0) a.drafting = true;
      if (j < i) continue;
      const minDx = ((a.veh.w + b.veh.w) / 2 / ROAD_W) * 0.38;
      if (Math.abs(dz) < 140 && Math.abs(dx) < minDx && Math.abs(a.h - b.h) < 300) {
        const ov = minDx - Math.abs(dx);
        const tot = a.mass + b.mass;
        const s = dx === 0 ? 1 : sign(dx);
        a.x -= s * ov * (b.mass / tot); b.x += s * ov * (a.mass / tot);
        a.vx -= s * 0.8 * (b.mass / tot); b.vx += s * 0.8 * (a.mass / tot);
        const back = dz > 0 ? a : b, front = dz > 0 ? b : a;
        if (back.speed > front.speed) back.speed = front.speed * 0.98;
        if (back.veh.shove && front.mass < back.mass) { front.speed *= 0.97; damage(race, front, 0.3, null, "bump", true); }
        if ((a.human || b.human) && Math.random() < 0.08) race.events.push({ snd: "bump", e: a.human ? a : b });
      }
    }
  }
}

function spawnFx(race, z, x, h, col, size, life, vh = 0) {
  if (race.fx.length > 220) return;
  race.fx.push({ type: "fx", z, x, h, col, size, life, max: life, vh, vx: rnd(-0.3, 0.3) });
}
/* Savage tone only: cartoon-level blood. Flying droplets around the rider, plus (for the rider you are playing) a few
   splats on the screen edges. No gore, no body damage: just red. */
function bloodBurst(race, e, power) {
  const n = 4 + power * 4;
  for (let k = 0; k < n; k++) spawnFx(race, e.z + rnd(-40, 40), e.x + rnd(-0.12, 0.12), 350 + Math.random() * 250, k % 3 ? "#a8101c" : "#d4202e", 24 + Math.random() * 26, 0.5 + Math.random() * 0.5, 500 + Math.random() * 900);
  if (e.human) { e.bloodT = 0.9 + power * 0.35; e.bloodSeed = (Math.random() * 1e6) | 0; e.bloodPow = power; }
}
function updateFx(race, dt) {
  for (const f of race.fx) { f.life -= dt; if (f.vz) f.z += f.vz * dt; f.h += f.vh * dt; f.vh -= 1800 * dt; if (f.h < 0) { f.h = 0; f.vh = 0; } f.x += f.vx * dt; }
  race.fx = race.fx.filter((f) => f.life > 0);
}

/* ---------------- Cutie mode (secret) ----------------
   cfg.fav = index (in cfg.humans) of the player who always wins. Each device only adjusts the riders it simulates:
   the favoured player gets a gentle catch-up and softer knocks; everyone else is quietly held back near the end
   so nobody crosses the line before her. */
function cutieFav(race) {
  if (race.cfg.fav === undefined || race.cfg.fav === null) return null;
  if (race.favE === undefined) race.favE = race.riders.find((e) => e.human && e.mark === race.cfg.fav) || null;
  return race.favE;
}
function cutieStep(race, fav, dt) {
  for (const e of race.riders) { e.speedCap = undefined; e.assist = 0; }
  if (!fav) return;
  const tr = race.track;
  if (!fav.remote && !fav.finished) {
    let lead = -1e9;
    for (const o of race.riders) if (o !== fav && !o.finished) lead = Math.max(lead, o.z);
    const gap = lead - fav.z;
    const urgency = clamp(1 - (tr.finishZ - fav.z) / ((tr.finishZ - tr.startZ) * 0.35), 0, 1);
    fav.assist = gap > 0 ? clamp(gap / 22000, 0, 0.08 + 0.08 * urgency) : 0;
  }
  if (fav.finished) return;                                       // once she's home, everyone else races freely
  for (const e of race.riders) {
    if (e === fav || e.remote || e.finished) continue;
    if (race.czM === undefined) race.czM = 3000 + Math.random() * 9000;   // this race's winning margin (~0.3–1 s), so it isn't always a photo finish
    const remain = Math.max(1, tr.finishZ - e.z), lead = e.z - fav.z;
    const q = (lead + race.czM) / remain;                         // how far ahead of her (plus margin), relative to what's left
    let cap;
    // soft squeeze: a slightly lower top speed (never more than ~14%) once the lead is big for the distance left
    if (q > 0.05) cap = e.maxSpd * (1 - clamp((q - 0.05) * 1.3, 0, 0.14));
    // backup: if she's far behind, match her pace so she can still catch up before the line
    //         (only in the last ~30% of the trail, so a pause mid-race never freezes everyone)
    const late = remain < (tr.finishZ - tr.startZ) * 0.3;
    if ((late && q > 0.17) || (lead > -race.czM * 0.3 && remain < 9000))
      cap = Math.min(cap || 1e9, Math.max(remain < 9000 ? 0 : e.maxSpd * 0.3, fav.speed * (remain < 9000 ? 0.9 : 0.97) - Math.max(0, lead + race.czM - remain * 0.17) * 0.25));
    if (cap !== undefined) {
      e.speedCap = cap;
      if (e.human && e.speed > cap + 300 && e.h <= 0) {
        // looks like the trail got rough: a little dust and wobble
        if (Math.random() < 0.25) spawnFx(race, e.z - 60, e.x + rnd(-0.12, 0.12), 50, tr.biome.ground[0], 60, 0.5);
        if (Math.random() < dt * 0.8) e.wobble = Math.max(e.wobble, 0.35);
      }
    }
    if (e.z > tr.finishZ - 160) { e.z = tr.finishZ - 160; e.speed = Math.min(e.speed, fav.speed * 0.5); }
  }
}

/* ---------------- AI ---------------- */
function aiThink(race, e, dt, humanZ) {
  const ai = e.ai || (e.ai = { skill: 0.9, aggr: 0.5, t: 0, tx: 0, inp: {} });
  const inp = ai.inp;
  inp.attack = false; inp.trick = 0; inp.throwBack = false; inp.boost = false; inp.brake = false;
  const tr = race.track;
  const segI = Math.floor(e.z / SEG);
  const seg = tr.segs[segI] || tr.segs[tr.N - 1];
  // rubber band (bots only)
  if (!e.human && !race.cfg.noRubber) {
    const gap = e.z - humanZ;
    const rb = clamp(1 - gap / 28000, 0.88, 1.1);
    const base = BASE_SPEED * e.veh.max * e.rider.spd;
    e.maxSpd = base * (0.86 + 0.14 * ai.skill) * rb;
  }
  ai.t -= dt;
  if (ai.t <= 0) { ai.t = 0.16 + Math.random() * 0.12; ai.tx = chooseLine(race, e, segI); }
  const ahead = tr.segs[Math.min(tr.N - 1, segI + 10)];
  const pct = e.speed / e.maxSpd;
  let steer = (ai.tx - e.x) * 3.4 + ahead.curve * pct * pct * 0.07;
  inp.steer = clamp(steer, -1, 1);
  // brake into hard curves when wide
  const far = tr.segs[Math.min(tr.N - 1, segI + 22)];
  if (Math.abs(far.curve) > 4 && pct > 0.85 && sign(e.x) === -sign(far.curve) && Math.abs(e.x) > 0.6) inp.brake = Math.random() < 0.6;
  // ease off for hairpins and tight bends ahead (sloppier bots ease off a bit late)
  let cmax = 0;
  for (let k = 3; k < 30; k += 3) cmax = Math.max(cmax, Math.abs(tr.segs[Math.min(tr.N - 1, segI + k)].curve));
  const safe = cmax > 3.6 ? clamp(Math.sqrt(4.6 * e.handling / cmax), 0.5, 1) * (1 + (1 - ai.skill) * 0.22) : 2;
  inp.throttle = pct > safe ? 0 : 1;
  inp.stop = pct > safe + 0.08;
  if (e.finished) return inp;
  // boost on straights
  if (e.boost > 55 && Math.abs(ahead.curve) < 2 && Math.random() < ai.skill * 0.08) ai.boosting = 1.4;
  if (ai.boosting > 0) { ai.boosting -= dt; inp.boost = e.boost > 2; }
  // combat — pick the nearest candidate (never biased toward humans)
  if (race.time > 3) {
    let mel = null, md = 1e9, ahead = null, ad = 1e9, behind = null, bd = 1e9;
    const fav = cutieFav(race);
    const late = fav ? clamp((e.z - tr.startZ) / (tr.finishZ - tr.startZ) * 1.6 - 0.6, 0, 1) : 0;   // 0 until ~40% in, 1 by the end
    for (const o of race.riders) {
      if (o === e || o.wipeT > 0 || o.finished) continue;
      if (o === fav && Math.random() < 0.7 + 0.28 * late) continue;   // cutie mode: bots mostly leave the favoured player alone
      const dz = o.z - e.z, dx = Math.abs(o.x - e.x);
      if (Math.abs(dz) < 300 && dx < 0.55) { const d = Math.abs(dz) + dx * 400; if (d < md) { md = d; mel = o; } }
      else if (dz > 300 && dz < 2600 && dx < 0.3 && dz < ad) { ad = dz; ahead = o; }
      else if (dz < -200 && dz > -1200 && dx < 0.3 && -dz < bd) { bd = -dz; behind = o; }
    }
    const rival = fav && mel && mel.human && mel !== fav ? 1 + 0.5 * late : 1;
    if (mel && e.atkCD <= 0 && mel.meleeImm <= 0 && Math.random() < ai.aggr * dt * 2.4 * rival) inp.attack = true;
    else if (!mel && ahead && e.items.length && Math.random() < ai.skill * dt * 1.0) inp.attack = true;
    else if (behind && e.items.length && Math.random() < ai.skill * dt * 0.6) inp.throwBack = true;
  }
  // tricks in the air
  if (e.h > 150 && !e.trick && e.vh > 600 && Math.random() < ai.skill * 0.12) inp.trick = 1 + ((Math.random() * 4) | 0);
  return inp;
}

function chooseLine(race, e, segI) {
  const tr = race.track, ai = e.ai, skill = ai.skill;
  const segs = tr.segs;
  const look = tr.segs[Math.min(tr.N - 1, segI + 14)];
  const w = look.w;
  const racing = sign(look.curve) * Math.min(0.5, Math.abs(look.curve) * 0.1);
  let bestX = e.x, bestC = 1e9;
  const rHalf = (e.veh.w / ROAD_W) * 0.28;
  for (let c = -4; c <= 4; c++) {
    const cx = (c / 4) * 0.82 * w;
    let cost = Math.abs(cx - racing) * 0.6 + Math.abs(cx - e.x) * 0.35;
    for (let i = segI + 2; i < segI + 34; i++) {
      const s = segs[i];
      if (!s) break;
      const near = 1 - (i - segI) / 36;
      if (s.split > 0.2 && Math.abs(cx) < 0.3 * s.split + rHalf) cost += 6 * near;
      for (const sp of s.sprites) {
        if (sp.flat || sp.dead || sp.gate) continue;
        const S = race.assets.sprites[sp.id];
        if (!S || (!S.solid && !S.obstacle)) continue;
        if (Math.abs(sp.x) > s.w + 0.4) continue;
        const half = (S.ww / ROAD_W) * 0.5 * (S.obstacle === "log" ? 0.92 : 0.5);
        if (Math.abs(cx - sp.x) < half + rHalf + 0.12) cost += 7 * near * (0.6 + skill * 0.4);
      }
      if (s.surface && cx >= s.surface.x0 && cx <= s.surface.x1) cost += (s.surface.type === "lava" ? 4 : 0.8) * near * skill;
      if (s.decal && s.decal.type === "boost" && cx >= s.decal.x0 && cx <= s.decal.x1) cost -= 1.4 * near * skill;
      if (s.ramp) for (const r of s.ramp) if (Math.abs(cx - r.x) < 0.25) cost -= 0.9 * near * skill;
      for (const o of s.objs) if (!(o.taken > race.time) && Math.abs(cx - o.x) < 0.3) cost -= (o.kind === "crate" ? (e.items.length < 3 ? 1 : 0) : (1 - e.hp / e.maxHp) * 3) * near * skill;
      if (Math.abs(cx) > s.w) cost += 3 * near;
    }
    // avoid riding right behind someone when holding no item (they might throw back) — light spacing
    cost += (Math.random() - 0.5) * (1.1 - skill) * 1.2;
    if (cost < bestC) { bestC = cost; bestX = cx; }
  }
  return bestX;
}

/* Remote riders (online): smoothly follow the last received network state. */
function remoteFollow(race, e, dt) {
  const n = e.net;
  if (!n) return;
  n.age += dt;
  const tz = n.z + n.speed * n.age;
  e.z = lerp(e.z, tz, Math.min(1, dt * 10));
  e.x = lerp(e.x, n.x, Math.min(1, dt * 10));
  e.h = n.h; e.speed = n.speed; e.lean = n.lean; e.hp = n.hp; e.boost = n.boost;
  e.boosting = n.boosting; e.padT = n.padT; e.wipeT = n.wipeT; e.atkT = n.atkT; e.atkSide = n.atkSide; e.atkKick = n.atkKick;
  e.trick = n.trick ? { def: TRICKS.find((t) => t.id === n.trick), t: n.trickT, dur: 1 } : null;
  e.hurtT = n.hurtT; e.finished = n.finished; e.finishTime = n.finishTime;
  e.pedal += dt * (2 + (e.speed / e.maxSpd) * 7);
  e.lastSeg = Math.floor(e.z / SEG);
}

// ===== input.js =====
/* Touch + keyboard input. Builds per-player input snapshots and draws the on-screen controls. */

const Input = {
  players: [mkPlayerInput(), mkPlayerInput()],
  touches: {},
  layout: null,       // computed per frame from canvas size + mode
  keys: {},
  enabled: false,
  split: false,
  onPause: null,
};

function mkPlayerInput() {
  return { steer: 0, touchSteer: 0, brake: false, boost: false, attackQ: 0, backQ: 0, trickQ: 0, steerTouch: null, anchor: null, knob: null, btn: {} };
}

function computeLayout(W, H, split, safe) {
  const L = { W, H, split, players: [] };
  const n = split ? 2 : 1;
  for (let p = 0; p < n; p++) {
    const x0 = split ? (p * W) / 2 : 0, w = split ? W / 2 : W;
    const R = clamp(Math.min(w * 0.085, H * 0.12), 30, 62);
    const pad = Math.max(14, R * 0.35);
    const sr = p === n - 1 ? safe.r : 0, sl = p === 0 ? safe.l : 0;
    const atk = { x: x0 + w - pad - R * 1.15 - sr, y: H - pad - R * 1.15 - safe.b, r: R * 1.15 };
    const bst = { x: atk.x - R * 0.35, y: atk.y - R * 2.55, r: R * 0.92 };
    const brk = { x: atk.x - R * 2.45, y: atk.y + R * 0.2, r: R * 0.85 };
    L.players.push({
      x0, w, R, atk, bst, brk,
      steerZone: { x: x0 + sl, y: H * 0.22, w: w * 0.48, h: H * 0.78 },
      ghost: { x: x0 + sl + pad + R * 1.5, y: H - pad - R * 1.95 - safe.b },
      steerRange: R * 1.15,
    });
  }
  L.pause = split ? { x: W / 2, y: H - 26 - safe.b, r: 20 } : { x: W - 30 - safe.r, y: 26 + safe.t, r: 20 };
  return L;
}

function hitBtn(b, x, y, k = 1.3) { const dx = x - b.x, dy = y - b.y; return dx * dx + dy * dy < (b.r * k) * (b.r * k); }

function touchRole(x, y) {
  const L = Input.layout;
  if (!L) return null;
  if (hitBtn(L.pause, x, y, 1.6)) return { role: "pause" };
  for (let p = 0; p < L.players.length; p++) {
    const P = L.players[p];
    if (x < P.x0 || x > P.x0 + P.w) continue;
    if (hitBtn(P.atk, x, y)) return { role: "atk", p };
    if (hitBtn(P.bst, x, y)) return { role: "bst", p };
    if (hitBtn(P.brk, x, y)) return { role: "brk", p };
    const z = P.steerZone;
    if (x >= z.x && x <= z.x + z.w && y >= z.y) return { role: "steer", p };
    if (x > z.x + z.w) return { role: "swipe", p };
  }
  return null;
}

function initInput(canvas) {
  const pt = (t) => { const r = canvas.getBoundingClientRect(); return [t.clientX - r.left, t.clientY - r.top]; };
  const start = (e) => {
    if (!Input.enabled) return;
    e.preventDefault();
    SFX.unlock();
    for (const t of e.changedTouches) {
      const [x, y] = pt(t);
      const role = touchRole(x, y);
      if (!role) continue;
      Input.touches[t.identifier] = Object.assign(role, { sx: x, sy: y, x, y, t0: now() });
      const P = Input.players[role.p];
      if (role.role === "pause") Input.onPause && Input.onPause();
      if (role.role === "steer") { P.anchor = [x, y]; P.knob = [x, y]; P.steerTouch = t.identifier; }
      if (role.role === "bst") P.boost = true;
      if (role.role === "brk") P.brake = true;
      if (role.role === "atk") P.btn.atk = true;
    }
  };
  const move = (e) => {
    if (!Input.enabled) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      const T = Input.touches[t.identifier];
      if (!T) continue;
      const [x, y] = pt(t);
      T.x = x; T.y = y;
      if (T.role === "steer") {
        const P = Input.players[T.p], range = Input.layout.players[T.p].steerRange;
        let dx = x - P.anchor[0];
        if (Math.abs(dx) > range * 1.4) { P.anchor[0] = x - sign(dx) * range * 1.4; dx = sign(dx) * range * 1.4; }
        P.knob = [x, P.anchor[1]];            // the knob only slides sideways
        P.touchSteer = clamp(dx / range, -1, 1);   // left / right only: the bike accelerates by itself
      }
    }
  };
  const end = (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const T = Input.touches[t.identifier];
      if (!T) continue;
      delete Input.touches[t.identifier];
      const P = Input.players[T.p];
      if (!P) continue;
      if (T.role === "steer") { P.touchSteer = 0; P.anchor = null; P.knob = null; P.steerTouch = null; }
      if (T.role === "bst") P.boost = Object.values(Input.touches).some((o) => o.role === "bst" && o.p === T.p);
      if (T.role === "brk") P.brake = Object.values(Input.touches).some((o) => o.role === "brk" && o.p === T.p);
      if (T.role === "atk" || T.role === "swipe") {
        P.btn.atk = false;
        const dx = T.x - T.sx, dy = T.y - T.sy, dist = Math.hypot(dx, dy);
        const air = Input.airborne && Input.airborne[T.p];
        if (dist > 26) {
          // swipe: in the air picks a trick; on the ground a downward swipe throws backward
          let trick = Math.abs(dx) > Math.abs(dy) ? 3 : dy < 0 ? 2 : 4;
          if (air) P.trickQ = trick;
          else if (dy > 20 && Math.abs(dy) > Math.abs(dx)) P.backQ++;
          else if (T.role === "atk") P.attackQ++;
        } else if (T.role === "atk") {
          if (air) P.trickQ = 1; else P.attackQ++;
        } else if (air) P.trickQ = 1;
      }
    }
  };
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end, { passive: false });
  canvas.addEventListener("touchcancel", end, { passive: false });

  // keyboard (desktop / iPad keyboard)
  const KEYMAP = {
    // P1
    KeyA: [0, "left"], KeyD: [0, "right"], KeyW: [0, "up"], KeyS: [0, "stop"], KeyF: [0, "atk"], KeyG: [0, "boost"], KeyE: [0, "drift"], Space: [0, "atk"], ShiftLeft: [0, "boost"],
    // P2 (or P1 in single player)
    ArrowLeft: [1, "left"], ArrowRight: [1, "right"], ArrowUp: [1, "up"], ArrowDown: [1, "stop"], KeyL: [1, "atk"], KeyK: [1, "boost"], KeyJ: [1, "drift"], Enter: [1, "atk"], ShiftRight: [1, "boost"],
  };
  window.addEventListener("keydown", (e) => {
    if (e.code === "Escape" || e.code === "KeyP") { Input.onPause && Input.enabled && Input.onPause(); return; }
    const m = KEYMAP[e.code];
    if (!m || !Input.enabled) return;
    e.preventDefault();
    SFX.unlock();
    const p = Input.split ? m[0] : 0;
    if (Input.keys[e.code]) return;
    Input.keys[e.code] = true;
    const P = Input.players[p];
    if (m[1] === "atk") {
      const air = Input.airborne && Input.airborne[p];
      const k = Input.keys;
      const up = k.KeyW || k.ArrowUp, down = k.KeyS || k.ArrowDown, side = k.KeyA || k.KeyD || k.ArrowLeft || k.ArrowRight;
      if (air) P.trickQ = up ? 2 : down ? 4 : side ? 3 : 1;
      else if (down) P.backQ++;
      else P.attackQ++;
    }
  });
  window.addEventListener("keyup", (e) => { Input.keys[e.code] = false; });
}

function readPlayer(p) {
  const P = Input.players[p];
  const k = Input.keys;
  // [left, right, drift, boost, (unused), brake] -- the bike always accelerates by itself, so there is no gas key
  const sets = Input.split ? [[["KeyA"], ["KeyD"], ["KeyE"], ["KeyG", "ShiftLeft"], ["KeyW"], ["KeyS"]], [["ArrowLeft"], ["ArrowRight"], ["KeyJ"], ["KeyK", "ShiftRight"], ["ArrowUp"], ["ArrowDown"]]][p]
    : [["KeyA", "ArrowLeft"], ["KeyD", "ArrowRight"], ["KeyE", "KeyJ"], ["KeyG", "KeyK", "ShiftLeft", "ShiftRight"], ["KeyW", "ArrowUp"], ["KeyS", "ArrowDown"]];
  const any = (arr) => arr.some((c) => k[c]);
  let ks = (any(sets[1]) ? 1 : 0) - (any(sets[0]) ? 1 : 0);
  if (ks) P.steer = clamp(P.steer + ks * 0.12, -1, 1); else if (!P.anchor) P.steer = 0;
  if (P.anchor) P.steer = P.touchSteer;
  const out = {
    steer: P.steer,
    brake: P.brake || any(sets[2]),
    boost: P.boost || any(sets[3]),
    throttle: 1,                       // auto-accelerate
    stop: any(sets[5]),                // desktop only: S / Down arrow brakes
    attack: P.attackQ > 0, throwBack: P.backQ > 0, trick: P.trickQ || 0,
  };
  return out;
}
function consumeEdges(p) { const P = Input.players[p]; P.attackQ = Math.max(0, P.attackQ - 1); P.backQ = Math.max(0, P.backQ - 1); P.trickQ = 0; }
function resetInput() {
  Input.players = [mkPlayerInput(), mkPlayerInput()];
  Input.touches = {};
  Input.keys = {};
}

/* Draw the touch controls over the race */
function drawControls(ctx, race) {
  const L = Input.layout;
  if (!L || !race.touch) return;
  for (let p = 0; p < L.players.length; p++) {
    const P = L.players[p], I = Input.players[p];
    const me = race.humans[p];
    if (!me) continue;
    // steering slider (left / right only)
    const a = I.anchor || [P.ghost.x, P.ghost.y];
    const rr = P.steerRange, kr = P.R * 0.5;
    ctx.globalAlpha = I.anchor ? 0.55 : 0.28;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
    roundRect(ctx, a[0] - rr - kr, a[1] - kr * 1.15, (rr + kr) * 2, kr * 2.3, kr * 1.15); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fill();
    const kx = I.anchor ? a[0] + I.touchSteer * rr : a[0];
    ctx.globalAlpha = I.anchor ? 0.9 : 0.4;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(kx, a[1], kr, 0, TAU); ctx.fill();
    ctx.fillStyle = "#14101c"; ctx.font = `${P.R * 0.45}px Bangers, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("◀ ▶", kx, a[1] + 1);
    ctx.globalAlpha = 1;
    // buttons
    const air = me.h > 120;
    const label = air ? "TRICK" : (hasTarget(race, me) ? (me.comboN % 3 === 2 && me.comboT > 0 ? "KICK" : "PUNCH") : me.items.length ? "THROW" : "PUNCH");
    btn(ctx, P.atk, label, air ? "#2bd9c5" : "#ff3d7f", I.btn.atk, me.items.length && !air ? race.assets.items[me.items[0]] : null, me.atkCD > 0 ? clamp(me.atkCD / 0.45, 0, 1) : 0);
    btn(ctx, P.bst, "BOOST", "#2b9cff", I.boost, null, 0, me.boost / 100);
    btn(ctx, P.brk, "DRIFT", "#ffcf3a", I.brake);
  }
  // pause
  const pz = L.pause;
  ctx.fillStyle = "rgba(20,16,28,.55)"; ctx.beginPath(); ctx.arc(pz.x, pz.y, pz.r, 0, TAU); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.fillRect(pz.x - 7, pz.y - 8, 5, 16); ctx.fillRect(pz.x + 2, pz.y - 8, 5, 16);
}

function hasTarget(race, e) {
  return race.riders.some((o) => o !== e && o.wipeT <= 0 && Math.abs(o.z - e.z) < 320 && Math.abs(o.x - e.x) < 0.58);
}

function btn(ctx, b, label, col, down, icon, cd = 0, fill) {
  ctx.save();
  ctx.globalAlpha = down ? 0.95 : 0.72;
  ctx.fillStyle = "rgba(20,16,28,.55)";
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
  if (fill !== undefined) {
    ctx.save(); ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.clip();
    ctx.fillStyle = rgba(col, 0.55); ctx.fillRect(b.x - b.r, b.y + b.r - 2 * b.r * fill, 2 * b.r, 2 * b.r * fill);
    ctx.restore();
  }
  ctx.lineWidth = down ? 5 : 3; ctx.strokeStyle = col;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r - 2, 0, TAU); ctx.stroke();
  if (cd > 0) { ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + TAU * cd); ctx.closePath(); ctx.fill(); }
  if (icon) ctx.drawImage(icon, b.x - b.r * 0.42, b.y - b.r * 0.62, b.r * 0.84, b.r * 0.84);
  ctx.globalAlpha = 1;
  ctx.font = `${b.r * (icon ? 0.36 : 0.42)}px Bangers, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 3; ctx.strokeStyle = "#14101c"; ctx.strokeText(label, b.x, b.y + (icon ? b.r * 0.42 : 0));
  ctx.fillStyle = "#fff"; ctx.fillText(label, b.x, b.y + (icon ? b.r * 0.42 : 0));
  ctx.restore();
}

// ===== net.js =====
/* Online 2-player over a direct phone-to-phone WebRTC link (PeerJS).
   A free public PeerJS server only introduces the two phones; race data then flows directly between them.
   Host: simulates the bots and its own rider.  Guest: simulates its own rider; bots follow the host.
   Each player is the authority for their own rider's health (hits are sent to the victim's device). */

const NET_PREFIX = "wildriders-v1-";
const CODE_CHARS = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const NetCfg = (() => {
  // ?peerhost=localhost&peerport=9000 lets tests use a local PeerServer
  const q = new URLSearchParams(location.search);
  if (q.get("peerhost")) return { host: q.get("peerhost"), port: +(q.get("peerport") || 9000), path: q.get("peerpath") || "/", secure: false, debug: 1 };
  return { debug: 1 };
})();

function loadPeerLib() {
  if (window.Peer) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "peerjs.min.js";
    s.onload = () => res(); s.onerror = () => rej(new Error("lib"));
    document.head.appendChild(s);
  });
}

function openOnline() {
  modal(`<h3>2 PLAYERS · ONLINE</h3>
    <p>Race a friend on their own phone or iPad — anywhere, Wi-Fi or cellular. Both of you need internet. Bots fill the other 6 spots.</p>
    <p style="color:var(--mute);font-size:12.5px">One player hosts and gets a 4-letter code. The other taps JOIN and types it. Works best when both are on Wi-Fi; some cellular networks block direct connections.</p>
    <div class="acts"><button class="btn" style="--c:#2b9cff" data-a="host">HOST A RACE</button><button class="btn" style="--c:#ff8a1c" data-a="join">JOIN A RACE</button><button class="btn sm ghost" data-a="close">CANCEL</button></div>`, (box) => {
    box.querySelector('[data-a="close"]').onclick = () => { SFX.play("back"); closeModal(); };
    const go = (role) => { SFX.play("click"); closeModal(); App.mode = "online"; App.netRole = role; App.step = "rider"; App.pick = { riders: [], vehs: [], track: null }; openRider(); };
    box.querySelector('[data-a="host"]').onclick = () => go("host");
    box.querySelector('[data-a="join"]').onclick = () => go("guest");
  });
}

function netStatus(title, msg, extra = "", onCancel) {
  modal(`<h3>${title}</h3>${msg}${extra}<div class="acts"><button class="btn sm ghost" data-a="cancel">CANCEL</button></div>`, (box) => {
    box.querySelector('[data-a="cancel"]').onclick = () => { SFX.play("back"); netLeave(); closeModal(); onCancel && onCancel(); };
  });
}

function makeCode() { let c = ""; for (let i = 0; i < 4; i++) c += CODE_CHARS[(Math.random() * CODE_CHARS.length) | 0]; return c; }

function myHello() {
  return { t: "hello", ver: 1, cz: cutieOn() ? 1 : 0, rider: App.pick.riders[0] || App.save.last.rider, veh: App.pick.vehs[0] || App.save.last.veh, upg: myUpg() };
}

/* ---------------- host ---------------- */
async function netHost() {
  netLeave();
  netStatus("CONNECTING…", "<p>Setting up your room.</p>");
  try { await loadPeerLib(); } catch (_) { return netFail("Couldn't load online play. Check your internet connection."); }
  const N = (App.net = { role: "host", code: makeCode(), conn: null, peer: null, ready: false, loaded: false, tries: 0 });
  const tryOpen = () => {
    const peer = new Peer(NET_PREFIX + N.code, NetCfg);
    N.peer = peer;
    peer.on("open", () => {
      netStatus("ROOM CODE", `<div class="codebox">${N.code}</div>
        <p>Tell your friend: open Wild Riders → <b>2 PLAYERS · ONLINE</b> → <b>JOIN</b> → type <b>${N.code}</b>.</p>
        <p style="color:var(--mute)">Waiting for your friend to join…</p>`);
    });
    peer.on("error", (err) => {
      if (err.type === "unavailable-id" && N.tries++ < 4) { peer.destroy(); N.code = makeCode(); return tryOpen(); }
      if (App.net !== N) return;
      netFail(err.type === "network" || err.type === "server-error" || err.type === "socket-error" ? "Couldn't reach the matchmaking server. Check your internet and try again." : "Online error: " + err.type);
    });
    peer.on("connection", (conn) => {
      if (N.conn) { conn.on("open", () => { conn.send({ t: "full" }); setTimeout(() => conn.close(), 300); }); return; }
      N.conn = conn;
      wireConn(N, conn);
    });
  };
  tryOpen();
}

/* ---------------- guest ---------------- */
function netJoinPrompt() {
  modal(`<h3>JOIN A RACE</h3><p>Type the 4-letter code shown on your friend's screen.</p>
    <input class="codein" id="join-code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
    <div class="acts"><button class="btn" style="--c:#2bd96a" data-a="join">JOIN</button><button class="btn sm ghost" data-a="cancel">CANCEL</button></div>`, (box) => {
    const inp = box.querySelector("#join-code");
    setTimeout(() => inp.focus(), 50);
    inp.addEventListener("input", () => (inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, "")));
    const go = () => { const c = inp.value.trim().toUpperCase(); if (c.length !== 4) { toast("CODES ARE 4 LETTERS"); return; } SFX.play("click"); netJoin(c); };
    box.querySelector('[data-a="join"]').onclick = go;
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    box.querySelector('[data-a="cancel"]').onclick = () => { SFX.play("back"); closeModal(); };
  });
}

async function netJoin(code) {
  netLeave();
  netStatus("JOINING " + code + "…", "<p>Connecting to your friend's phone.</p>");
  try { await loadPeerLib(); } catch (_) { return netFail("Couldn't load online play. Check your internet connection."); }
  const N = (App.net = { role: "guest", code, conn: null, peer: null });
  const peer = new Peer(NetCfg);
  N.peer = peer;
  peer.on("open", () => {
    const conn = peer.connect(NET_PREFIX + code, { reliable: true, serialization: "json" });
    N.conn = conn;
    wireConn(N, conn);
    N.timer = setTimeout(() => { if (!N.opened && App.net === N) netFail("Couldn't connect to that room. Check the code — and try both phones on Wi-Fi."); }, 14000);
  });
  peer.on("error", (err) => {
    if (App.net !== N) return;
    netFail(err.type === "peer-unavailable" ? `No room called <b>${code}</b>. Check the code with your friend.` : err.type === "network" || err.type === "server-error" || err.type === "socket-error" ? "Couldn't reach the matchmaking server. Check your internet." : "Online error: " + err.type);
  });
}

function netFail(msg) {
  netLeave();
  modal(`<h3>OOPS</h3><p>${msg}</p><div class="acts"><button class="btn sm" style="--c:#2b9cff" data-a="ok">OK</button></div>`, (box) => {
    box.querySelector('[data-a="ok"]').onclick = () => { closeModal(); if (!App.race) { startDemo(); renderTitle(); } };
  });
}

/* ---------------- connection + protocol ---------------- */
function wireConn(N, conn) {
  conn.on("open", () => {
    N.opened = true;
    clearTimeout(N.timer);
    if (N.role === "guest") { conn.send(myHello()); netStatus("CONNECTED!", "<p>Waiting for the host to start the race…</p>"); }
  });
  conn.on("data", (m) => netOnMessage(N, m));
  conn.on("close", () => netLost(N));
  conn.on("error", () => netLost(N));
}

function netSend(m) { const N = App.net; if (N && N.conn && N.conn.open) { try { N.conn.send(m); } catch (_) {} } }

function netOnMessage(N, m) {
  if (App.net !== N || !m || !m.t) return;
  const race = App.race;
  switch (m.t) {
    case "full": netFail("That room already has two riders."); break;
    case "hello": // host receives guest's rider choice → start
      N.guest = m;
      netStartAsHost();
      break;
    case "start": netStartAsGuest(m.cfg); break;
    case "ready": N.ready = true; netMaybeGo(); break;
    case "go": if (race) { race.hold = false; closeModal(); } break;
    case "s": if (race) netApplyState(race, m); break;
    case "ev": if (race) netApplyEvent(race, m); break;
    case "rematch": if (N.role === "host") netStartAsHost(); break;
    case "bye": netLost(N, true); break;
  }
}

function netStartAsHost() {
  const N = App.net;
  const g = N.guest;
  const me = myHello();
  const cfg = {
    trackId: App.pick.track || App.save.last.track, total: 8, difficulty: App.save.settings.diff, botSeed: (Math.random() * 100000) | 0, online: true,
    fav: cutieOn() ? 1 : g.cz ? 0 : null,          // cutie mode on either phone: the OTHER phone's rider always wins
    humans: [{ riderId: me.rider, vehId: me.veh, upg: me.upg, netId: 0 }, { riderId: g.rider, vehId: g.veh, upg: g.upg, netId: 1, remote: true }],
  };
  N.ready = false; N.loaded = false;
  netSend({ t: "start", cfg });
  closeModal();
  netLaunch(cfg);
}

function netStartAsGuest(cfg) {
  // same race, but from the guest's side: rider 0 (host) is remote, rider 1 is us
  const mine = JSON.parse(JSON.stringify(cfg));
  mine.humans[0].remote = true; mine.humans[1].remote = false;
  closeModal();
  netLaunch(mine);
}

async function netLaunch(cfg) {
  const N = App.net;
  App.mode = "online";
  if (App.race) { SFX.enginesOff(); App.race = null; }
  show(null);
  $("#loading .tip").textContent = "TIP: Online hits land on your friend's phone — punch them off the trail!";
  $("#loading").classList.remove("hidden");
  stopDemo();
  App.lastCfg = cfg;
  await launchRace(cfg);
  const race = App.race;
  race.hold = true;
  race.net = { role: N.role, send: netSend, queueHit: (e, amt, by, kind) => netSendHit(race, e, amt, by, kind), hitInfo: null };
  if (N.role === "guest") race.riders.forEach((e) => { if (!e.human) e.remote = true; });
  N.sendT = 0;
  netStatus("GET READY", `<p>Waiting for ${N.role === "host" ? "your friend" : "the host"} to finish loading…</p>`);
  if (N.role === "guest") netSend({ t: "ready" });
  else { N.loaded = true; netMaybeGo(); }
}

function netMaybeGo() {
  const N = App.net;
  if (!N || N.role !== "host" || !N.loaded || !N.ready || !App.race) return;
  netSend({ t: "go" });
  App.race.hold = false;
  closeModal();
}

function riderState(e) {
  return [Math.round(e.z), +e.x.toFixed(3), Math.round(e.h), Math.round(e.speed), +e.lean.toFixed(2), Math.round(e.hp * 10) / 10, Math.round(e.boost),
    (e.boosting ? 1 : 0) | (e.padT > 0 ? 2 : 0) | (e.finished ? 4 : 0) | (e.atkKick ? 8 : 0), +Math.max(0, e.wipeT).toFixed(2), +Math.max(0, e.atkT).toFixed(2), e.atkSide,
    e.trick ? TRICKS.indexOf(e.trick.def) : -1, e.trick ? +(e.trick.t / e.trick.dur).toFixed(2) : 0, +Math.max(0, e.hurtT).toFixed(2), +e.finishTime.toFixed(2)];
}
function netBeforeStep() {}
function netAfterFrame(race, dt) {
  const N = App.net;
  if (!N || !race.net || race.hold) return;
  N.sendT -= dt;
  if (N.sendT > 0) return;
  N.sendT = 1 / 20;
  const m = { t: "s", r: {} };
  race.riders.forEach((e, i) => { if (!e.remote) m.r[i] = riderState(e); });
  netSend(m);
}
function netApplyState(race, m) {
  for (const k in m.r) {
    const e = race.riders[+k];
    if (!e || !e.remote) continue;
    const a = m.r[k];
    const first = !e.net;
    e.net = { z: a[0], x: a[1], h: a[2], speed: a[3], lean: a[4], hp: a[5], boost: a[6], boosting: !!(a[7] & 1), padT: a[7] & 2 ? 0.5 : 0, finished: !!(a[7] & 4), atkKick: !!(a[7] & 8),
      wipeT: a[8], atkT: a[9], atkSide: a[10], trick: a[11] >= 0 ? TRICKS[a[11]].id : null, trickT: a[12], hurtT: a[13], finishTime: a[14], age: 0 };
    if (first) { e.z = a[0]; e.x = a[1]; }
    if (e.net.finished && !e.finished) race.finishOrder.push(e);
  }
}
function netApplyEvent(race, m) {
  if (m.k === "throw") {
    const e = race.riders[m.i];
    if (e) spawnProjectiles(race, e, m.item, m.dir, m.z, m.x, m.sp, m.id);
  } else if (m.k === "pop") {
    race.projs = race.projs.filter((p) => p.id !== m.id);
    const v = race.riders[m.v];
    if (v) for (let k = 0; k < 8; k++) spawnFx(race, v.z, v.x + rnd(-0.2, 0.2), 300 + rnd(-100, 100), "#fff6a8", 50, 0.5, 600);
  } else if (m.k === "take") {
    const s = race.track.segs[m.s];
    if (s && s.objs[m.o]) s.objs[m.o].taken = race.time + RESPAWN_T;
  } else if (m.k === "hit") {
    const e = race.riders[m.v], by = race.riders[m.by];
    if (!e || e.remote) return;
    damage(race, e, m.dmg, by || null, m.kind);
    if (m.slow) e.speed *= m.slow;
    if (m.push) e.vx += m.push;
    e.hurtT = Math.max(e.hurtT, 0.45);
    if (e.human) e.shake = m.kick ? 10 : 5;
    if (m.kind === "melee") race.events.push({ snd: m.dmg > 12 ? "kick" : "punch", e: by || e, target: e });
  }
}
function netSendHit(race, e, amt, by, kind) {
  const info = race.net.hitInfo || {};
  race.net.hitInfo = null;
  netSend({ t: "ev", k: "hit", v: race.riders.indexOf(e), by: race.riders.indexOf(by), dmg: +amt.toFixed(2), kind, slow: info.slow || 0, push: info.push || 0, kick: amt > 12 });
}

function netLost(N, bye) {
  if (App.net !== N || N.lost) return;
  N.lost = true;
  const race = App.race;
  if (race && race.net) {
    // keep racing: the friend's rider (and, for a guest, the bots) switch to computer control
    race.riders.forEach((e) => { if (e.remote) { e.remote = false; if (e.human) { e.human = false; e.name = (e.name || "") + " (left)"; } e.ai = e.ai || { skill: 0.85, aggr: 0.5, t: 0, tx: 0, inp: {} }; } });
    race.net = null;
    race.hold = false;
    race.cfg.fav = null; race.favE = null;
    closeModal();
    toast(bye ? "YOUR FRIEND LEFT" : "CONNECTION LOST");
  } else if (N.opened) {
    netFail(bye ? "Your friend left the room." : "The connection dropped.");
  }
}

function netLeave() {
  const N = App.net;
  if (!N) return;
  App.net = null;
  try { if (N.conn && N.conn.open) N.conn.send({ t: "bye" }); } catch (_) {}
  setTimeout(() => { try { N.conn && N.conn.close(); } catch (_) {} try { N.peer && N.peer.destroy(); } catch (_) {} }, 150);
  clearTimeout(N.timer);
}

function netRematch() {
  const N = App.net;
  if (!N || N.lost) { toast("NOT CONNECTED"); startDemo(); renderTitle(); return; }
  if (N.role === "host") netStartAsHost();
  else { netSend({ t: "rematch" }); netStatus("REMATCH", "<p>Asking the host to start another race…</p>"); }
}

// ===== ui.js =====
/* Menus, progression and screen flow. */

const SAVE_KEY = "wild-riders-save-v1";
function defaultSave() {
  return { v: 1, tl: 2, rl: 2, coins: 500, stars: {}, best: {}, riders: ["kaito", "bruno"], vehs: ["mtb", "bmx"], upg: {},
    last: { rider: "kaito", rider2: "bruno", veh: "mtb", veh2: "bmx", track: "f1" },
    settings: { music: true, sfx: true, diff: 1, gfx: "auto", tone: "arcade" }, seenHelp: false, races: 0 };
}
function loadSave() {
  let raw = null;
  try {
    raw = localStorage.getItem(SAVE_KEY);
    const s = JSON.parse(raw || "null");
    if (s && s.v === 1) return migrateSave(Object.assign(defaultSave(), { tl: 1, rl: 1 }, s, { settings: Object.assign(defaultSave().settings, s.settings || {}), last: Object.assign(defaultSave().last, s.last || {}) }));
  } catch (_) {}
  // Never lose a save we couldn't read: park the raw text under its own key before starting fresh,
  // so it can be restored from Settings → Save Code → RESTORE.
  if (raw) { try { localStorage.setItem(RESCUE_KEY, raw); } catch (_) {} }
  return migrateSave(defaultSave());
}
const RESCUE_KEY = "wild-riders-save-v1-rescue";
// Progress score used to decide whether a stored copy is worth offering back (stars count most, then rides, upgrades, races).
function progressScore(s) {
  if (!s || typeof s !== "object") return 0;
  const st = Object.values(s.stars || {}).reduce((a, b) => a + (+b || 0), 0);
  const up = Array.isArray(s.upgAll) ? s.upgAll.reduce((x, y) => x + (+y || 0), 0) : Object.values(s.upg || {}).reduce((a, l) => a + (Array.isArray(l) ? l.reduce((x, y) => x + (+y || 0), 0) : 0), 0);
  return st * 1000 + (Array.isArray(s.vehs) ? s.vehs.length : 0) * 100 + up * 10 + (+s.races || 0);
}
// Any stored older copy (pre-lineup backup, or an unreadable save parked by loadSave) with MORE progress than now.
function bestStoredCopy() {
  let best = null;
  for (const k of [BACKUP_KEY, RESCUE_KEY]) {
    try {
      const s = JSON.parse(localStorage.getItem(k) || "null");
      if (s && s.v === 1 && progressScore(s) > progressScore(App.save) && (!best || progressScore(s) > progressScore(best))) best = s;
    } catch (_) {}
  }
  return best;
}
function restoreStoredCopy(s) {
  // keep today's spin and style choice; everything else comes from the stored copy, then the normal migrations run
  const keep = { spin: App.save.spin, perk: App.save.perk, tone: App.save.settings.tone };
  const m = migrateSave(Object.assign(defaultSave(), { tl: 1, rl: 1 }, JSON.parse(JSON.stringify(s)), { settings: Object.assign(defaultSave().settings, s.settings || {}, { tone: keep.tone }), last: Object.assign(defaultSave().last, s.last || {}) }));
  if (keep.spin) m.spin = keep.spin;
  if (keep.perk) m.perk = keep.perk;
  delete m.note;
  return m;
}
// Still save format v1. Two one-time migrations, each tracked by a generation number in the save (so they never run twice):
//  `tl` = track-layout generation: the trails were redesigned in generation 2, so best times from older layouts are
//         cleared once (stars, coins, riders, rides and upgrades are kept).
//  `rl` = rider-lineup generation: generation 2 moved Priya to 5th place in the unlock order and made Bruno the free
//         second starter. Everyone's UNLOCKED RIDERS reset to Kaito + Bruno and every coin spent on a rider (at the OLD
//         price) is refunded. NOTHING ELSE is touched: stars, best times, coins, vehicles, upgrades, settings, races.
//         The untouched save is first copied to its own backup key, and a notice is queued for the next title screen.
const BACKUP_KEY = "wild-riders-save-v1-backup-rl1";
function migrateSave(s) {
  if ((s.tl || 1) < 2) { s.best = {}; s.tl = 2; }
  if ((s.rl || 1) < 2) migrateRiders(s);
  if (!Array.isArray(s.upgAll)) s.upgAll = mergeUpgrades(s.upg);
  return s;
}
// Upgrades belong to the PLAYER (save field `upgAll` = [gearing, tires, armor]) and work on every ride.
// They used to be bought per ride (`upg` = { vehId: [..] }). First time a save without `upgAll` loads, each upgrade
// takes the HIGHEST level bought on any ride, so nobody loses anything. The old `upg` is left untouched.
function mergeUpgrades(upg) {
  const out = [0, 0, 0];
  if (upg && typeof upg === "object") for (const l of Object.values(upg)) if (Array.isArray(l)) for (let i = 0; i < 3; i++) out[i] = Math.max(out[i], clamp(Math.floor(+l[i] || 0), 0, 3));
  return out;
}
function myUpg() { return App.save.upgAll || (App.save.upgAll = [0, 0, 0]); }
function migrateRiders(s) {
  try { if (!localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, JSON.stringify(s)); } catch (_) {}   // safety copy of the save as it was before this change
  const owned = Array.isArray(s.riders) ? s.riders : [];
  let refund = 0;
  const paid = [];
  owned.forEach((id) => {
    const c = OLD_RIDER_COST[id], r = RIDERS.find((x) => x.id === id);
    if (c > 0) { refund += c; if (r) paid.push(r.name); }
  });
  s.coins = (Number.isFinite(s.coins) ? s.coins : 0) + refund;
  s.riders = ["kaito", "bruno"];
  s.last = Object.assign({ rider: "kaito", rider2: "bruno" }, s.last || {});
  if (!s.riders.includes(s.last.rider)) s.last.rider = "kaito";
  if (!s.riders.includes(s.last.rider2)) s.last.rider2 = "bruno";
  s.rl = 2;
  s.note = { kind: "lineup", refund, paid };      // shown once on the title screen, then deleted
  return s;
}
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(App.save)); } catch (_) {} }
function totalStars() { return Object.values(App.save.stars).reduce((a, b) => a + b, 0); }
function biomeUnlocked(i) { return totalStars() >= BIOMES[i].unlock; }
// Riders and rides unlock strictly in order: only the first one you don't own yet can be bought.
function nextToUnlock(list, owned) { return list.find((x) => !owned.includes(x.id)) || null; }

/* Secret "cutie mode" switch: hold the 2 PLAYERS · ONE SCREEN button for 2 seconds. Stored outside the save
   (so it never travels in a save code). A tiny pink dot on that button is the only sign it's on. */
const CUTIE_KEY = "wr-cz";
function cutieOn() { try { return localStorage.getItem(CUTIE_KEY) === "1"; } catch (_) { return false; } }
function setCutie(on) { try { localStorage.setItem(CUTIE_KEY, on ? "1" : "0"); } catch (_) {} cutieMark(); }
function cutieMark() { const b = document.querySelector('[data-act="split"]'); if (b) b.classList.toggle("cz", cutieOn()); }
function wireCutieSwitch() {
  const b = document.querySelector('[data-act="split"]');
  if (!b) return;
  let timer = null;
  const start = () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      b.dataset.held = "1";
      setCutie(!cutieOn());
      const h = document.createElement("div");
      h.className = "czpop"; h.textContent = cutieOn() ? "♥" : "♡";
      const r = b.getBoundingClientRect();
      h.style.left = r.right - 30 + "px"; h.style.top = r.top - 4 + "px";
      document.body.appendChild(h); setTimeout(() => h.remove(), 900);
      if (navigator.vibrate) try { navigator.vibrate(20); } catch (_) {}
    }, 2000);
  };
  const cancel = () => { clearTimeout(timer); timer = null; };
  b.addEventListener("pointerdown", start);
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => b.addEventListener(ev, cancel));
  b.addEventListener("contextmenu", (e) => e.preventDefault());
  cutieMark();
}
function encodeSave() { const c = Object.assign({}, App.save); delete c.note; return "WILDR1-" + btoa(unescape(encodeURIComponent(JSON.stringify(c)))); }      // (a pending one-time notice never travels in a code)
function decodeSave(code) {
  try {
    code = code.trim();
    if (!code.startsWith("WILDR1-")) return null;
    const s = JSON.parse(decodeURIComponent(escape(atob(code.slice(7)))));
    return s && s.v === 1 && typeof s.coins === "number" ? s : null;
  } catch (_) { return null; }
}

const App = { save: null, mode: "race", step: 0, pick: { riders: [], vehs: [], track: null }, race: null, demo: null, paused: false, screen: null };

function show(id) {
  $$(".screen").forEach((s) => s.classList.add("hidden"));
  if (id) $("#" + id).classList.remove("hidden");
  App.screen = id;
  $$(".coinv").forEach((c) => (c.textContent = App.save.coins.toLocaleString()));
}
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}
function modal(html, onMount) {
  const m = $("#modal");
  m.querySelector(".mbox").className = "mbox";          // drop any per-popup size class (e.g. the compact What's New)
  m.querySelector(".mbox").innerHTML = html;
  m.classList.remove("hidden");
  onMount && onMount(m.querySelector(".mbox"));
}
function closeModal() { $("#modal").classList.add("hidden"); }

/* ---------- title ---------- */
function renderTitle() {
  // Home screen art: the emblem (no characters) with dust kicking up below it. Redrawn when the tone changes.
  const cast = $("#cast");
  if (cast.dataset.tone !== TONE) {
    cast.dataset.tone = TONE;
    let dust = "";
    for (let i = 0; i < 9; i++) dust += `<i style="left:${8 + i * 10}%;animation-delay:${(i * 0.37) % 2.2}s;animation-duration:${1.8 + (i % 3) * 0.5}s"></i>`;
    cast.innerHTML = `<div class="emblem">${emblemSVG()}</div><div class="dust">${dust}</div>`;
  }
  show("scr-title");
  refreshTitleExtras();
}

/* ---------- rider select ---------- */
function statBars(rows) {
  return `<div class="stats">${rows.map(([n, v, up]) => `<span>${n}</span><div class="bar"><i class="${up ? "up" : ""}" style="width:${Math.round(clamp(v, 0.05, 1) * 100)}%"></i></div>`).join("")}</div>`;
}
function riderStats(r) {
  return [["HEALTH", (r.hp - 50) / 95], ["SPEED", (r.spd - 0.9) / 0.18], ["ACCEL", (r.acc - 0.85) / 0.3], ["HANDLING", (r.hdl - 0.85) / 0.3], ["POWER", (r.pow - 0.6) / 0.8]];
}
function openRider() {
  const p = App.step === "rider2" ? 1 : 0;
  $("#rider-h").textContent = App.mode === "split" ? `PLAYER ${p + 1} · CHOOSE RIDER` : App.mode === "online" ? (App.netRole === "host" ? "HOSTING · CHOOSE RIDER" : "JOINING · CHOOSE RIDER") : "CHOOSE YOUR RIDER";

function scrollSel(wrap) {

/* ---------- track select ---------- */
const biomeThumbs = {};
async function biomeThumb(b) {
  if (biomeThumbs[b.id]) return biomeThumbs[b.id];
  const c = makeCanvas(360, 210), x = c.getContext("2d");
  const g = x.createLinearGradient(0, 0, 0, 120); g.addColorStop(0, b.sky[0]); g.addColorStop(0.7, b.sky[1]); g.addColorStop(1, b.sky[2]);
  x.fillStyle = g; x.fillRect(0, 0, 360, 210);
  x.fillStyle = b.sun; x.beginPath(); x.arc(360 * b.sunX, 210 * b.sunY, 12, 0, TAU); x.fill();
  const far = await svgToCanvas(bgSVG(b, "far"), 1024, 210), near = await svgToCanvas(bgSVG(b, "near"), 1024, 150);
  x.drawImage(far, 0, 0, 720, 148, 0, 4, 360 * 2, 148);
  x.drawImage(near, 0, 0, 720, 110, 0, 60, 360 * 2, 110);
  x.fillStyle = b.ground[0]; x.fillRect(0, 150, 360, 60);
  x.fillStyle = b.edge[1]; x.beginPath(); x.moveTo(168, 128); x.lineTo(192, 128); x.lineTo(330, 210); x.lineTo(30, 210); x.fill();
  x.fillStyle = b.road[0]; x.beginPath(); x.moveTo(171, 128); x.lineTo(189, 128); x.lineTo(310, 210); x.lineTo(50, 210); x.fill();
  const set = BIOME_SCENERY[b.id];
  const ids = [set.near[0][0], set.near[1][0], set.near[0][0]];
  const spots = [[40, 200, 1.0], [320, 196, 0.85], [110, 158, 0.45]];
  for (let i = 0; i < 3; i++) {
    const d = W[ids[i]]; const sc = (130 / d.h) * spots[i][2] * Math.min(1, 1.6 * d.h / d.w);
    const sp = await svgToCanvas(SV.wrap(d.w, d.h, d.svg()), d.w * sc * 1.5, d.h * sc * 1.5);
    x.drawImage(sp, spots[i][0] - (d.w * sc) / 2, spots[i][1] - d.h * sc, d.w * sc, d.h * sc);
  }
  if (b.dark) { x.fillStyle = "rgba(5,10,30,.35)"; x.fillRect(0, 0, 360, 210); }
  biomeThumbs[b.id] = c;
  return c;
}

/* ---------- race flow ---------- */
async function startRace() {
  const tips = ["Tricks fill your boost meter — but land before they finish!", "Every 3rd punch in a row is a heavy KICK.", "Low health = lower top speed. Repair kits are green.",
    "Forks hide boost pads on the riskier side.", "Your ride accelerates by itself — just steer left and right.", "Tap BOOST right as the countdown hits 1 for a PERFECT START.", "Hold a drift until the sparks turn pink for the biggest turbo.", "Yellow arrow signs = hairpin. Ease off or drift!", "Draft right behind a rival to charge boost.", "Swipe down on PUNCH to throw an item backward.", "Quads shove lighter riders out of the way."];
  $("#loading .tip").textContent = "TIP: " + pick(tips);
  $("#loading .lb i").style.width = "5%";
  $("#loading").classList.remove("hidden");
  show(null);
  stopDemo();
  SFX.stopMusic();
  await new Promise((r) => setTimeout(r, 30));
  const humans = [{ riderId: App.pick.riders[0] || App.save.last.rider, vehId: App.pick.vehs[0] || App.save.last.veh, upg: myUpg() }];
  if (App.mode === "split") humans.push({ riderId: App.pick.riders[1] || App.save.last.rider2, vehId: App.pick.vehs[1] || App.save.last.veh2, upg: myUpg() });
  const cfg = { trackId: App.pick.track || App.save.last.track, humans, total: 8, difficulty: App.save.settings.diff };
  if (App.mode === "split" && cutieOn()) cfg.fav = 1;           // secret switch: Player 2 always wins
  App.lastCfg = cfg;
  await launchRace(cfg);
}

async function launchRace(cfg) {
  $("#install").classList.add("hidden");
  const race = await createRace(cfg, (p) => ($("#loading .lb i").style.width = Math.round(10 + p * 90) + "%"));
  App.race = race;
  App.paused = false;
  if (!race.demo && race.humans[0]) applyPerk(race.humans[0]);        // Daily Spin perk (used up by this race)
  resetInput();
  Input.split = race.split;
  Input.enabled = true;
  Input.onPause = pauseRace;
  $("#loading").classList.add("hidden");
  race.humans.forEach((h, i) => SFX.engineStart(i, h.veh.id));
  SFX.music(race.track.biome.music);
  resize();
  if (!App.save.seenHelp && !cfg.online) { App.paused = true; openHelp(() => { App.paused = false; }); }
}

function pauseRace() {
  if (!App.race || App.paused) return;
  const online = !!App.race.net;
  App.paused = !online;            // online races keep running for your friend
  if (online) App.pauseMenu = true;
  SFX.enginesOff();
  modal(`<h3>PAUSED</h3><p>${App.race.track.def.name} · ${App.race.track.biome.name}</p>
    <div class="acts"><button class="btn" style="--c:#2bd96a" data-a="resume">RESUME</button><button class="btn sm" style="--c:#ff8a1c" data-a="restart">RESTART</button><button class="btn sm" style="--c:#13a89e" data-a="help">CONTROLS</button><button class="btn sm ghost" data-a="quit">QUIT</button></div>
    <div class="setrow">Music <span class="seg"><button data-m="1" class="${App.save.settings.music ? "on" : ""}">ON</button><button data-m="0" class="${App.save.settings.music ? "" : "on"}">OFF</button></span></div>
    <div class="setrow">Sound FX <span class="seg"><button data-s="1" class="${App.save.settings.sfx ? "on" : ""}">ON</button><button data-s="0" class="${App.save.settings.sfx ? "" : "on"}">OFF</button></span></div>`, (box) => {

    $$("[data-s]", box).forEach((b) => (b.onclick = () => { App.save.settings.sfx = b.dataset.s === "1"; saveGame(); applySettings(); App.paused = false; pauseRace(); }));

}
function resumeRace() {
  closeModal();
  App.pauseMenu = false;
  if (!App.race) return;
  // solo / one screen: a 3-2-1 before the race moves again, so you don't come back mid-corner
  // (online races never stopped, and a race that hasn't started yet still has its own countdown)
  if (!App.race.net && App.race.countdown <= 0 && !App.race.over) App.race.resumeT = 3;
  App.race.humans.forEach((h, i) => SFX.engineStart(i, h.veh.id));
  App.paused = false;
  App.lastT = 0;
}
function quitRace(restart) {
  SFX.enginesOff();
  Input.enabled = false;
  App.race = null;
  if (App.net && App.mode === "online") netLeave();
  if (restart) return launchRaceFromLast();
  startDemo();
  renderTitle();
  SFX.music(6);
}
async function launchRaceFromLast() {
  $("#loading").classList.remove("hidden");
  stopDemo();
  await launchRace(App.lastCfg);
}

function finishRace() {
  const race = App.race;
  App.race = null;
  Input.enabled = false;
  SFX.enginesOff();
  const sorted = race.riders.slice().sort((a, b) => a.place - b.place);
  const list = $("#res-list");
  list.innerHTML = "";
  sorted.forEach((e) => {
    const row = document.createElement("div");
    row.className = "srow" + (e.human ? " me" : "");
    const tm = e.finished ? fmtTime(e.finishTime) : "+" + Math.max(1, Math.round((race.track.finishZ - e.z) / 2000)) + " s";
    row.innerHTML = `<span class="pl">${e.place}</span><canvas width="96" height="96"></canvas><span>${e.human ? e.name + " · " : ""}${e.rider.name}</span><span style="color:var(--mute);font-size:11px">${e.veh.short}</span><span class="tm">${e.takedowns ? "👊" + e.takedowns + "  " : ""}${tm}</span>`;
    faceIcon(e.rider).then((f) => row.querySelector("canvas").getContext("2d").drawImage(f, 0, 0));
    list.appendChild(row);
  });
  const rw = $("#res-reward");
  const tid = race.track.def.id;
  const starsBefore = totalStars();
  let html = "";
  let coins = 0;
  race.humans.forEach((h, i) => {
    const pay = PAYOUT[h.place - 1] || 50, td = h.takedowns * 40, tk = Math.floor(h.trickPts / 20);
    const mul = h.coinMul > 1 ? h.coinMul : 1;                 // Daily Spin "double coins" perk
    coins += (pay + td + tk) * mul;
    const st = starsForPlace(h.place);
    if (App.mode === "race") {
      App.save.stars[tid] = Math.max(App.save.stars[tid] || 0, st);
      if (h.finished && (!App.save.best[tid] || h.finishTime < App.save.best[tid])) { App.save.best[tid] = h.finishTime; html += `<div class="ln" style="color:var(--teal)"><span>NEW BEST TIME</span><span>${fmtTime(h.finishTime)}</span></div>`; }
    }
    html = `${race.humans.length > 1 ? `<div class="nm" style="font:400 22px Bangers;color:${i ? "var(--hot)" : "var(--teal)"}">PLAYER ${i + 1} — ${ordinal(h.place).toUpperCase()}</div>` : `<div class="big">${ordinal(h.place).toUpperCase()}</div><div class="stars">${[1, 2, 3].map((k) => `<span class="${k <= st ? "" : "off"}">★</span>`).join("")}</div>`}
      <div class="ln"><span>Finish</span><span>+${pay}</span></div><div class="ln"><span>Takedowns × ${h.takedowns}</span><span>+${td}</span></div><div class="ln"><span>Trick points ${h.trickPts}</span><span>+${tk}</span></div>` + (mul > 1 ? `<div class="ln" style="color:var(--sun)"><span>DOUBLE COINS (Daily Spin)</span><span>×2</span></div>` : "") + html;
  });
  App.save.coins += coins;
  App.save.races++;
  html += `<div class="ln" style="font-size:18px;color:var(--sun);border-top:1px solid var(--line);padding-top:6px"><span>COINS EARNED</span><span>+${coins}</span></div>`;
  const starsAfter = totalStars();
  BIOMES.forEach((b) => { if (starsBefore < b.unlock && starsAfter >= b.unlock) html += `<div class="ln" style="color:var(--good)"><span>NEW TRAIL UNLOCKED</span><span>${b.name}</span></div>`; });
  rw.innerHTML = html;
  saveGame();
  const win = race.humans.some((h) => h.place === 1);
  $("#res-h").textContent = win ? "VICTORY!" : race.humans.some((h) => h.place <= 3) ? "PODIUM!" : "RACE OVER";
  // next trail = next unlocked track
  const idx = TRACKS.findIndex((t) => t.id === tid);
  const nxt = TRACKS.slice(idx + 1).find((t) => biomeUnlocked(t.biome));
  const nb = $("#res-next");
  nb.classList.toggle("hidden", !nxt || App.mode === "online");
  nb.onclick = () => { SFX.play("click"); App.pick.track = nxt.id; App.save.last.track = nxt.id; saveGame(); startRace(); };
  $$("#scr-results [data-act]").forEach((b) => (b.onclick = () => {
    SFX.play("click");
    if (b.dataset.act === "menu") { if (App.mode === "online") netLeave(); startDemo(); renderTitle(); SFX.music(6); }
    else if (App.mode === "online") netRematch();
    else launchRaceFromLast();
  }));
  show("scr-results");
  SFX.music(6);
  setTimeout(maybeBackupReminder, 1400);       // every few races: show the save code so a copy lives outside the game
}

/* ---------- attract-mode demo race behind the title ---------- */

  if (App.demo || App.race) return;
  const ids = ["f1", "d1", "g1", "m1", "v1", "t1"].filter((id, i) => biomeUnlocked(i));
  const tid = pick(ids.length ? ids : ["f1"]);

  App.demoLoading = false;
  if (App.race || App.screen !== "scr-title") return;
  race.demo = true;

/* ---------- menu wiring ---------- */
function wireMenus() {
  wireCutieSwitch();
  const ub = document.querySelector("#upd button");
  if (ub) ub.addEventListener("click", () => { SFX.unlock(); SFX.play("click"); applyUpdate(); });
  const sb = document.querySelector("#spin-btn");
  if (sb) sb.addEventListener("click", () => { SFX.unlock(); SFX.play("click"); openDaily(); });
  $$("[data-act]").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.held) { delete b.dataset.held; return; }      // that was the secret long-press, not a tap
    const a = b.dataset.act;
    SFX.unlock();
    if (a === "race" || a === "split") { App.mode = a; App.step = "rider"; App.pick = { riders: [], vehs: [], track: null }; SFX.play("click"); openRider(); }
    if (a === "garage") { App.mode = "garage"; App.step = "veh"; App.pick = { riders: [App.save.last.rider], vehs: [], track: null }; SFX.play("click"); openVeh(); }
    if (a === "settings") { SFX.play("click"); openSettings(); }
    if (a === "online") { SFX.play("click"); openOnline(); }
    if (a === "back") {
      SFX.play("back");
      const s = App.step;
      if (s === "rider") renderTitle();
      else if (s === "veh") { App.step = App.mode === "garage" ? null : "rider"; App.mode === "garage" ? renderTitle() : openRider(); }
      else if (s === "rider2") { App.step = "veh"; openVeh(); }
      else if (s === "veh2") { App.step = "rider2"; openRider(); }
      else if (s === "track") { App.step = App.mode === "split" ? "veh2" : "veh"; openVeh(); }
      else renderTitle();
    }
  }));
}

// ===== spin.js =====
/* Daily Spin: one free wheel spin per day, offered the first time the game is opened that day.
   Prizes: coins, or a one-race perk (start boost, shield, double coins, power throws).
   Save fields: save.spin = { last: "YYYY-MM-DD", streak: n, seen: ms }, save.perk = null | "boost" | "shield" | "double" | "power".
   All of it is optional: saves without these fields load fine and simply get a spin available.
   Clock guard: `seen` remembers the latest time this device has reported, so turning the phone clock BACK never
   creates a new day. (Turning it forward can't be stopped without a server; the game is offline by design.) */

const WHEEL = [
  { id: "c100",  label: "100",    kind: "coins", n: 100,  w: 22 },
  { id: "boost", label: "BOOST",  kind: "perk", perk: "boost",  w: 14, desc: "START BOOST: your next race begins with a full boost meter." },
  { id: "c250",  label: "250",    kind: "coins", n: 250,  w: 16 },
  { id: "shield", label: "SHIELD", kind: "perk", perk: "shield", w: 14, desc: "SHIELD: blocks the first hit you take in your next race." },
  { id: "c500",  label: "500",    kind: "coins", n: 500,  w: 8 },
  { id: "power", label: "POWER",  kind: "perk", perk: "power",  w: 12, desc: "POWER THROWS: you start with 3 throwables and they hit 40% harder for your next race." },
  { id: "c1500", label: "1500",   kind: "coins", n: 1500, w: 2, jackpot: true },
  { id: "double", label: "x2",    kind: "perk", perk: "double", w: 12, desc: "DOUBLE COINS: everything you earn in your next race is doubled." },
];
const PERK_NAMES = { boost: "START BOOST", shield: "SHIELD", power: "POWER THROWS", double: "DOUBLE COINS" };

function spinNow() {                                   // never earlier than the latest time we have seen (clock-rollback guard)
  const sp = App.save.spin || (App.save.spin = { last: "", streak: 0, seen: 0 });
  const t = Math.max(Date.now(), sp.seen || 0);
  sp.seen = t;
  return t;
}
function dayKey(ms) { const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function spinAvailable() { return (App.save.spin ? App.save.spin.last : "") !== dayKey(spinNow()); }
function msToNextSpin() { const t = spinNow(), d = new Date(t); const nx = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime(); return Math.max(0, nx - t); }
function fmtCountdown(ms) { const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return h + ":" + String(m).padStart(2, "0") + ":" + String(x).padStart(2, "0"); }

// Streak after this spin: consecutive days continue it, a missed day restarts at 1. (After day 7 the stored streak is 0.)
function nextStreak() {
  const sp = App.save.spin || {};
  const d = new Date(spinNow());
  const yKey = dayKey(new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1, 12).getTime());     // noon yesterday: safe across DST
  return sp.last === yKey ? (sp.streak || 0) + 1 : 1;
}

function pickWheel(streakDay) {
  const pool = streakDay >= 7 ? WHEEL.filter((s) => s.id === "c500" || s.id === "c1500") : WHEEL;      // 7th day: guaranteed 500+
  const weights = streakDay >= 7 ? pool.map((s) => (s.id === "c1500" ? 1 : 9)) : pool.map((s) => s.w);
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[0];
}

/* Applies the stored perk to the local player's rider at the start of a race, then uses it up. */
function applyPerk(e) {
  const k = App.save.perk;
  if (!k) return;
  if (k === "boost") e.boost = 100;
  if (k === "shield") e.shield = 1;
  if (k === "double") e.coinMul = 2;
  if (k === "power") { e.items = [e.rider.item, e.rider.item, e.rider.item]; e.itemMul = 1.4; }
  App.save.perk = null;
  saveGame();
}

/* ---------- the wheel ---------- */
function wheelSVG() {
  const R = 150, cx = 160, cy = 160, n = WHEEL.length, a = 360 / n;
  const pt = (deg, r) => { const t = (deg - 90) * Math.PI / 180; return [cx + Math.cos(t) * r, cy + Math.sin(t) * r]; };
  const arc = ["#ff3d7f", "#ffb300", "#2b9cff", "#2bd96a", "#ff8a1c", "#8a4dff", "#ffd23f", "#13a89e"];
  const sav = ["#7a1620", "#3a2f2f", "#5a1c1c", "#2c2626", "#6b2216", "#352a2a", "#a8841c", "#4a1c24"];
  let s = `<svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg"><g class="wheel-rot">`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R + 8}" fill="#14101c"/>`;
  WHEEL.forEach((seg, i) => {
    const [x1, y1] = pt(i * a, R), [x2, y2] = pt((i + 1) * a, R);
    const fill = (SAVAGE() ? sav : arc)[i];
    s += `<path d="M${cx} ${cy} L${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}Z" fill="${fill}" stroke="#14101c" stroke-width="3"/>`;
    const mid = i * a + a / 2, [tx, ty] = pt(mid, R * 0.64);
    const big = seg.kind === "coins";
    s += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" transform="rotate(${mid} ${tx.toFixed(1)} ${ty.toFixed(1)})" text-anchor="middle" dominant-baseline="central" font-family="Bangers, Impact, sans-serif" font-size="${seg.label.length > 4 ? 25 : big ? 34 : 30}" fill="#fff" stroke="#14101c" stroke-width="4" paint-order="stroke">${seg.label}</text>`;
    if (seg.jackpot) { const [jx, jy] = pt(mid, R * 0.9); s += `<text x="${jx.toFixed(1)}" y="${jy.toFixed(1)}" transform="rotate(${mid} ${jx.toFixed(1)} ${jy.toFixed(1)})" text-anchor="middle" dominant-baseline="central" font-family="Bangers, Impact, sans-serif" font-size="13" fill="#fff6b0" stroke="#14101c" stroke-width="3" paint-order="stroke">JACKPOT</text>`; }
    if (seg.kind === "coins") { const [dx, dy] = pt(mid, R * 0.34); s += `<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="9" fill="#ffd23f" stroke="#b37b00" stroke-width="3"/>`; }
  });
  s += `<circle cx="${cx}" cy="${cy}" r="26" fill="#14101c"/><circle cx="${cx}" cy="${cy}" r="18" fill="${SAVAGE() ? "#8f0f1a" : "#ffd23f"}"/></g>`;
  s += `<path d="M${cx - 15} 4 L${cx + 15} 4 L${cx} 40Z" fill="#fff" stroke="#14101c" stroke-width="4" stroke-linejoin="round"/></svg>`;
  return s;
}

let spinBusy = false;
function openDaily() {
  const avail = spinAvailable();
  const streakNow = App.save.spin ? App.save.spin.streak || 0 : 0;
  const upcoming = avail ? nextStreak() : streakNow;
  const pips = [1, 2, 3, 4, 5, 6, 7].map((d) => `<i class="${avail ? (d < upcoming ? "on" : d === upcoming ? "now" : "") : (d <= streakNow ? "on" : "")}${d === 7 ? " last" : ""}"></i>`).join("");
  modal(`<div class="spinbox">
      <div class="wheelwrap">${wheelSVG()}</div>
      <div class="spininfo">
        <h3>DAILY SPIN</h3>
        <div class="streak"><span>${avail ? "Day " + upcoming + " of 7" : streakNow === 0 ? "7-day streak complete! A new one starts tomorrow" : "Streak: day " + streakNow + " of 7"}</span><div class="pips">${pips}</div></div>
        <p class="spinmsg" id="spin-msg">${avail ? "One free spin every day. Day 7 of a streak is a guaranteed 500+ coin prize." : "You already spun today. Next spin in <b id='spin-cd'>" + fmtCountdown(msToNextSpin()) + "</b>."}</p>
        <div class="acts"><button class="btn" style="--c:#ff3d7f" id="spin-go" ${avail ? "" : "disabled"}>SPIN!</button><button class="btn sm ghost" id="spin-close">${avail ? "LATER" : "CLOSE"}</button></div>
      </div>
    </div>`, (box) => {
    const wheel = box.querySelector(".wheel-rot");
    const msg = box.querySelector("#spin-msg"), go = box.querySelector("#spin-go"), close = box.querySelector("#spin-close");
    close.onclick = () => { if (spinBusy) return; SFX.play("back"); closeModal(); refreshTitleExtras(); };
    if (!avail) {
      const cd = box.querySelector("#spin-cd");
      const iv = setInterval(() => { if (!document.body.contains(cd)) return clearInterval(iv); cd.textContent = fmtCountdown(msToNextSpin()); }, 1000);
      return;
    }
    go.onclick = () => {
      if (spinBusy || !spinAvailable()) return;
      spinBusy = true; go.disabled = true; close.disabled = true;
      SFX.unlock(); SFX.play("click");
      // decide and SAVE the prize first, so closing the app mid-spin can never give a second spin or lose the prize
      const sp = App.save.spin || (App.save.spin = { last: "", streak: 0, seen: 0 });
      const day = nextStreak();
      const prize = pickWheel(day);
      sp.last = dayKey(spinNow()); sp.streak = day >= 7 ? 0 : day;
      if (prize.kind === "coins") App.save.coins += prize.n; else App.save.perk = prize.perk;
      saveGame();
      // animate: land the chosen slice under the pointer at the top
      const idx = WHEEL.indexOf(prize), a = 360 / WHEEL.length;
      const jitter = (Math.random() - 0.5) * a * 0.6;
      const finalDeg = 360 * 5 + (360 - (idx * a + a / 2 + jitter));
      wheel.style.transformOrigin = "160px 160px";
      wheel.style.transition = "transform 4.2s cubic-bezier(.12,.62,.1,1)";
      requestAnimationFrame(() => requestAnimationFrame(() => { wheel.style.transform = `rotate(${finalDeg}deg)`; }));
      let tick = 0; const tk = setInterval(() => { if (++tick < 22) SFX.play("click"); else clearInterval(tk); }, 170);
      setTimeout(() => {
        clearInterval(tk);
        SFX.play("unlock");
        $$(".coinv").forEach((c) => (c.textContent = App.save.coins.toLocaleString()));
        msg.innerHTML = prize.kind === "coins"
          ? `<b style="color:var(--sun);font:400 30px Bangers">${prize.jackpot ? "JACKPOT! " : ""}+${prize.n} COINS!</b>`
          : `<b style="color:var(--teal);font:400 26px Bangers">${PERK_NAMES[prize.perk]}!</b><br>${prize.desc.split(": ")[1]}`;
        box.querySelector(".streak span").textContent = (day >= 7 ? "Streak complete! Starts again tomorrow" : "Day " + day + " of 7 done. Come back tomorrow");
        close.disabled = false; close.textContent = "NICE!";
        spinBusy = false;
        refreshTitleExtras();
      }, 4400);
    };
  });
}

/* Title-screen extras: the Daily Spin button with its countdown, and a chip showing a waiting perk. */
function refreshTitleExtras() {
  const b = document.querySelector("#spin-btn"), chip = document.querySelector("#perk-chip");
  if (!b || !App.save) return;
  const avail = spinAvailable();
  b.classList.toggle("ready", avail);
  b.querySelector("span").textContent = avail ? "DAILY SPIN" : "SPIN IN " + fmtCountdown(msToNextSpin());
  b.querySelector(".tag").classList.toggle("hidden", !avail);
  if (chip) { chip.classList.toggle("hidden", !App.save.perk); chip.textContent = App.save.perk ? "NEXT RACE: " + PERK_NAMES[App.save.perk] : ""; }
}
setInterval(() => { if (typeof App !== "undefined" && App.save && App.screen === "scr-title") refreshTitleExtras(); }, 1000);

function restoreOffer(after) {
